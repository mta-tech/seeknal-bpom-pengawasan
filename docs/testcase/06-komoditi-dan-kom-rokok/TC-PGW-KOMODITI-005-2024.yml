name: TC_PGW_KOMODITI_005_2024
scenario_id: TC-PGW-KOMODITI-005-2024
verification_date: '2026-08-14'
description: 'Silang `komoditi` dengan periode; menguji kelengkapan filter dari pertanyaan majemuk.'
turns:
- prompt: 'berapa pengawasan iklan dengan komoditi OBAT pada tahun 2024?'
  assert_contains:
  - 'OBAT'
  - '2024'
  assert_any_of:
  -
    - '9.077'
  tolerance_pct: 5
  note: 'SQL LENGKAP:
    SELECT COUNT(*) FROM mv_pengawasan WHERE komoditi = ''OBAT'' AND tgl_start >= ''2024-01-01'' AND tgl_start < ''2025-01-01'';
    
    HASIL DB 14Agu2026 = 9.077. KOLOM: `komoditi` di `mv_pengawasan`. NILAI FILTER ''OBAT'' diambil apa adanya dari data. DUA KOMPONEN: nilai kode dan periode — komponen yang halamannya tidak dibuka akan hilang dari filter secara senyap.'
