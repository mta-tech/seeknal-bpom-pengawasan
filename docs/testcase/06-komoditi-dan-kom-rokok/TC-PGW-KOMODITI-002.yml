name: TC_PGW_KOMODITI_002
scenario_id: TC-PGW-KOMODITI-002
verification_date: '2026-08-14'
description: 'Cacah pengawasan iklan untuk satu nilai `komoditi`; menguji pemetaan istilah ke kode filter yang benar.'
turns:
- prompt: 'berapa pengawasan iklan dengan komoditi PRODUK PANGAN?'
  assert_contains:
  - 'PRODUK PANGAN'
  assert_any_of:
  -
    - '33.788'
  tolerance_pct: 5
  note: 'SQL LENGKAP:
    SELECT COUNT(*) FROM mv_pengawasan WHERE komoditi = ''PRODUK PANGAN'';
    
    HASIL DB 14Agu2026 = 33.788. KOLOM: `komoditi` di `mv_pengawasan`. NILAI FILTER: ''PRODUK PANGAN'' — diambil apa adanya dari data, termasuk spasi dan kapitalisasinya. Jangan mengetik nilai dari ingatan; ambil lewat SELECT DISTINCT lalu pakai persis. ENTITY: COUNT(*) menghitung baris tabel fakta.'
