name: TC_PGW_KOM_PRODUK_PANGA_2025
scenario_id: TC-PGW-KOM-PRODUK-PANGA-2025
verification_date: '2026-08-14'
description: 'Silang komoditi dengan periode; menguji apakah kedua komponen pertanyaan masuk ke filter.'
turns:
- prompt: 'berapa pengawasan iklan komoditi PRODUK PANGAN pada tahun 2025?'
  assert_contains:
  - 'PRODUK PANGAN'
  - '2025'
  assert_any_of:
  -
    - '12.632'
  tolerance_pct: 5
  note: 'SQL LENGKAP:
    SELECT COUNT(*) FROM mv_pengawasan WHERE komoditi = ''PRODUK PANGAN'' AND tgl_start >= ''2025-01-01'' AND tgl_start < ''2026-01-01'';
    
    HASIL DB 14Agu2026 = 12.632. DUA FILTER SEKALIGUS: komoditi dan periode. Keduanya harus muncul di SQL final; komponen yang halamannya tidak dibuka akan hilang dari filter secara senyap. NILAI KOMODITI: ''PRODUK PANGAN'' — ejaan domain ini, tidak berlaku di domain lain.'
