name: TC_PGW_KOMODITI_005_2025
scenario_id: TC-PGW-KOMODITI-005-2025
verification_date: '2026-08-14'
description: 'Silang `komoditi` dengan periode; menguji kelengkapan filter dari pertanyaan majemuk.'
turns:
- prompt: 'berapa pengawasan iklan dengan komoditi OBAT pada tahun 2025?'
  assert_contains:
  - 'OBAT'
  - '2025'
  assert_any_of:
  -
    - '9.453'
  tolerance_pct: 5
  note: 'SQL LENGKAP:
    SELECT COUNT(*) FROM mv_pengawasan WHERE komoditi = ''OBAT'' AND tgl_start >= ''2025-01-01'' AND tgl_start < ''2026-01-01'';
    
    HASIL DB 14Agu2026 = 9.453. KOLOM: `komoditi` di `mv_pengawasan`. NILAI FILTER ''OBAT'' diambil apa adanya dari data. DUA KOMPONEN: nilai kode dan periode — komponen yang halamannya tidak dibuka akan hilang dari filter secara senyap.'
