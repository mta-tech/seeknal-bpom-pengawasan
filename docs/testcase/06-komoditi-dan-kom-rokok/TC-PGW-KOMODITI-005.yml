name: TC_PGW_KOMODITI_005
scenario_id: TC-PGW-KOMODITI-005
verification_date: '2026-08-14'
description: 'Cacah pengawasan iklan untuk satu nilai `komoditi`; menguji pemetaan istilah ke kode filter yang benar.'
turns:
- prompt: 'berapa pengawasan iklan dengan komoditi SUPLEMEN KESEHATAN?'
  assert_contains:
  - 'SUPLEMEN KESEHATAN'
  assert_any_of:
  -
    - '7.821'
  tolerance_pct: 5
  note: 'SQL LENGKAP:
    SELECT COUNT(*) FROM mv_pengawasan WHERE komoditi = ''SUPLEMEN KESEHATAN'';
    
    HASIL DB 14Agu2026 = 7.821. KOLOM: `komoditi` di `mv_pengawasan`. NILAI FILTER: ''SUPLEMEN KESEHATAN'' — diambil apa adanya dari data, termasuk spasi dan kapitalisasinya. Jangan mengetik nilai dari ingatan; ambil lewat SELECT DISTINCT lalu pakai persis. ENTITY: COUNT(*) menghitung baris tabel fakta.'
