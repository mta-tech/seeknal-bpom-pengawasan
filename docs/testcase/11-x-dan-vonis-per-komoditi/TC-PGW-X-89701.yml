description: 'Silang dua kolom berkode; menguji resolusi dua konsep sekaligus.'
turns:
- prompt: 'berapa pengawasan iklan PRODUK PANGAN dengan media iklan MEDIA_LUARRUANG?'
  assert_contains:
  - 'PRODUK PANGAN'
  - 'MEDIA_LUARRUANG'
  assert_any_of:
  -
    - '8.450'
  tolerance_pct: 5
  note: 'SQL LENGKAP:
    SELECT COUNT(*) FROM mv_pengawasan WHERE komoditi = ''PRODUK PANGAN'' AND media_iklan = ''MEDIA_LUARRUANG'';
    
    HASIL DB 14Agu2026 = 8.450. DUA KOLOM BERKODE: `komoditi` = ''PRODUK PANGAN'' dan `media_iklan` = ''MEDIA_LUARRUANG''. Keduanya nilai persis dari data. Bila kolom vonis termasuk di sini, ingat bahwa gradasi dicocokkan dengan pola awalan bila pertanyaannya menyebut keluarga, bukan satu tingkat tertentu.'
