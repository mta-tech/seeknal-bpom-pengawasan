  note: 'SQL LENGKAP:
    SELECT COUNT(*) FROM mv_pengawasan WHERE komoditi = ''ROKOK'' AND media_iklan = ''MEDIA_LUARRUANG'';
    
    HASIL DB 14Agu2026 = 36.376. DUA KOLOM BERKODE: `komoditi` = ''ROKOK'' dan `media_iklan` = ''MEDIA_LUARRUANG''. Keduanya nilai persis dari data. Bila kolom vonis termasuk di sini, ingat bahwa gradasi dicocokkan dengan pola awalan bila pertanyaannya menyebut keluarga, bukan satu tingkat tertentu.'
