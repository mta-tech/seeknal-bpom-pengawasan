name: TC_PGW_JENIS_PEMBUAT_IKLAN_012
scenario_id: TC-PGW-JENIS-PEMBUAT-IKLAN-012
verification_date: '2026-08-14'
description: 'Cacah pengawasan iklan untuk satu nilai `jenis_pembuat_iklan`; menguji pemetaan istilah ke kode filter yang benar.'
turns:
- prompt: 'berapa pengawasan iklan dengan jenis pembuat iklan PERORANGAN?'
  assert_contains:
  - 'PERORANGAN'
  assert_any_of:
  -
    - '4.487'
  tolerance_pct: 5
  note: 'SQL LENGKAP:
    SELECT COUNT(*) FROM mv_pengawasan WHERE jenis_pembuat_iklan = ''PERORANGAN'';
    
    HASIL DB 14Agu2026 = 4.487. KOLOM: `jenis_pembuat_iklan` di `mv_pengawasan`. NILAI FILTER: ''PERORANGAN'' — diambil apa adanya dari data, termasuk spasi dan kapitalisasinya. Jangan mengetik nilai dari ingatan; ambil lewat SELECT DISTINCT lalu pakai persis. ENTITY: COUNT(*) menghitung baris tabel fakta.'
