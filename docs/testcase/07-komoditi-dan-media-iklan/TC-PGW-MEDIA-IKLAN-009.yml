name: TC_PGW_MEDIA_IKLAN_009
scenario_id: TC-PGW-MEDIA-IKLAN-009
verification_date: '2026-08-14'
description: 'Cacah pengawasan iklan untuk satu nilai `media_iklan`; menguji pemetaan istilah ke kode filter yang benar.'
turns:
- prompt: 'berapa pengawasan iklan dengan media iklan CETAK?'
  assert_contains:
  - 'CETAK'
  assert_any_of:
  -
    - '25.032'
  tolerance_pct: 5
  note: 'SQL LENGKAP:
    SELECT COUNT(*) FROM mv_pengawasan WHERE media_iklan = ''CETAK'';
    
    HASIL DB 14Agu2026 = 25.032. KOLOM: `media_iklan` di `mv_pengawasan`. NILAI FILTER: ''CETAK'' — diambil apa adanya dari data, termasuk spasi dan kapitalisasinya. Jangan mengetik nilai dari ingatan; ambil lewat SELECT DISTINCT lalu pakai persis. ENTITY: COUNT(*) menghitung baris tabel fakta.'
