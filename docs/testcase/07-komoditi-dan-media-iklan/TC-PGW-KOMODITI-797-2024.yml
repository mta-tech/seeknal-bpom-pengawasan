name: TC_PGW_KOMODITI_797_2024
scenario_id: TC-PGW-KOMODITI-797-2024
verification_date: '2026-08-14'
description: 'Silang `komoditi` dengan periode; menguji kelengkapan filter dari pertanyaan majemuk.'
turns:
- prompt: 'berapa pengawasan iklan dengan komoditi KOSMETIKA pada tahun 2024?'
  assert_contains:
  - 'KOSMETIKA'
  - '2024'
  assert_any_of:
  -
    - '16.607'
  tolerance_pct: 5
  note: 'SQL LENGKAP:
    SELECT COUNT(*) FROM mv_pengawasan WHERE komoditi = ''KOSMETIKA'' AND tgl_start >= ''2024-01-01'' AND tgl_start < ''2025-01-01'';
    
    HASIL DB 14Agu2026 = 16.607. KOLOM: `komoditi` di `mv_pengawasan`. NILAI FILTER ''KOSMETIKA'' diambil apa adanya dari data. DUA KOMPONEN: nilai kode dan periode — komponen yang halamannya tidak dibuka akan hilang dari filter secara senyap.'
