  assert_contains:
  - 'KECAP MANIS'
  assert_any_of:
  -
    - 'KECAP MANIS'
  tolerance_pct: 5
  note: 'SQL LENGKAP:
    SELECT nama_produk, lower(komoditi), pendaftar, nama_balai FROM mv_pengawasan WHERE tgl_start >= ''2025-01-01'' AND tgl_end <= ''2025-12-31'' GROUP BY nama_produk, lower(komoditi), pendaftar, nama_balai;
    
    DATA YANG DITANYA: mv_pengawasan. BENTUK JAWABAN: daftar rinci, bukan satu angka; sajikan sebagai tabel. Hasilnya daftar: yang diperiksa isi baris teratas, bukan seluruh daftar.;
    HASIL DB 14Agu2026: 41836 baris; baris teratas ''KECAP MANIS''.'
