name: TC_PGW_MEDIA_IKL_389_2024
scenario_id: TC-PGW-MEDIA_IKL-389-2024
verification_date: '2026-08-14'
description: 'Silang `media_iklan` dengan periode; menguji kelengkapan filter dari pertanyaan majemuk.'
turns:
- prompt: 'berapa pengawasan iklan dengan media iklan ELEKTRONIK pada tahun 2024?'
  assert_contains:
  - 'ELEKTRONIK'
  - '2024'
  assert_any_of:
  -
    - '30.224'
  tolerance_pct: 5
  note: 'SQL LENGKAP:
    SELECT COUNT(*) FROM mv_pengawasan WHERE media_iklan = ''ELEKTRONIK'' AND tgl_start >= ''2024-01-01'' AND tgl_start < ''2025-01-01'';
    
    HASIL DB 14Agu2026 = 30.224. KOLOM: `media_iklan` di `mv_pengawasan`. NILAI FILTER ''ELEKTRONIK'' diambil apa adanya dari data. DUA KOMPONEN: nilai kode dan periode — komponen yang halamannya tidak dibuka akan hilang dari filter secara senyap.'
