name: TC_PGW_MEDIA_IKL_009_2024
scenario_id: TC-PGW-MEDIA_IKL-009-2024
verification_date: '2026-08-14'
description: 'Silang `media_iklan` dengan periode; menguji kelengkapan filter dari pertanyaan majemuk.'
turns:
- prompt: 'berapa pengawasan iklan dengan media iklan CETAK pada tahun 2024?'
  assert_contains:
  - 'CETAK'
  - '2024'
  assert_any_of:
  -
    - '9.002'
  tolerance_pct: 5
  note: 'SQL LENGKAP:
    SELECT COUNT(*) FROM mv_pengawasan WHERE media_iklan = ''CETAK'' AND tgl_start >= ''2024-01-01'' AND tgl_start < ''2025-01-01'';
    
    HASIL DB 14Agu2026 = 9.002. KOLOM: `media_iklan` di `mv_pengawasan`. NILAI FILTER ''CETAK'' diambil apa adanya dari data. DUA KOMPONEN: nilai kode dan periode — komponen yang halamannya tidak dibuka akan hilang dari filter secara senyap.'
