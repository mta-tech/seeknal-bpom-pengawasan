name: TC_PGW_MEDIA_IKL_674_2024
scenario_id: TC-PGW-MEDIA_IKL-674-2024
verification_date: '2026-08-14'
description: 'Silang `media_iklan` dengan periode; menguji kelengkapan filter dari pertanyaan majemuk.'
turns:
- prompt: 'berapa pengawasan iklan dengan media iklan MEDIA_LAIN pada tahun 2024?'
  assert_contains:
  - 'MEDIA_LAIN'
  - '2024'
  assert_any_of:
  -
    - '1.821'
  tolerance_pct: 5
  note: 'SQL LENGKAP:
    SELECT COUNT(*) FROM mv_pengawasan WHERE media_iklan = ''MEDIA_LAIN'' AND tgl_start >= ''2024-01-01'' AND tgl_start < ''2025-01-01'';
    
    HASIL DB 14Agu2026 = 1.821. KOLOM: `media_iklan` di `mv_pengawasan`. NILAI FILTER ''MEDIA_LAIN'' diambil apa adanya dari data. DUA KOMPONEN: nilai kode dan periode — komponen yang halamannya tidak dibuka akan hilang dari filter secara senyap.'
