verification_date: '2026-08-14'
description: 'Peringkat nilai `kesimpulan_penilaian_balai`; menguji pengeluaran penanda kosong dari peringkat.'
turns:
- prompt: 'kesimpulan penilaian balai apa yang paling banyak pada pengawasan iklan?'
  assert_contains:
  - 'MK'
  assert_any_of:
  -
    - '111.191'
  tolerance_pct: 5
  note: 'SQL LENGKAP:
    SELECT kesimpulan_penilaian_balai, COUNT(*) AS jumlah FROM mv_pengawasan WHERE kesimpulan_penilaian_balai IS NOT NULL AND btrim(kesimpulan_penilaian_balai) <> '''' GROUP BY 1 ORDER BY 2 DESC LIMIT 5;
    
    HASIL DB 14Agu2026: teratas ''MK'' dengan 111.191. KOLOM: `kesimpulan_penilaian_balai` di `mv_pengawasan`. Baris dengan nilai kosong dikeluarkan lewat `btrim(kesimpulan_penilaian_balai) <> ''''` — penanda kosong bukan kategori dan tidak boleh ikut diperingkat. Sebutkan porsi yang dikeluarkan bila besar.'
