name: TC_PGW_TAHUN_2025
scenario_id: TC-PGW-TAHUN-2025
verification_date: '2026-08-14'
description: 'Cacah pengawasan iklan untuk satu tahun; menguji pemilihan kolom tanggal kanonik.'
turns:
- prompt: 'berapa pengawasan iklan pada tahun 2025?'
  assert_contains:
  - '2025'
  assert_any_of:
  -
    - '48.393'
  tolerance_pct: 5
  note: 'SQL LENGKAP:
    SELECT COUNT(*) FROM mv_pengawasan WHERE tgl_start >= ''2025-01-01'' AND tgl_start < ''2026-01-01'';
    
    HASIL DB 14Agu2026 = 48.393. TANGGAL KANONIK: `tgl_start` di `mv_pengawasan` — kolom tanggal default untuk pertanyaan periode. Kolom tanggal lain di tabel ini menjawab pertanyaan berbeda dan angkanya tidak sama. BATAS RENTANG: pakai perbandingan >= dan < , bukan EXTRACT(YEAR ...) di WHERE — tabel ini tanpa indeks, EXTRACT memaksa pemindaian penuh.'
