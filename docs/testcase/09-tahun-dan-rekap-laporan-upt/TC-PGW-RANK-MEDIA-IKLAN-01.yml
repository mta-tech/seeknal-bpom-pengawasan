name: TC_PGW_RANK_MEDIA_IKLAN_01
scenario_id: TC-PGW-RANK-MEDIA-IKLAN-01
verification_date: '2026-08-14'
description: 'Peringkat nilai `media_iklan`; menguji pengeluaran penanda kosong dari peringkat.'
turns:
- prompt: 'media iklan apa yang paling banyak pada pengawasan iklan?'
  assert_contains:
  - 'ELEKTRONIK'
  assert_any_of:
  -
    - '98.090'
  tolerance_pct: 5
  note: 'SQL LENGKAP:
    SELECT media_iklan, COUNT(*) AS jumlah FROM mv_pengawasan WHERE media_iklan IS NOT NULL AND btrim(media_iklan) <> '''' GROUP BY 1 ORDER BY 2 DESC LIMIT 5;
    
    HASIL DB 14Agu2026: teratas ''ELEKTRONIK'' dengan 98.090. KOLOM: `media_iklan` di `mv_pengawasan`. Baris dengan nilai kosong dikeluarkan lewat `btrim(media_iklan) <> ''''` — penanda kosong bukan kategori dan tidak boleh ikut diperingkat. Sebutkan porsi yang dikeluarkan bila besar.'
