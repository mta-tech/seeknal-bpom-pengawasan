verification_date: '2026-08-14'
description: 'Cacah pengawasan iklan untuk satu nilai `kesimpulan_penilaian_pusat`; menguji pemetaan istilah ke kode filter yang benar.'
turns:
- prompt: 'berapa pengawasan iklan dengan kesimpulan penilaian pusat TMK MINOR?'
  assert_contains:
  - 'TMK MINOR'
  assert_any_of:
  -
    - '2.420'
  tolerance_pct: 5
  note: 'SQL LENGKAP:
    SELECT COUNT(*) FROM mv_pengawasan WHERE kesimpulan_penilaian_pusat = ''TMK MINOR'';
    
    HASIL DB 14Agu2026 = 2.420. KOLOM: `kesimpulan_penilaian_pusat` di `mv_pengawasan`. NILAI FILTER: ''TMK MINOR'' — diambil apa adanya dari data, termasuk spasi dan kapitalisasinya. Jangan mengetik nilai dari ingatan; ambil lewat SELECT DISTINCT lalu pakai persis. ENTITY: COUNT(*) menghitung baris tabel fakta.'
