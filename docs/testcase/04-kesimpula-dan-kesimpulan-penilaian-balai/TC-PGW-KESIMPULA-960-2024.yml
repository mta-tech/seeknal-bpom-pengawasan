name: TC_PGW_KESIMPULA_960_2024
scenario_id: TC-PGW-KESIMPULA-960-2024
verification_date: '2026-08-14'
description: 'Silang `kesimpulan_penilaian_pusat` dengan periode; menguji kelengkapan filter dari pertanyaan majemuk.'
turns:
- prompt: 'berapa pengawasan iklan dengan kesimpulan penilaian pusat TMK pada tahun 2024?'
  assert_contains:
  - 'TMK'
  - '2024'
  assert_any_of:
  -
    - '21.618'
  tolerance_pct: 5
  note: 'SQL LENGKAP:
    SELECT COUNT(*) FROM mv_pengawasan WHERE kesimpulan_penilaian_pusat = ''TMK'' AND tgl_start >= ''2024-01-01'' AND tgl_start < ''2025-01-01'';
    
    HASIL DB 14Agu2026 = 21.618. KOLOM: `kesimpulan_penilaian_pusat` di `mv_pengawasan`. NILAI FILTER ''TMK'' diambil apa adanya dari data. DUA KOMPONEN: nilai kode dan periode — komponen yang halamannya tidak dibuka akan hilang dari filter secara senyap.'
