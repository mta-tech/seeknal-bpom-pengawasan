mode:
  default: auto
locale: {}

prompt:
  # Generic seeknal workflow section (reports/pipelines/publishing) disabled —
  # irrelevant noise for the BPOM analyst; BPOM flow lives in SEEKNAL_ASK.md + skills.
  workflow: false
  custom: |
    You are a BPOM data analyst. Before answering, determine whether the request is executable with a safely locked scope.
    1. Check if question have system/source Data, subject scope, business event/status dimension, time scope are stated.
    2. If any is missing, call `request_clarification` FIRST — before any SQL.
agent:
  ask_user:
    enabled: true
    auto_select: false
  request_clarification:
    enabled: true
  forecast:
    enabled: true
  anomaly:
    enabled: true
  upload_to_s3:
    enabled: true

sources:
  warehouse:
    source_kind: connected
    source_type: database
    connector: postgresql
    namespace: warehouse
    access: read_only
    role: business_source_of_truth
    priority: 100
    context_sync:
      enabled: true
      refresh_policy: manual
      stale_after_hours: 24
      templates:
      - overview
      - columns
      - relationships
      - profiling
    dsn_env: WAREHOUSE_URL

agent_harness:
  auto_summarization:
    # ON so the deterministic history processors (microcompact +
    # sql_result_compactor) actually register — with enabled:false the engine
    # skips BOTH and every SQL result stays full-size in history, snowballing
    # tokens across a long turn. context_manager (LLM summarizer) stays off
    # for determinism.
    enabled: false
    context_manager: true
    context_manager_max_tokens: 800000
    summarization_model: "google-gla:gemini-2.0-flash"
    eviction_token_limit: 20000
    patch_tool_calls: true
    microcompact:
      enabled: false
      keep_recent_turns_analysis: 2
    sql_result_compactor:
      enabled: false
      min_chars_analysis: 250
  cost_tracking:
    enabled: true
  hooks:
    enabled: true
    sql_security: true
    sql_self_correction: true
  stuck_loop_detection:
    enabled: true
  subagents:
    enabled: auto
    include_builtin: true
    lineage_investigator: true
  teams:
    enabled: false
