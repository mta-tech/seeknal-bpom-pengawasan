mode:
  default: auto
locale: {}

prompt:
  workflow: true
  custom: |
    You are a BPOM data analyst. Before answering, determine whether the request is executable with a safely locked scope.
    1. Check if question have system/source Data, subject scope, business event/status dimension, time scope are stated.
    2. If any is missing, call `request_clarification` FIRST — before any SQL.
agent:
  ask_user:
    enabled: true
    auto_select: false # auto-pick recommended option in interactive/TUI mode (no effect in gateway/test mode — use --auto-clarif flag instead)
  request_clarification:
    enabled: true
  # FC2c: enable the deterministic forecast trigger (run_forecast tool, FC2a)
  # and the generic CSV export tool (upload_to_s3, FC2d). Both route compute
  # out of the LLM — the agent only decides WHEN and constructs the SQL.
  forecast:
    enabled: true
  anomaly:
    enabled: true
  upload_to_s3:
    enabled: true
                        
sources: 
  warehouse:
    source_kind: connected
    source_type: database
    connector: postgresql
    namespace: warehouse
    access: read_only
    role: business_source_of_truth
    priority: 100
    context_sync:
      enabled: true
      refresh_policy: manual
      stale_after_hours: 24
      templates:
      - overview
      - columns
      - relationships
      - profiling
    dsn_env: WAREHOUSE_URL

agent_harness:
  auto_summarization:
    enabled: false
    context_manager: true
    context_manager_max_tokens: 800000
    summarization_model: "google-gla:gemini-2.0-flash"
    eviction_token_limit: 20000
    patch_tool_calls: true
    microcompact:
      enabled: false
      keep_recent_turns_analysis: 2
    sql_result_compactor:
      enabled: false
      min_chars_analysis: 250
  cost_tracking:
    enabled: true
  hooks:
    enabled: true
    sql_security: true
    sql_self_correction: true
    # csv_upload_reminder retired: it auto-uploaded every execute_sql result,
    # not just the one behind the final answer. CSV export is now a
    # deliberate one-time agent decision, part of the answering workflow
    # itself (bpom-analyst/SKILL.md), not a per-query hook.
  stuck_loop_detection:
    enabled: true
  subagents:
    enabled: auto
    include_builtin: true
    lineage_investigator: true
  teams:
    enabled: false
