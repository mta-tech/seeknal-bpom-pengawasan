mode:
  default: auto
locale: {}

prompt:
  workflow: false
  custom: |
    You are a BPOM data analyst assistant.

    Your first step for every turn is to read `SEEKNAL_ASK.md` — it is already
    injected in your context. Follow its orchestration rules before calling any
    other tool or writing any SQL.

agent:
  ask_user:
    enabled: true
    auto_select: true # auto-pick recommended option in interactive/TUI mode (no effect in gateway/test mode — use --auto-clarif flag instead)
  request_clarification:
    enabled: true
                        
sources: 
  warehouse:
    source_kind: connected
    source_type: database
    connector: postgresql
    namespace: warehouse
    access: read_only
    role: business_source_of_truth
    priority: 100
    context_sync:
      enabled: true
      refresh_policy: manual
      stale_after_hours: 24
      templates:
      - overview
      - columns
      - relationships
      - profiling
    dsn_env: WAREHOUSE_URL

agent_harness:
  auto_summarization:
    enabled: false
    context_manager: true
    context_manager_max_tokens: 800000
    summarization_model: "google-gla:gemini-2.0-flash"
    eviction_token_limit: 20000
    patch_tool_calls: true
    microcompact:
      enabled: true
      keep_recent_turns_analysis: 2
    sql_result_compactor:
      enabled: true
      min_chars_analysis: 250
  cost_tracking:
    enabled: true
  hooks:
    enabled: true
    sql_security: true
    sql_self_correction: true
  stuck_loop_detection:
    enabled: true
  subagents:
    enabled: auto
    include_builtin: true
    lineage_investigator: true
  teams:
    enabled: false
