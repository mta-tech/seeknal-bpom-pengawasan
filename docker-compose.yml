services:
  seeknal-worker:
    image: ${SEEKNAL_WORKER_IMAGE:-ghcr.io/mta-tech/seeknal-worker:2.9.5}
    container_name: seeknal-worker-bpom-pengawasan
    restart: unless-stopped
    pull_policy: always
    working_dir: /app/project
    env_file:
      - path: .env
        required: false
      - path: .env.worker
        required: true
    environment:
      SEEKNAL_PROJECT_PATH: /app/project
      SEEKNAL_WORKER_TRANSPORT: http
    volumes:
      - type: bind
        source: /home/cbnpom/seeknal-bpom-pengawasan
        target: /app/project
    command: ["--project", "/app/project", "--transport", "http", "--max-concurrency", "20"]
  iba-engine:
    container_name: iba-dev-engine
    image: ${DOCKER_REGISTRY}:${IBA_ENGINE_VERSION:-26.7.0}
    restart: unless-stopped
    env_file: .env.worker
    environment:
      API_KEY: ${IBA_ENGINE_API_KEY:-}
      LOCKED_MODEL: ${LOCKED_MODEL:-autoets}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "6805:8000"
networks:
  default:
    external: true
    name: serving_network
