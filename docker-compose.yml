services:
  seeknal-worker:
    image: ${SEEKNAL_WORKER_IMAGE:-ghcr.io/mta-tech/seeknal-worker:2.9.5}
    container_name: seeknal-worker-bpom-pengawasan
    restart: unless-stopped
    pull_policy: always
    working_dir: /app/project
    env_file:
      - path: .env
        required: false
      - path: .env.worker
        required: true
    environment:
      SEEKNAL_PROJECT_PATH: /app/project
      SEEKNAL_WORKER_TRANSPORT: http
    volumes:
      - type: bind
        source: /home/cbnpom/seeknal-bpom-pengawasan
        target: /app/project
    command: ["--project", "/app/project", "--transport", "http", "--max-concurrency", "20"]
networks:
  default:
    external: true
    name: serving_network
