name: nie_umkm_2023
prompt: berapa jumlah NIE pangan olahan untuk UMKM di ERBA tahun 2023?
sql: |
  SELECT COUNT(DISTINCT main.nomor) AS jumlah_nie_umkm
  FROM warehouse.public.t_produk_3_erba main
  LEFT JOIN warehouse.public.m_trader_rba ref ON main.trader_id = ref.trader_id
  WHERE main.tanggal >= '2023-01-01' AND main.tanggal < '2024-01-01'
    AND main.trader_id NOT IN (5, 17, 50, 85)
    AND main.status IN ('0999','0906','9999')
    AND main.jenis_permohonan IN ('301','305')
    AND TRIM(ref.skala_industri_id::text) IN ('1','2','3')
assertions:
  answer_contains:
    - "UMKM"
    - "Mikro"
    - "Kecil"
    - "Menengah"
    - "2023"
    - "12.407"
  expected_values: false
