name: nie_risiko_tinggi_2023
prompt: berapa jumlah NIE Risiko Tinggi di ERBA tahun 2023?
sql: |
  SELECT COUNT(DISTINCT nomor) AS jumlah_nie_t
  FROM warehouse.public.t_produk_3_erba
  WHERE kategori_dokumen IN ('301','304')
    AND tanggal >= '2023-01-01' AND tanggal < '2024-01-01'
    AND trader_id NOT IN (5, 17, 50, 85)
    AND status IN ('0999','0906','9999')
    AND jenis_permohonan IN ('301','305')
assertions:
  answer_contains:
    - "Risiko Tinggi"
    - "2023"
    - "17.504"
  expected_values: false
