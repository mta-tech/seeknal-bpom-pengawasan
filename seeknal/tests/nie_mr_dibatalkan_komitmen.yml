name: nie_mr_dibatalkan_komitmen_2023
prompt: berapa NIE Risiko Menengah Rendah di ERBA yang dibatalkan komitmen tahun 2023?
sql: |
  SELECT COUNT(DISTINCT nomor) AS jumlah_nie_mr_batal
  FROM warehouse.public.t_produk_3_erba
  WHERE kategori_dokumen = '303'
    AND tanggal >= '2023-01-01' AND tanggal < '2024-01-01'
    AND trader_id NOT IN (5, 17, 50, 85)
    AND status IN ('0999','0906','9999')
    AND jenis_permohonan IN ('301','305')
    AND status_komitmen = '5'
assertions:
  answer_contains:
    - "dibatalkan"
    - "komitmen"
    - "2023"
    - "46"
  answer_not_contains:
    - "2.498"
    - "2,498"
  expected_values: false
