name: nie_per_skala_2023
prompt: berapa jumlah NIE pangan olahan per skala industri di ERBA tahun 2023?
sql: |
  SELECT
    COALESCE(dd.deskripsi, 'Importir') AS skala_industri,
    COUNT(DISTINCT main.nomor) AS jumlah_nie
  FROM warehouse.public.t_produk_3_erba main
  LEFT JOIN warehouse.public.m_trader_rba ref ON main.trader_id = ref.trader_id
  LEFT JOIN warehouse.public.data_dictionary dd
    ON dd.kategori = 'SKALA_INDUSTRI dan SKALA_INDUSTRI_ID'
    AND dd.kode = TRIM(COALESCE(ref.skala_industri_id::text, ''))
  WHERE main.tanggal >= '2023-01-01' AND main.tanggal < '2024-01-01'
    AND main.trader_id NOT IN (5, 17, 50, 85)
    AND main.status IN ('0999','0906','9999')
    AND main.jenis_permohonan IN ('301','305')
  GROUP BY 1
  ORDER BY 2 DESC
assertions:
  answer_contains:
    - "Besar"
    - "Menengah"
    - "Kecil"
    - "Mikro"
    - "Importir"
    - "2023"
  answer_not_contains:
    - " 1 "
    - " 2 "
    - " 3 "
    - " 4 "
  expected_values: false
