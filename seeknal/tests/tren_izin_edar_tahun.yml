name: tren_nie_erba_2020_2023
prompt: bagaimana tren NIE pangan olahan di sistem ERBA dari tahun 2020 sampai 2023?
sql: |
  SELECT EXTRACT(YEAR FROM tanggal)::int AS tahun, COUNT(DISTINCT nomor) AS jumlah_nie
  FROM warehouse.public.t_produk_3_erba
  WHERE tanggal >= '2020-01-01' AND tanggal < '2024-01-01'
    AND trader_id NOT IN (5, 17, 50, 85)
    AND status IN ('0999','0906','9999')
    AND jenis_permohonan IN ('301','305')
  GROUP BY 1 ORDER BY 1
assertions:
  answer_contains:
    - "2022"
    - "2023"
    - "1.417"
  expected_values: false
