name: permohonan_per_jenis_2023
prompt: berapa permohonan pangan olahan per jenis permohonan di ERBA tahun 2023?
sql: |
  SELECT
    CASE g.jenis_permohonan
      WHEN '301' THEN 'Permohonan Baru'
      WHEN '302' THEN 'Perubahan Mayor'
      WHEN '303' THEN 'Perubahan Minor'
      WHEN '304' THEN 'Daftar Ulang'
      WHEN '305' THEN 'Baru Notifikasi'
    END AS jenis,
    COUNT(DISTINCT g.produk_id) AS jumlah_permohonan
  FROM (
    SELECT produk_id, jenis_permohonan FROM warehouse.public.t_produk_3_erba
    WHERE tanggal_bayar >= '2023-01-01' AND tanggal_bayar < '2024-01-01'
      AND jenis_permohonan IN ('301','302','303','304','305')
  ) g
  GROUP BY 1
  ORDER BY 2 DESC
assertions:
  answer_contains:
    - "Permohonan Baru"
    - "Perubahan"
    - "2023"
  answer_not_contains:
    - "kode 301"
    - "kode 302"
  expected_values: false
