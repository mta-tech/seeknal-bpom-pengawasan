name: nie_btp_erba_2023
prompt: berapa jumlah NIE produk BTP di ERBA tahun 2023?
sql: |
  SELECT COUNT(DISTINCT nomor) AS jumlah_nie_btp
  FROM warehouse.public.t_btp_3_erba
  WHERE tanggal >= '2023-01-01' AND tanggal < '2024-01-01'
    AND status IN ('0999','0906','9999')
    AND jenis_permohonan IN ('301','305')
assertions:
  answer_contains:
    - "BTP"
    - "2023"
    - "951"
  expected_values: false
