name: forecasting_permohonan
scenario_id: "MT-011"
description: "Prediksi permohonan 2027 dibandingkan rata-rata bulanan aktual 2023"
turns:
  - prompt: "berapa prediksi jumlah permohonan bulan Juni 2027?"
    assert_contains:
      - "3.052"
      - "2027"
      - "prediksi"
    note: "Query dari tabel forecast_permohonan — bukan dari tabel produk"
  - prompt: "sebagai pembanding, berapa rata-rata permohonan per bulan di ERBA tahun 2023?"
    assert_contains:
      - "2023"
      - "rata-rata"
      - "permohonan"
    note: "Switch ke data aktual — agent harus hitung 42.329 / 12 bulan ≈ 3.527"
  - prompt: "bandingkan prediksi Juni 2027 dengan rata-rata bulanan 2023"
    assert_contains:
      - "prediksi"
      - "2027"
      - "2023"
      - "rata-rata"
    note: "Cross-turn forecast vs aktual — perbandingan harus bulanan vs bulanan (apple to apple)"
