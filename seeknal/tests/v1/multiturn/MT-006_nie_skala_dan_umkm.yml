name: nie_skala_dan_umkm
scenario_id: "MT-006"
description: "Breakdown skala industri lalu agregasi UMKM dan perbandingan"
turns:
  - prompt: "berapa jumlah NIE pangan olahan per skala industri di ERBA tahun 2023?"
    assert_contains:
      - "Besar"
      - "Menengah"
      - "Kecil"
      - "Mikro"
      - "2023"
    note: "Baseline skala industri ERBA 2023 — Besar(14.588), Mikro(5.412), Kecil(4.945), Menengah(1.938)"
  - prompt: "yang termasuk UMKM berapa totalnya?"
    assert_contains:
      - "UMKM"
      - "12.295"
    note: "Agregasi dari T1 — UMKM = Mikro + Kecil + Menengah (kode 1, 2, 3) = 12.295"
  - prompt: "skala mana yang paling banyak?"
    assert_contains:
      - "Besar"
    note: "Ranking dari data T1 — Besar (14.588) adalah yang terbanyak"
  - prompt: "apakah UMKM lebih besar dari non-UMKM?"
    assert_contains:
      - "UMKM"
      - "non-UMKM"
    note: "Cross-turn reasoning — agent harus jelasin perbandingan UMKM vs non-UMKM"
