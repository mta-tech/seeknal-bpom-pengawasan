name: nie_erba_vs_gabungan
scenario_id: "MT-003"
description: "Agent bisa bedain data ERBA saja vs gabungan semua sistem registrasi"
turns:
  - prompt: "berapa total NIE pangan olahan di sistem ERBA yang terbit tahun 2023?"
    assert_contains:
      - "30.230"
      - "2023"
      - "ERBA"
    note: "Baseline ERBA 2023"
  - prompt: "kalau dari semua sistem registrasi di tahun yang sama?"
    assert_contains:
      - "33.306"
      - "2023"
    note: "'Tahun yang sama' = 2023 — agent harus switch dari ERBA ke gabungan (ERBA+ERLA)"
  - prompt: "selisihnya berapa?"
    assert_contains:
      - "3.076"
    note: "Cross-turn calculation — agent harus hitung 33.306 - 30.230 dari T1 dan T2"
  - prompt: "kalau tahun 2022 untuk ERBA?"
    assert_contains:
      - "1.414"
      - "2022"
      - "ERBA"
    note: "Switch tahun, balik ke scope ERBA — user eksplisit sebut ERBA"
  - prompt: "dan semua sistem registrasi 2022?"
    assert_contains:
      - "33.386"
      - "2022"
    note: "Retain 2022, switch ke gabungan — agent harus bedain ERBA vs gabungan"
