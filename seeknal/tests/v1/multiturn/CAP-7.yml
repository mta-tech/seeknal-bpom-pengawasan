name: Month_Cross_Year_Comparison
scenario_id: CAP-7
description: "New capability: 'bulan Mei' tanpa tahun harus tampilkan data Mei dari semua tahun yang ada. DB verified 2026-06-12: NIE Mei 2023=1.705, 2024=2.869, 2025=3.114, 2026=3.775"
turns:
- prompt: Tren NIE pangan olahan bulan Mei dari tahun ke tahun
  assert_contains:
  - Mei
  - '2023'
  - '2024'
  - '2025'
  note: "CAP-7 — Harus tampilkan NIE Mei per tahun: 2023=1.705, 2024=2.869, 2025=3.114, 2026=3.775. Range dari data, bukan hardcoded."
