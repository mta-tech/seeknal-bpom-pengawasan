name: Clarification_Gate_Daerah_Perusahaan_vs_Pabrik
scenario_id: "CLARIF-DAERAH-1"
description: "Uji clarification gate CONCEPT_TYPE: 'produk dari Jakarta Timur' ambigu antara daerah perusahaan/trader dan daerah pabrik."
turns:
  - prompt: "berapa produk pangan olahan yang terdaftar dari Jakarta Timur?"
    assert_contains:
      - "Jakarta Timur"
    note: "Material ambiguity CONCEPT_TYPE: 'dari Jakarta Timur' bisa berarti daerah perusahaan/trader atau daerah pabrik. Agent HARUS tanya basis daerah."
  - prompt: "berdasarkan daerah perusahaan"
    assert_contains:
      - "17.544"
      - "Jakarta Timur"
    note: "Setelah klarifikasi, agent harus lock daerah_trader/daerah perusahaan dan hasilkan 17.544."
  - prompt: "kalau perusahaan di Jakarta Pusat?"
    assert_contains:
      - "10.598"
      - "Jakarta Pusat"
    note: "Follow-up same topic: Jakarta Pusat = 10.598."
  - prompt: "mana yang lebih tinggi?"
    assert_contains:
      - "17.544"
      - "10.598"
      - "Jakarta Timur"
    note: "Agent harus bandingkan dua daerah perusahaan dari ledger."

