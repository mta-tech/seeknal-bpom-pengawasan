name: Clarification_Gate_Organic_vs_Claim
scenario_id: "CLARIF-ORGANIK-1"
description: "Uji clarification gate CONCEPT_TYPE: 'produk khusus/health-oriented' ambigu antara organik, berklaim, atau kategori pemrosesan lain."
turns:
  - prompt: "ada berapa produk khusus yang sehat yang punya izin edar?"
    assert_contains:
      - "produk"
    note: "Material ambiguity CONCEPT_TYPE: user bisa bermaksud organik, pangan berklaim, atau pangan diet. Agent HARUS tanya definisi yang dimaksud."
  - prompt: "yang organik"
    assert_contains:
      - "202"
      - "organik"
    note: "Setelah klarifikasi, agent harus lock pemrosesan=Organik dan hasilkan 202."
  - prompt: "kalau yang berklaim?"
    assert_contains:
      - "256"
      - "berklaim"
    note: "Follow-up same topical family: Pangan Berklaim = 256."
  - prompt: "mana yang lebih banyak?"
    assert_contains:
      - "256"
      - "202"
      - "berklaim"
    note: "Agent harus menyimpulkan berklaim lebih banyak daripada organik."

