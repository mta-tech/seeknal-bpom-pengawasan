name: Clarification_Gate_CompanyRole_Produsen_vs_Importir
scenario_id: "CLARIF-PRODUSEN-IMPORTIR-1"
description: "Uji clarification gate ENTITY: 'perusahaan yang terdaftar di BPOM' ambigu antara produsen, importir, atau keduanya."
turns:
  - prompt: "berapa banyak perusahaan yang terdaftar di BPOM?"
    assert_contains:
      - "perusahaan"
    note: "Material ambiguity ENTITY: user belum spesifik produsen, importir, atau total kategori tertentu. Agent HARUS tanya."
  - prompt: "bandingkan produsen dengan importir"
    assert_contains:
      - "13.525"
      - "1.300"
      - "produsen"
      - "importir"
    note: "Setelah klarifikasi, agent harus lock perbandingan peran perusahaan: Produsen=13.525, Importir=1.300."
  - prompt: "kalau importir saja?"
    assert_contains:
      - "1.300"
      - "importir"
    note: "Follow-up same topic: importir saja tetap 1.300."
  - prompt: "ringkaskan gap-nya"
    assert_contains:
      - "13.525"
      - "1.300"
    note: "Ringkasan harus menekankan bahwa produsen jauh lebih banyak daripada importir."

