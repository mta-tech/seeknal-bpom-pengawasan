name: Plot_Capability_Test
scenario_id: "CLARIF-PLOT-TEST"
description: "Verifikasi execute_python bisa buat matplotlib plot. Tanpa klarifikasi, hanya tes infrastruktur plot."
turns:
  - prompt: "buatkan grafik bar sederhana dengan data: kategori A=10, B=20, C=30"
    assert_contains:
      - "A"
      - "B"
      - "C"
    note: "Plot smoke test. Agent harus gunakan execute_python + matplotlib. Response harus berisi data yang divisualisasi. Plot tersimpan di .ask_plots_{session_id}/."
