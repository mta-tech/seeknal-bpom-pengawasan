name: Clarification_Gate_Expiry_Year_vs_Distribution
scenario_id: "CLARIF-EXPIRY-1"
description: "Uji clarification gate BUSINESS_EVENT + SCOPE: 'izin edar yang akan habis masa berlakunya' ambigu antara hitung satu tahun tertentu atau distribusi semua tahun kadaluarsa."
turns:
  - prompt: "berapa izin edar yang akan habis masa berlakunya?"
    assert_contains:
      - "masa berlaku"
    note: "Material ambiguity SCOPE: user belum menyebut tahun. Agent HARUS tanya apakah yang dimaksud tahun tertentu atau distribusi semua tahun kadaluarsa."
  - prompt: "tahun 2027 saja"
    assert_contains:
      - "1.415"
      - "2027"
      - "kadaluarsa"
    note: "Setelah klarifikasi, agent harus lock tanggal_exp tahun 2027 dan hasilkan 1.415. Verified DB 2026-06-17."
  - prompt: "kalau distribusi per tahun kadaluarsanya, paling banyak kapan?"
    assert_contains:
      - "2030"
      - "44.758"
      - "kadaluarsa"
    note: "Follow-up same topic: distribusi NIE aktif per tahun kadaluarsa. Puncak = 2030 sebanyak 44.758."
  - prompt: "dari yang tahun 2027 itu, kategori risiko mana yang paling banyak?"
    assert_contains:
      - "Menengah Rendah"
      - "1.048"
      - "2027"
    note: "Follow-up same topic: dari total exp 2027, MR paling banyak = 1.048. Verified DB 2026-06-17."
  - prompt: "berapa total semua risiko untuk 2027?"
    assert_contains:
      - "1.415"
      - "2027"
    note: "Agent harus retain konteks exp-2027 dan kembalikan total semua kategori risiko = 1.415."
  - prompt: "ringkaskan early warning-nya dalam satu paragraf"
    assert_contains:
      - "2027"
      - "2030"
      - "Menengah Rendah"
    note: "Ringkasan harus konsisten dengan fakta yang sudah didapat: 2027 total 1.415, tahun terbanyak 2030=44.758, risiko dominan 2027=Menengah Rendah."

