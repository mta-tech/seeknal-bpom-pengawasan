name: Clarification_Gate_AMDK_SystemScope
scenario_id: "CLARIF-AMDK-1"
description: "Uji clarification gate SOURCE_PATH: 'AMDK tahun 2023' ambigu antara ERBA saja, ERLA saja, atau gabungan dua sistem."
turns:
  - prompt: "berapa jumlah izin edar AMDK tahun 2023?"
    assert_contains:
      - "AMDK"
      - "2023"
    note: "Material ambiguity SOURCE_PATH: AMDK 2023 bisa ERBA saja, ERLA saja, atau gabungan. Agent HARUS tanya scope sistem."
  - prompt: "gabungkan dua sistem"
    assert_contains:
      - "2.166"
      - "AMDK"
      - "2023"
    note: "Setelah klarifikasi, agent harus lock ERBA+ERLA dan hasilkan 2.166. Verified DB 2026-06-17."
  - prompt: "pisahkan per sistem"
    assert_contains:
      - "1.743"
      - "423"
      - "ERBA"
      - "ERLA"
    note: "Follow-up same topic: ERBA=1.743 dan ERLA=423."
  - prompt: "kalau tren 2024 sampai 2025 gabungan?"
    assert_contains:
      - "2.514"
      - "2.140"
      - "2024"
      - "2025"
    note: "Follow-up same topic: tren gabungan 2024=2.514 dan 2025=2.140."
  - prompt: "ringkaskan pola AMDK dari data tadi"
    assert_contains:
      - "2.166"
      - "1.743"
      - "423"
      - "2.514"
      - "2.140"
    note: "Ringkasan harus tetap konsisten dengan angka gabungan, breakdown sistem, dan tren."

