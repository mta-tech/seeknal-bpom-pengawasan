name: Clarification_Gate_Risk_MT_SourceScope
scenario_id: "CLARIF-RISK-SCOPE-1"
description: "Uji clarification gate SOURCE_PATH: 'risiko menengah tinggi' ambigu karena ERBA bisa isolasi MT, sedangkan ERLA tidak memiliki granularitas ekuivalen."
turns:
  - prompt: "berapa jumlah izin edar produk pangan dengan risiko menengah tinggi?"
    assert_contains:
      - "Menengah Tinggi"
    note: "Material ambiguity SOURCE_PATH: MT bisa dihitung akurat di ERBA, tetapi ERLA tidak bisa diisolasi secara setara. Agent HARUS tanya scope sistem."
  - prompt: "ERBA saja"
    assert_contains:
      - "11.919"
      - "Menengah Tinggi"
      - "ERBA"
    note: "Setelah klarifikasi, agent harus lock ERBA-only dan hasilkan 11.919. Verified DB 2026-06-17."
  - prompt: "kalau menengah rendah all-time?"
    assert_contains:
      - "41.425"
      - "Menengah Rendah"
    note: "Follow-up same topic and same scope (ERBA-only): MR ERBA all-time = 41.425."
  - prompt: "masih ERBA saja, kalau tinggi notifikasi?"
    assert_contains:
      - "3.500"
      - "Tinggi Notifikasi"
    note: "Follow-up same topic and same system: Tinggi Notifikasi ERBA = 3.500."
  - prompt: "bandingkan ketiganya di ERBA"
    assert_contains:
      - "11.919"
      - "41.425"
      - "3.500"
      - "Menengah Tinggi"
      - "Menengah Rendah"
      - "Tinggi Notifikasi"
    note: "Agent harus bandingkan MT, MR, dan Tinggi Notifikasi dengan tetap menjaga scope ERBA-only."

