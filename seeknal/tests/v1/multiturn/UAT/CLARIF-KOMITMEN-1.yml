name: Clarification_Gate_Komitmen_Disetujui
scenario_id: "CLARIF-KOMITMEN-1"
description: "Uji clarification gate EXACT_VS_FAMILY: 'sudah selesai proses komitmennya' ambigu antara status 4, 7, 4+7, atau bahkan 5. Agent harus klarifikasi sebelum query."
turns:
  - prompt: "berapa produk MR yang sudah selesai proses komitmennya?"
    assert_contains:
      - "komitmen"
    note: "Material ambiguity EXACT_VS_FAMILY: 'selesai proses' bisa berarti status 4 saja, 7 saja, 4+7, atau bahkan 5 (dibatalkan). Agent HARUS klarifikasi sebelum query."
  - prompt: "yang disetujui saja, tanpa catatan"
    assert_contains:
      - "2.717"
      - "Menengah Rendah"
    note: "Setelah klarifikasi, agent harus lock status_komitmen=4 dan hasilkan 2.717. Verified DB 2026-06-17."
  - prompt: "kalau yang disetujui dengan catatan?"
    assert_contains:
      - "11.688"
      - "catatan"
    note: "Follow-up: user ganti ke status_komitmen=7. Agent harus retain konteks MR dan ganti filter. Verified DB 2026-06-17."
  - prompt: "buatkan grafik perbandingan keduanya"
    assert_contains:
      - "2.717"
      - "11.688"
    note: "Plot turn: agent harus buat chart (bar/pie) dari data sebelumnya via execute_python. Response harus berisi data yang divisualisasi."
