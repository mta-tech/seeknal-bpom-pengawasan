name: Clarification_Gate_Permohonan_Masuk
scenario_id: "CLARIF-DISERAHKAN-1"
description: "Uji clarification gate ENTITY: 'permohonan yang masuk tahun 2025' ambigu karena 'masuk' tidak spesifik jenis_permohonan."
turns:
  - prompt: "berapa permohonan?"
    assert_contains:
      - "permohonan"
    note: "Material ambiguity ENTITY: 'masuk' tidak spesifik jenis_permohonan. Bisa berarti semua jenis (301,302,303,304,305), atau hanya baru (301,305), atau termasuk revisi (302) dan minor (303). Agent HARUS tanya."
  - prompt: "semua jenis permohonan tahun 2025"
    assert_contains:
      - "2025"
      - "permohonan"
    note: "Setelah klarifikasi, agent harus hitung semua jenis_permohonan untuk 2025."
  - prompt: "breakdown per jenis permohonan"
    assert_contains:
      - "2025"
      - "permohonan"
    note: "Follow-up: breakdown per jenis. Agent harus retain konteks tahun 2025 dan semua sistem, lalu group by jenis_permohonan."
  - prompt: "buatkan grafik dari breakdown tadi"
    assert_contains:
      - "permohonan"
      - "2025"
    note: "Plot turn: agent harus buat chart (bar/pie) dari breakdown jenis_permohonan via execute_python."
