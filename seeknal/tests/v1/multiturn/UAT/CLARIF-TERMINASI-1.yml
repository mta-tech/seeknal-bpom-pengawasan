name: Clarification_Gate_Lifecycle_Terminasi_vs_Diubah
scenario_id: "CLARIF-TERMINASI-1"
description: "Uji clarification gate BUSINESS_EVENT: 'izin edar yang sudah tidak berlaku lagi' ambigu antara dicabut, dihapus, sudah diubah, atau habis masa berlaku."
turns:
  - prompt: "berapa izin edar yang sudah tidak berlaku lagi?"
    assert_contains:
      - "izin edar"
    note: "Material ambiguity BUSINESS_EVENT: 'tidak berlaku lagi' bisa berarti dicabut/dibatalkan, dihapus, sudah diubah, atau expired. Agent HARUS tanya."
  - prompt: "yang dicabut atau dibatalkan saja"
    assert_contains:
      - "5.237"
      - "dicabut"
    note: "Setelah klarifikasi, agent harus lock status 0009 dan hasilkan 5.237. Verified DB 2026-06-17."
  - prompt: "kalau termasuk yang dihapus juga?"
    assert_contains:
      - "5.237"
      - "246"
      - "5.483"
    note: "Follow-up same topic: terminasi = Dicabut/Dibatalkan 5.237 + Dihapus 246 = total 5.483."
  - prompt: "kalau yang sudah diubah dengan nomor baru?"
    assert_contains:
      - "8.931"
      - "diubah"
    note: "Follow-up same topic: ganti lifecycle state ke Sudah Diubah (9999) = 8.931."
  - prompt: "bandingkan terminasi dengan yang sudah diubah"
    assert_contains:
      - "5.483"
      - "8.931"
      - "terminasi"
    note: "Agent harus bandingkan total terminasi 5.483 vs status Sudah Diubah 8.931."
  - prompt: "buatkan ringkasan lifecycle-nya"
    assert_contains:
      - "5.237"
      - "246"
      - "8.931"
    note: "Ringkasan harus menyebut dicabut/dibatalkan, dihapus, dan sudah diubah dengan angka yang konsisten."

