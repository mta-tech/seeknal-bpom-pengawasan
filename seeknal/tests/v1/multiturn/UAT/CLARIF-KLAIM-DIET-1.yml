name: Clarification_Gate_Berklaim_vs_Diet
scenario_id: "CLARIF-KLAIM-DIET-1"
description: "Uji clarification gate CONCEPT_TYPE: 'produk khusus' ambigu antara pangan berklaim dan pangan diet."
turns:
  - prompt: "ada berapa produk pangan khusus yang sudah punya izin edar?"
    assert_contains:
      - "produk pangan"
    note: "Material ambiguity CONCEPT_TYPE: 'pangan khusus' bisa mengarah ke Pangan Berklaim atau Pangan Diet. Agent HARUS tanya kategori yang dimaksud."
  - prompt: "yang pangan berklaim"
    assert_contains:
      - "256"
      - "berklaim"
    note: "Setelah klarifikasi, agent harus lock Pangan Berklaim = 256."
  - prompt: "kalau pangan diet?"
    assert_contains:
      - "35"
      - "diet"
    note: "Follow-up same topic family: Pangan Diet = 35."
  - prompt: "bandingkan keduanya"
    assert_contains:
      - "256"
      - "35"
      - "berklaim"
      - "diet"
    note: "Agent harus membandingkan dua klasifikasi tanpa mencampur konsepnya."

