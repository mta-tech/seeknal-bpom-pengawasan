name: nie_produk_spesifik
scenario_id: "MT-007"
description: "Tanya NIE tiga produk spesifik satu per satu lalu bandingkan"
turns:
  - prompt: "berapa jumlah NIE produk BTP di ERBA tahun 2023?"
    assert_contains:
      - "950"
      - "BTP"
      - "2023"
    note: "Baseline BTP ERBA 2023"
  - prompt: "kalau Garam Beryodium?"
    assert_contains:
      - "189"
      - "Garam Beryodium"
    note: "Retain ERBA + 2023 — user cuma ganti produk"
  - prompt: "kalau AMDK?"
    assert_contains:
      - "1.743"
      - "AMDK"
    note: "Retain ERBA + 2023 — user cuma ganti produk lagi"
  - prompt: "dari tiga produk itu, mana yang paling banyak?"
    assert_contains:
      - "AMDK"
      - "1.743"
    note: "Cross-turn comparison T1+T2+T3 — AMDK (1.743) > BTP (950) > Garam (189)"
