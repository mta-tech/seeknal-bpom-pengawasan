name: nie_definisi_ke_eksplorasi
scenario_id: "PROD-MT-001"
description: "Dari definisi NIE sampai eksplorasi data: total, risiko, skala, UMKM — context retention test"
turns:
  - prompt: "apa itu NIE?"
    assert_contains:
      - "Nomor Izin Edar"
      - "izin edar"
    note: "Definisi dasar — agent harus jelasin konsep"
  - prompt: "berapa total NIE pangan olahan di sistem ERBA tahun 2024?"
    assert_contains:
      - "ERBA"
      - "2024"
    note: "Baseline angka ERBA 2024"
  - prompt: "kalau per kategori risiko bagaimana?"
    assert_contains:
      - "Risiko Tinggi"
      - "Risiko Menengah"
    note: "Retain ERBA + 2024 — user tidak ulang konteks, agent harus ingat"
  - prompt: "kalau per skala industri?"
    assert_contains:
      - "Besar"
      - "Menengah"
      - "Kecil"
      - "Mikro"
    note: "Ganti dimensi dari risiko ke skala — masih retain ERBA + 2024"
  - prompt: "dari situ, yang UMKM berapa?"
    assert_contains:
      - "UMKM"
      - "Mikro"
      - "Kecil"
    note: "'Dari situ' = referensi implisit ke data skala T4 — UMKM = Mikro+Kecil+Menengah"
