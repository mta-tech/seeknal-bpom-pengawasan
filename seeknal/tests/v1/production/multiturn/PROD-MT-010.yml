name: sql_transparency
scenario_id: "PROD-MT-010"
description: "Agent bisa tunjukkan query SQL yang dipakai dan jelasin field-nya"
turns:
  - prompt: "berapa total NIE pangan olahan di sistem ERBA yang terbit tahun 2024?"
    assert_contains:
      - "ERBA"
      - "2024"
    note: "Baseline angka — turn pembuka sebelum minta SQL"
  - prompt: "tampilkan query SQL yang digunakan untuk menghitung total NIE ERBA 2024 itu"
    assert_contains:
      - "SELECT"
      - "COUNT"
      - "tanggal"
    note: "SQL transparency — query harus pakai field tanggal terbit"
  - prompt: "query itu pake field tanggal apa?"
    assert_contains:
      - "tanggal"
    note: "Validasi logic query — agent harus konfirmasi nama field tanggal"
