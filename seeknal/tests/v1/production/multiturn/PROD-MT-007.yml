name: nie_produk_spesifik
scenario_id: "PROD-MT-007"
description: "Tanya NIE tiga produk spesifik satu per satu lalu bandingkan"
turns:
  - prompt: "berapa jumlah NIE produk BTP di ERBA tahun 2024?"
    assert_contains:
      - "BTP"
      - "2024"
    note: "Baseline BTP ERBA 2024"
  - prompt: "kalau Garam Beryodium?"
    assert_contains:
      - "Garam Beryodium"
    note: "Retain ERBA + 2024 — user cuma ganti produk"
  - prompt: "kalau AMDK?"
    assert_contains:
      - "AMDK"
    note: "Retain ERBA + 2024 — user cuma ganti produk lagi"
  - prompt: "dari tiga produk itu, mana yang paling banyak?"
    assert_contains:
      - "AMDK"
    note: "Cross-turn comparison T1+T2+T3 — AMDK biasanya terbanyak"
