name: UAT_CHAR_LOGAM_1
scenario_id: UAT-CHAR-LOGAM-1
verification_date: '2026-07-23'
description: 'UAT-CHAR-LOGAM-1 — Scope-agnostic. Beda granularitas (ERBA 1 kode, ERLA 2 kode) SEKALIGUS ruang lingkup ambigu: apakah aluminium foil (fleksibel) termasuk "logam atau kaleng"? Dua bacaan diterima, asal berlabel.'
turns:
- prompt: ada berapa produk pangan olahan yang menggunakan kemasan logam atau kaleng di BPOM?
  assert_contains:
  - 'logam'
  assert_any_of:
  -
    - '11.629'
  -
    - '4.664'
    - 'ERBA'
  -
    - '6.965'
    - 'ERLA'
  -
    - '14.132'
    - 'ERLA'
  tolerance_pct: 5
  note: 'SQL ERBA: SELECT COUNT(DISTINCT nomor) FROM t_produk_3_erba WHERE kemasan_id=''5'' AND status IN (''0999'',''0906'',''9999'') AND trader_id::bigint NOT IN (5,17,50,85) AND nomor<>''''. SQL ERLA (kaleng rigid): SELECT COUNT(DISTINCT nomor) FROM t_produk_3_rilis_erla WHERE kemasan_id=''35'' AND status IN (''0099'',''0999'',''0906'',''9999'') AND trader_id<>3384 AND nomor<>''''. DB 23Jul2026: ERBA kode 5 (Logam)=4.664 · ERLA kode 35 (Kaleng)=6.965 · gabungan rigid=11.629. TAMBAHAN: ERLA kode 36 (Aluminium Foil)=14.132 — bila foil ikut dihitung sebagai "logam", sisi ERLA jadi IN (''35'',''36''). BEDA GRANULARITAS: dictionary KEMASAN_ID ERBA kode 5="Logam" (SATU kode untuk semua bahan logam); ERLA memecah jadi 35="Kaleng" dan 36="Aluminium Foil". RUANG LINGKUP AMBIGU (sengaja tidak dipin ke satu angka): "logam atau kaleng" bisa dibaca (a) hanya kemasan logam kaku → ERLA 35 saja, atau (b) semua bahan logam termasuk foil fleksibel → ERLA 35+36. KEDUANYA diterima asalkan jawaban MENYEBUT kode & label yang dipakai; yang TIDAK boleh adalah diam-diam memakai satu bacaan tanpa menyatakan lingkupnya. ENTITY: nomor; nilai lama 6.142/45.286/51.428 memakai produk_id.'
