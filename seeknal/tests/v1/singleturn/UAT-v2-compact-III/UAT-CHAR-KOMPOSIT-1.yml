description: 'UAT-CHAR-KOMPOSIT-1 — Scope-agnostic. CONTOH BEDA GRANULARITAS: ERBA punya SATU kode gabungan (4), ERLA memecahnya jadi DUA (34+37). Re-verified 23Jul2026 dgn entity `nomor`.'
turns:
- prompt: berapa produk pangan olahan yang menggunakan kemasan komposit atau laminat?
  assert_contains:
  - 'komposit'
  assert_any_of:
  -
    - '45.740'
  -
    - '42.379'
    - 'ERBA'
  -
    - '3.361'
    - 'ERLA'
  tolerance_pct: 5
  note: 'SQL ERBA: SELECT COUNT(DISTINCT nomor) FROM t_produk_3_erba WHERE kemasan_id=''4'' AND status IN (''0999'',''0906'',''9999'') AND trader_id::bigint NOT IN (5,17,50,85) AND nomor<>''''. SQL ERLA: SELECT COUNT(DISTINCT nomor) FROM t_produk_3_rilis_erla WHERE kemasan_id IN (''34'',''37'') AND status IN (''0099'',''0999'',''0906'',''9999'') AND trader_id<>3384 AND nomor<>''''. GABUNGAN = COUNT(DISTINCT nomor) atas UNION ALL. DB 23Jul2026: ERBA=42.379 · ERLA=3.361 (34 Karton Laminat=2.620 + 37 Komposit=741) · gabungan=45.740. BEDA GRANULARITAS ERBA vs ERLA (dictionary KEMASAN_ID): ERBA kode 4="Komposit/laminat" — SATU kode mencakup dua konsep; ERLA memecahnya jadi kode 34="Karton Laminat" dan 37="Komposit" — DUA kode terpisah. Karena prompt menanyakan "komposit ATAU laminat" (gabungan konsep), sisi ERLA WAJIB memakai IN (''34'',''37''); memakai salah satu saja akan meng-undercount signifikan. ENTITY: nomor; nilai lama 64.716/9.067/73.783 memakai produk_id.'
