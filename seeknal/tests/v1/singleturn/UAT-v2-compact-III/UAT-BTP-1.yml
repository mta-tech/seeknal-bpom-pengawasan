name: UAT_BTP_1
scenario_id: UAT-BTP-1
verification_date: '2026-07-23'
description: 'UAT-BTP-1 — single-scope by-design (prompt menyebut "di ERBA"), jadi assert_contains WAJIB memuat ''ERBA''. Re-verified 23Jul2026: entity `nomor`, TANPA filter JP, kolom `tanggal`.'
turns:
- prompt: berapa jumlah NIE produk BTP di ERBA tahun 2023?
  assert_contains:
  - 'BTP'
  - '2023'
  - 'ERBA'
  assert_any_of:
  -
    - '951'
  tolerance_pct: 5
  note: 'SQL: SELECT COUNT(DISTINCT nomor) FROM t_btp_3_erba WHERE tanggal::timestamp>=''2023-01-01'' AND tanggal::timestamp<''2024-01-01'' AND status IN (''0999'',''0906'',''9999'') AND nomor<>''''. DB 23Jul2026 = 951. TIGA KOREKSI dari versi lama (yang menghasilkan 1.024): (1) ENTITY — prompt menyebut "NIE" secara harfiah → COUNT(DISTINCT nomor), bukan produk_id; (2) FILTER JP — versi lama memakai jenis_permohonan IN (''301'',''305''), padahal prompt TIDAK menyebut kata "baru" sehingga TIDAK boleh ada filter JP (predikat §4/RC-2); (3) KOLOM TANGGAL — versi lama memakai tanggal_bayar (kolom untuk entity permohonan), yang benar `tanggal` (tanggal terbit) untuk entity NIE (predikat §2). Dictionary STATUS sumber=ERBA: 0999/0906/9999. Pembanding ERLA (t_btp_3_erla, filter setara) ≈ 1 — di luar scope prompt.'
