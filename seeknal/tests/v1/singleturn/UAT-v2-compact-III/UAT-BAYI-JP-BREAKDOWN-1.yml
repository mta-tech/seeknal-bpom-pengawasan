name: UAT_BAYI_JP_BREAKDOWN_1
scenario_id: UAT-BAYI-JP-BREAKDOWN-1
verification_date: '2026-07-23'
description: 'UAT-BAYI-JP-BREAKDOWN-1 — kualitatif (menguji kemampuan breakdown per jenis permohonan untuk entitas spesifik), gabungan ERBA+ERLA.'
turns:
- prompt: dari izin edar formula bayi yang masih berlaku, apakah semuanya permohonan baru atau ada yang perubahan dan daftar ulang?
  assert_contains:
  - 'formula bayi'
  - 'permohonan baru'
  note: 'SQL ERBA: SELECT jenis_permohonan, COUNT(DISTINCT nomor) FROM t_produk_3_erba WHERE jenis_pangan IN (''1301'',''1302'') AND status IN (''0999'',''0906'',''9999'') AND trader_id::bigint NOT IN (5,17,50,85) AND nomor<>'''' GROUP BY 1 ORDER BY 1. SQL ERLA: SELECT jenis_permohonan, COUNT(DISTINCT nomor) FROM t_produk_3_rilis_erla WHERE nama_kategori ILIKE ''Formula Bayi%'' AND status IN (''0099'',''0999'',''0906'',''9999'') AND trader_id<>3384 AND nomor<>'''' GROUP BY 1 ORDER BY 1. DB 23Jul2026 — ERBA (n=61): 301=36 · 302=13 · 303=13 · 305=25. ERLA (n=88): 301=80 · 302=52 · 303=34 · 304=17 · 305=8. Dictionary JENIS_PERMOHONAN sumber="ERBA dan ERLA" — kode SAMA di kedua sistem: 301=Permohonan Baru · 302=Perubahan Mayor · 303=Perubahan Minor · 304=Daftar Ulang · 305=Permohonan Baru Notifikasi. Campuran baru/perubahan/daftar-ulang TERKONFIRMASI di kedua sisi — jawaban tidak boleh mengklaim "semuanya permohonan baru". SUM-OF-PARTITIONS: jumlah per-JP MELEBIHI total distinct (satu nomor bisa melewati beberapa jenis permohonan lewat revisi) — headline wajib dari query global DISTINCT sendiri, jangan menjumlah breakdown (predikat §12-C). Test kualitatif: assert_contains saja, tanpa assert_any_of.'
