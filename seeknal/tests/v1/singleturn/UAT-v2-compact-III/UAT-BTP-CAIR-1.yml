name: UAT_BTP_CAIR_1
scenario_id: UAT-BTP-CAIR-1
verification_date: '2026-07-23'
description: 'UAT-BTP-CAIR-1 — Scope-agnostic. bentuk_sediaan kode SAMA & BERFUNGSI di kedua sistem (beda dari jenis_btp yang rentang kodenya berbeda). Re-verified 23Jul2026 dgn entity `nomor`.'
turns:
- prompt: berapa BTP yang tersedia dalam bentuk cair di BPOM?
  assert_contains:
  - 'cair'
  - 'BTP'
  assert_any_of:
  -
    - '5.263'
  -
    - '2.362'
    - 'ERBA'
  -
    - '2.901'
    - 'ERLA'
  tolerance_pct: 5
  note: 'SQL ERBA: SELECT COUNT(DISTINCT nomor) FROM t_btp_3_erba WHERE bentuk_sediaan=''101'' AND status IN (''0999'',''0906'',''9999'') AND nomor<>''''. SQL ERLA: SELECT COUNT(DISTINCT nomor) FROM t_btp_3_erla WHERE bentuk_sediaan=''101'' AND status IN (''0999'',''0906'',''9999'') AND nomor<>''''. GABUNGAN = COUNT(DISTINCT nomor) atas UNION ALL. DB 23Jul2026: ERBA=2.362 · ERLA=2.901 · gabungan=5.263. Dictionary: BENTUK_SEDIAAN sumber="ERLA dan ERBA" kode 101="Cair/Pasta" — dan berbeda dari JENIS_BTP, kode ini MEMANG berlaku di kedua tabel (ERLA mengembalikan hasil, bukan 0), jadi gabungan sahih di sini. KODE TAK TERDAFTAR: ERBA juga memakai bentuk_sediaan 214 yang tidak ada di dictionary (filter_code §4d). CATATAN status ERLA: tabel t_btp_3_erla tidak memiliki baris status ''0099'', jadi memakai set 3-status maupun 4-status memberi angka identik. ENTITY: nomor; nilai lama 2.780/4.182/6.962 memakai produk_id.'
