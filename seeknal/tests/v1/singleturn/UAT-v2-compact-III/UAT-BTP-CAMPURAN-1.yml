name: UAT_BTP_CAMPURAN_1
scenario_id: UAT-BTP-CAMPURAN-1
verification_date: '2026-07-23'
description: 'UAT-BTP-CAMPURAN-1 — Scope-agnostic multi-value (dua angka: campuran & tunggal). jenis_produk_btp kode SAMA & berfungsi di kedua sistem. Re-verified 23Jul2026 dgn entity `nomor`.'
turns:
- prompt: perbandingan jumlah BTP campuran dengan BTP tunggal berapa?
  assert_contains:
  - 'campuran'
  - 'tunggal'
  assert_any_of:
  -
    - '6.472'
    - '1.552'
  -
    - '2.887'
    - '718'
    - 'ERBA'
  -
    - '3.585'
    - '834'
    - 'ERLA'
  tolerance_pct: 5
  note: 'SQL ERBA: SELECT jenis_produk_btp, COUNT(DISTINCT nomor) FROM t_btp_3_erba WHERE jenis_produk_btp IN (''301'',''302'') AND status IN (''0999'',''0906'',''9999'') AND nomor<>'''' GROUP BY 1. SQL ERLA: idem pada t_btp_3_erla. GABUNGAN per kode = COUNT(DISTINCT nomor) atas UNION ALL masing-masing kode. DB 23Jul2026 — Campuran (302): ERBA=2.887 · ERLA=3.585 · gabungan=6.472. Tunggal (301): ERBA=718 · ERLA=834 · gabungan=1.552. Rasio campuran:tunggal ≈ 4:1. Dictionary: JENIS_PRODUK_BTP sumber="ERLA dan ERBA" kode 301="Tunggal" · 302="Campuran" (303=Perisa, 304=Bahan Penolong di luar scope) — kode ini berlaku di KEDUA tabel (berbeda dari jenis_btp), jadi gabungan sahih. ENTITY: nomor; nilai lama 3.409/855/5.461/1.285 memakai produk_id.'
