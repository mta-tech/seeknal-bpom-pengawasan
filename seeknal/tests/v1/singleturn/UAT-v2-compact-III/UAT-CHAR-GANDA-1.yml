name: UAT_CHAR_GANDA_1
scenario_id: UAT-CHAR-GANDA-1
verification_date: '2026-07-23'
description: 'UAT-CHAR-GANDA-1 — Scope-agnostic. CONTOH BEDA NAMESPACE KODE: kemasan_id ERBA memakai 1–7, ERLA memakai 31–39 — konsep sama, angka kode beda. Re-verified 23Jul2026 dgn entity `nomor`.'
turns:
- prompt: berapa produk pangan olahan yang menggunakan kemasan ganda di BPOM?
  assert_contains:
  - 'kemasan ganda'
  assert_any_of:
  -
    - '58.650'
  -
    - '30.556'
    - 'ERBA'
  -
    - '28.094'
    - 'ERLA'
  tolerance_pct: 5
  note: 'SQL ERBA: SELECT COUNT(DISTINCT nomor) FROM t_produk_3_erba WHERE kemasan_id=''7'' AND status IN (''0999'',''0906'',''9999'') AND trader_id::bigint NOT IN (5,17,50,85) AND nomor<>''''. SQL ERLA: SELECT COUNT(DISTINCT nomor) FROM t_produk_3_rilis_erla WHERE kemasan_id=''38'' AND status IN (''0099'',''0999'',''0906'',''9999'') AND trader_id<>3384 AND nomor<>''''. GABUNGAN = COUNT(DISTINCT nomor) atas UNION ALL. DB 23Jul2026: ERBA=30.556 · ERLA=28.094 · gabungan=58.650. BEDA KODE ERBA vs ERLA (dictionary KEMASAN_ID, dua blok sumber terpisah): ERBA kode 7="Ganda"; ERLA kode 38="Ganda" — konsep identik tapi ANGKA KODE BERBEDA karena namespace-nya terpisah (ERBA 1-7: 1 Kaca/Keramik, 2 Plastik tunggal, 3 Kertas tunggal, 4 Komposit/laminat, 5 Logam, 6 Lainnya, 7 Ganda | ERLA 31-39: 31 Kaca, 32 Plastik, 33 Karton/Kertas, 34 Karton Laminat, 35 Kaleng, 36 Aluminium Foil, 37 Komposit, 38 Ganda, 39 Lain-lain). Memakai kode satu sistem pada tabel sistem lain akan salah total. ENTITY: nomor; nilai lama 39.602/60.850/100.452 memakai produk_id.'
