turns:
- prompt: Total produk formula bayi yang diizinkan BPOM berapa?
  assert_contains:
  - 'formula bayi'
  assert_any_of:
  -
    - '149'
  -
    - '61'
    - 'ERBA'
  -
    - '88'
    - 'ERLA'
  tolerance_pct: 5
  note: 'SQL ERBA: SELECT COUNT(DISTINCT nomor) FROM t_produk_3_erba WHERE jenis_pangan IN (''1301'',''1302'') AND status IN (''0999'',''0906'',''9999'') AND trader_id::bigint NOT IN (5,17,50,85) AND nomor<>''''. SQL ERLA: SELECT COUNT(DISTINCT nomor) FROM t_produk_3_rilis_erla WHERE nama_kategori ILIKE ''Formula Bayi%'' AND status IN (''0099'',''0999'',''0906'',''9999'') AND trader_id<>3384 AND nomor<>''''. GABUNGAN = COUNT(DISTINCT nomor) atas UNION ALL. DB 23Jul2026: ERBA=61 · ERLA=88 · gabungan=149. ENTITY: "produk ... diizinkan" = NIE → nomor (predikat §1); nilai lama 97/305/402 = hitungan produk_id (menggelembung). JENIS_PANGAN tidak terdaftar di dictionary (filter_code §4d) — mapping empiris; detail beda kode ERBA/ERLA ada di UAT-BAYI-1.'
