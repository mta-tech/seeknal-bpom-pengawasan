name: UAT_MAKLOON_1
scenario_id: UAT-MAKLOON-1
verification_date: '2026-07-27'
description: 'UAT-MAKLOON-1 — SCOPE: scope-agnostic. Re-verified 27Jul2026. Kolom status_produk gampang tertukar dengan kolom status (alur kerja) karena namanya mirip padahal isinya jenis produksi.'
turns:
- prompt: berapa produk yang diproduksi secara makloon atau berdasarkan kontrak di BPOM?
  assert_contains:
  - 'makloon'
  assert_any_of:
  -
    - '7.278'
  -
    - '2.232'
    - 'ERBA'
  -
    - '5.046'
    - 'ERLA'
  tolerance_pct: 5
  note: 'SCOPE = scope-agnostic. SQL ERBA SAJA: SELECT COUNT(DISTINCT nomor) FROM t_produk_3_erba WHERE status_produk=''304'' AND status IN (''0999'',''0906'',''9999'') AND trader_id::bigint NOT IN (5,17,50,85) AND nomor<>''''. SQL ERLA SAJA: SELECT COUNT(DISTINCT nomor) FROM t_produk_3_rilis_erla WHERE status_produk=''304'' AND status IN (''0099'',''0999'',''0906'',''9999'') AND trader_id<>3384 AND nomor<>''''. SQL GABUNGAN: SELECT COUNT(DISTINCT nomor) FROM (SELECT nomor FROM t_produk_3_erba WHERE status_produk=''304'' AND status IN (''0999'',''0906'',''9999'') AND trader_id::bigint NOT IN (5,17,50,85) AND nomor<>'''' UNION ALL SELECT nomor FROM t_produk_3_rilis_erla WHERE status_produk=''304'' AND status IN (''0099'',''0999'',''0906'',''9999'') AND trader_id<>3384 AND nomor<>'''') x. DB 27Jul2026: ERBA=2.232 · ERLA=5.046 · gabungan=7.278. KODE + DESKRIPSI: dictionary STATUS_PRODUK kode 304 = "Berdasarkan Kontrak" — inilah istilah resmi untuk makloon; kode ini dipakai dengan arti sama di kedua sistem. Sekeluarga: 301 Diproduksi Sendiri · 302 Impor · 306 Single MD Induk · 307 Single MD Anak. DUA KOLOM BERNAMA MIRIP — JANGAN TERTUKAR: `status_produk` berisi JENIS PRODUKSI (kode 301/302/304/306/307) sedangkan `status` berisi TAHAP ALUR KERJA (kode 0999/0906/9999/0009/...). Keduanya muncul dalam satu WHERE di query ini dengan peran berbeda. Bahaya tambahan: nilai kode 301/302/304 juga dipakai oleh KATEGORI_DOKUMEN, KLASIFIKASI_ID, dan JENIS_PERMOHONAN dengan arti yang sama sekali lain — KOLOM yang menentukan makna, bukan angkanya (filter_code §0). ENTITY: "produk yang diproduksi" = NIE terdaftar → COUNT(DISTINCT nomor) (predikat §1). Pembanding produk_id: ERBA=3.504 · ERLA=13.801 — sisi ERLA menggelembung 2,7x; nilai lama berkas ini (ERLA 13.801) adalah hitungan produk_id murni sedangkan nilai ERBA lama (2.133) mendekati hitungan nomor, sehingga total lama 15.934 mencampur dua satuan. Nilai lama 15.934/2.133/13.801.'
