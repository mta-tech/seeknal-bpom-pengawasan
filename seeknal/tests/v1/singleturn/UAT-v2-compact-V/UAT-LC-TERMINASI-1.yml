name: UAT_LC_TERMINASI_1
scenario_id: UAT-LC-TERMINASI-1
verification_date: '2026-07-27'
description: 'UAT-LC-TERMINASI-1 — SCOPE: scope-agnostic. Re-verified 27Jul2026. Versi lama punya CACAT INTERNAL: prosa note-nya menghitung total 5.483 sementara assert-nya 5.237. Juga contoh nyata bahwa rincian per kode TIDAK selalu menjumlah ke total.'
turns:
- prompt: berapa izin edar yang sudah dicabut atau dihapus BPOM secara keseluruhan?
  assert_contains:
  - 'dicabut'
  assert_any_of:
  -
    - '7.085'
  -
    - '5.833'
    - 'ERBA'
  -
    - '1.252'
    - 'ERLA'
  tolerance_pct: 5
  note: 'SCOPE = scope-agnostic. SQL ERBA SAJA: SELECT COUNT(DISTINCT nomor) FROM t_produk_3_erba WHERE status IN (''0000'',''0009'') AND trader_id::bigint NOT IN (5,17,50,85) AND nomor<>''''. SQL ERLA SAJA: SELECT COUNT(DISTINCT nomor) FROM t_produk_3_rilis_erla WHERE status IN (''0000'',''0009'') AND trader_id<>3384 AND nomor<>''''. SQL GABUNGAN: SELECT COUNT(DISTINCT nomor) FROM (SELECT nomor FROM t_produk_3_erba WHERE status IN (''0000'',''0009'') AND trader_id::bigint NOT IN (5,17,50,85) AND nomor<>'''' UNION ALL SELECT nomor FROM t_produk_3_rilis_erla WHERE status IN (''0000'',''0009'') AND trader_id<>3384 AND nomor<>'''') x. DB 27Jul2026: ERBA=5.833 · ERLA=1.252 · gabungan=7.085. RINCIAN PER KODE (dictionary STATUS): 0009 "Dicabut/Dibatalkan" → ERBA=5.598 · ERLA=1.240; 0000 "Dihapus/Dibatalkan" → ERBA=246 · ERLA=12. RINCIAN TIDAK MENJUMLAH KE TOTAL — DAN ITU BENAR (predikat §12-C): di ERBA 5.598 + 246 = 5.844 sedangkan total DISTINCT-nya 5.833, karena 11 nomor punya baris di KEDUA kode (satu NIE bisa dicabut lalu dihapus). Total WAJIB diambil dari satu query DISTINCT global, bukan dari penjumlahan rincian; dan bila menampilkan rincian, sebutkan singkat bahwa jumlahnya bisa tidak sama dengan total. Inilah juga sumber cacat versi lama yang menulis 5.483 di prosa tapi 5.237 di assert. KODE FILTER ERBA vs ERLA: kode 0000 dan 0009 SAMA di kedua sistem. TAPI HATI-HATI dgn kode ketiga: ERLA punya 0099 "Tidak Berlaku" yang di berkas lain masuk daftar status TERDAFTAR (tier pernah-terbit), sedangkan di sini TIDAK dimasukkan sebagai terminasi — 0099 berarti masa berlakunya habis, bukan dicabut oleh otoritas. Jangan mencampur "kedaluwarsa" dengan "dicabut": keduanya dimensi terpisah (filter_code §4c). ENTITY: "izin edar" → COUNT(DISTINCT nomor) (predikat §1); pembanding produk_id: ERBA=5.985 · ERLA=2.078 — nilai ERLA lama (2.078) adalah hitungan produk_id. TANPA filter status NIE sah: populasi yang ditanya justru didefinisikan oleh status terminasi itu sendiri; menumpuk filter status sah akan mengosongkannya (predikat §3). Nilai lama 7.315/5.237/2.078.'
