name: UAT_LC_DIUBAH_1
scenario_id: UAT-LC-DIUBAH-1
verification_date: '2026-07-27'
description: 'UAT-LC-DIUBAH-1 — SCOPE: scope-agnostic. Re-verified 27Jul2026. Kasus di mana pilihan entity mengubah angka paling drastis: status 9999 justru MENANDAI baris revisi, sehingga produk_id menggelembung 2,6x di sisi ERLA.'
turns:
- prompt: berapa izin edar yang sudah diperbarui dengan nomor baru di BPOM?
  assert_contains:
  - 'diubah'
  assert_any_of:
  -
    - '86.204'
  -
    - '7.500'
    - 'ERBA'
  -
    - '78.704'
    - 'ERLA'
  tolerance_pct: 5
  note: 'SCOPE = scope-agnostic. SQL ERBA SAJA: SELECT COUNT(DISTINCT nomor) FROM t_produk_3_erba WHERE status=''9999'' AND trader_id::bigint NOT IN (5,17,50,85) AND nomor<>''''. SQL ERLA SAJA: SELECT COUNT(DISTINCT nomor) FROM t_produk_3_rilis_erla WHERE status=''9999'' AND trader_id<>3384 AND nomor<>''''. SQL GABUNGAN: SELECT COUNT(DISTINCT nomor) FROM (SELECT nomor FROM t_produk_3_erba WHERE status=''9999'' AND trader_id::bigint NOT IN (5,17,50,85) AND nomor<>'''' UNION ALL SELECT nomor FROM t_produk_3_rilis_erla WHERE status=''9999'' AND trader_id<>3384 AND nomor<>'''') x. DB 27Jul2026: ERBA=7.500 · ERLA=78.704 · gabungan=86.204. KODE: status 9999 = "Sudah Diubah" — kode SAMA di kedua sistem. ENTITY — DI SINI PENGARUHNYA PALING BESAR (predikat §1): status 9999 adalah penanda BARIS REVISI, dan satu NIE bisa direvisi berkali-kali sehingga punya banyak baris 9999 sekaligus. Hitungan produk_id: ERBA=9.838 · ERLA=205.497; hitungan nomor: ERBA=7.500 · ERLA=78.704. Di sisi ERLA selisihnya 2,6x — inilah contoh paling tajam mengapa COUNT(*) dan COUNT(DISTINCT produk_id) dilarang untuk pertanyaan bertema NIE. Nilai lama berkas ini (ERLA 205.497) adalah hitungan produk_id murni, itu sebab total lama 214.428 jauh di atas 86.204. MAKNA BISNIS YANG HARUS DISAMPAIKAN: 9999 berarti izin tersebut sudah digantikan versi lebih baru — jadi ini BUKAN izin yang sedang berlaku (itu 0999, lihat UAT-LC-AKTIF-1) dan BUKAN pula izin yang dicabut (0009/0000, lihat UAT-LC-TERMINASI-1). Ketiganya kelas berbeda dan tidak boleh dijumlahkan menjadi "total izin bermasalah". TIMPANG ANTAR SISTEM: ERLA 78.704 vs ERBA 7.500 — wajar karena ERLA menampung 14 tahun riwayat revisi sementara ERBA baru berjalan sejak akhir 2022; jawaban wajib memecah per sistem agar tidak terbaca seolah tingkat revisi keduanya setara. Nilai lama 214.428/8.931/205.497.'
