name: UAT_JP_TREN_1
scenario_id: UAT-JP-TREN-1
verification_date: '2026-07-27'
description: 'UAT-JP-TREN-1 — SCOPE: scope-agnostic. Re-verified 27Jul2026. Pertanyaan TREN: jawaban tidak boleh satu angka saja, wajib tabel tahun x jenis permohonan dari SATU GROUP BY (predikat §12-C). Angka yang di-assert hanyalah jangkar (JP baru 2025).'
turns:
- prompt: bagaimana tren jenis permohonan izin edar dari tahun ke tahun, apakah lebih banyak yang baru atau perubahan?
  assert_contains:
  - '2025'
  - 'permohonan baru'
  assert_any_of:
  -
    - '45.557'
  -
    - '45.458'
    - 'ERBA'
  -
    - '99'
    - 'ERLA'
  tolerance_pct: 5
  note: 'SCOPE = scope-agnostic. SQL ERBA SAJA (bentuk tabel, BUKAN satu angka): SELECT to_char(NULLIF(tanggal_bayar,'''')::timestamp,''YYYY'') thn, jenis_permohonan, COUNT(DISTINCT produk_id) FROM t_produk_3_erba WHERE NULLIF(tanggal_bayar,'''')::timestamp>=''2022-01-01'' AND NULLIF(tanggal_bayar,'''')::timestamp<''2027-01-01'' AND status IN (''0999'',''0906'',''9999'') AND trader_id::bigint NOT IN (5,17,50,85) GROUP BY 1,2 ORDER BY 1,2. SQL ERLA SAJA: SELECT to_char(tanggal_bayar,''YYYY'') thn, jenis_permohonan, COUNT(DISTINCT produk_id) FROM t_produk_3_rilis_erla WHERE tanggal_bayar>=''2022-01-01'' AND tanggal_bayar<''2027-01-01'' AND status IN (''0099'',''0999'',''0906'',''9999'') AND trader_id<>3384 GROUP BY 1,2 ORDER BY 1,2. SQL GABUNGAN: bungkus kedua SELECT di atas (kolom thn, jenis_permohonan, produk_id) dengan UNION ALL lalu GROUP BY 1,2 dengan COUNT(DISTINCT produk_id) di lapisan luar. DB 27Jul2026 — ERBA (301 baru · 302 mayor · 303 minor · 305 baru notifikasi): 2022 = 3.702 · - · - · 37; 2023 = 34.709 · 1.091 · 1.554 · 403; 2024 = 31.027 · 3.360 · 6.187 · 725; 2025 = 45.458 · 8.182 · 9.258 · 2.334; 2026 s/d Jul = 15.441 · 3.568 · 5.997 · 1.845. ERLA: 2022 = 17.752 · 15.116 · 10.161 · 1.694; 2023 = 1.079 · 8.450 · 8.871 · 44; 2024 = 203 · 5.078 · 5.955 · 20; 2025 = 99 · 2.278 · 2.988 · 10; 2026 = 5 · 324 · 645 · -. JAWABAN TREN: permohonan BARU tetap terbanyak setiap tahun di ERBA, TETAPI perubahan tumbuh jauh lebih cepat — rasio baru:perubahan (302+303) di ERBA menyempit dari 13:1 (2023: 34.709 vs 2.645) menjadi 2,6:1 (2025: 45.458 vs 17.440). Di ERLA polanya terbalik: sejak 2023 sistem legacy hampir tidak menerima permohonan baru lagi (1.079 lalu 203 lalu 99) dan isinya tinggal perubahan atas produk lama — inilah tanda migrasi ERLA ke ERBA. Menyajikan hanya angka gabungan akan menyembunyikan pembalikan pola ini; jawaban WAJIB memecah per sistem. ENTITY: "jenis permohonan" → COUNT(DISTINCT produk_id) (predikat §1). KOLOM TANGGAL: tanggal_bayar (predikat §2). KODE (dictionary JENIS_PERMOHONAN, SAMA di kedua sistem): 301 Permohonan Baru · 302 Perubahan Mayor · 303 Perubahan Minor · 304 Daftar Ulang · 305 Permohonan Baru Notifikasi. Kode 304 nyaris kosong di kedua sistem — sebutkan bila menampilkan seluruh keluarga kode. CATATAN 2026: tahun berjalan (data s/d Jul) — jangan dibandingkan langsung dgn tahun penuh tanpa menandai bahwa periodenya belum lengkap. Nilai lama 43.241/43.142/99 (tol 0) — sisi ERBA lama memakai entity nomor, sisi ERLA memakai produk_id.'
