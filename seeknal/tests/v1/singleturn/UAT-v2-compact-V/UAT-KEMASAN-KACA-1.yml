name: UAT_KEMASAN_KACA_1
scenario_id: UAT-KEMASAN-KACA-1
verification_date: '2026-07-27'
description: 'UAT-KEMASAN-KACA-1 — SCOPE: scope-agnostic. Re-verified 27Jul2026. CONTOH UTAMA kode filter BERBEDA antar sistem: kaca = kemasan_id 1 di ERBA tapi 31 di ERLA — dan deskripsi dictionary-nya pun tidak identik.'
turns:
- prompt: berapa produk yang pakai kemasan kaca atau keramik di BPOM?
  assert_contains:
  - 'kaca'
  assert_any_of:
  -
    - '34.371'
  -
    - '14.548'
    - 'ERBA'
  -
    - '19.823'
    - 'ERLA'
  tolerance_pct: 5
  note: 'SCOPE = scope-agnostic. SQL ERBA SAJA: SELECT COUNT(DISTINCT nomor) FROM t_produk_3_erba WHERE kemasan_id=''1'' AND status IN (''0999'',''0906'',''9999'') AND trader_id::bigint NOT IN (5,17,50,85) AND nomor<>''''. SQL ERLA SAJA (PERHATIKAN KODENYA BERBEDA): SELECT COUNT(DISTINCT nomor) FROM t_produk_3_rilis_erla WHERE kemasan_id=''31'' AND status IN (''0099'',''0999'',''0906'',''9999'') AND trader_id<>3384 AND nomor<>''''. SQL GABUNGAN: SELECT COUNT(DISTINCT nomor) FROM (SELECT nomor FROM t_produk_3_erba WHERE kemasan_id=''1'' AND status IN (''0999'',''0906'',''9999'') AND trader_id::bigint NOT IN (5,17,50,85) AND nomor<>'''' UNION ALL SELECT nomor FROM t_produk_3_rilis_erla WHERE kemasan_id=''31'' AND status IN (''0099'',''0999'',''0906'',''9999'') AND trader_id<>3384 AND nomor<>'''') x. DB 27Jul2026: ERBA=14.548 · ERLA=19.823 · gabungan=34.371. KODE FILTER ERBA vs ERLA — BERBEDA, WAJIB DITERJEMAHKAN (filter_code §4): dictionary KEMASAN_ID punya DUA blok terpisah. Blok sumber=ERBA: 1 Kaca atau Keramik · 2 Plastik tunggal (monolayer) · 3 kertas · 4 komposit · 5 logam · 6 lainnya · 7 ganda. Blok sumber=ERLA: 31 Kaca · 32 Plastik (Metalized, PS, PP, PET, LDPE, HDPE) · 33 kertas/karton · 34 karton laminat · 35 kaleng · 36 aluminium foil · 37 komposit · 38 ganda · 39 lainnya. Menjalankan kemasan_id=''1'' di ERLA menghasilkan angka yang tidak berarti, dan kemasan_id=''31'' di ERBA menghasilkan nol — JANGAN pernah memakai kode satu sistem di sistem lain. CAKUPAN ISTILAH TIDAK PERSIS SAMA: kode ERBA 1 berbunyi "Kaca atau Keramik" (keramik ikut), kode ERLA 31 hanya "Kaca". Jadi angka gabungan menggabungkan dua definisi yang sedikit berbeda lebarnya — sebutkan keterbatasan ini bila pertanyaannya menyoal keramik secara spesifik. Untuk rincian lebih halus tersedia kategori SUB_KEMASAN_ID. ENTITY: "produk yang pakai kemasan" = NIE terdaftar → COUNT(DISTINCT nomor) (predikat §1). Pembanding entity produk_id: ERBA=16.647 · ERLA=33.709 — nilai lama berkas ini (ERBA 14.154 mendekati hitungan nomor, ERLA 33.709 persis hitungan produk_id) mencampur dua satuan, itu sebabnya total lama 47.863 jauh di atas 34.371. Nilai lama 47.863/14.154/33.709.'
