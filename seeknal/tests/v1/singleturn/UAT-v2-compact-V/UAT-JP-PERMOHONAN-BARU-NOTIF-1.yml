name: UAT_JP_PERMOHONAN_BARU_NOTIF_1
scenario_id: UAT-JP-PERMOHONAN-BARU-NOTIF-1
verification_date: '2026-07-27'
description: 'UAT-JP-PERMOHONAN-BARU-NOTIF-1 — SCOPE: scope-agnostic. Re-verified 27Jul2026. Timpang ekstrem (ERLA hanya 10) sehingga angka ERLA wajib disebut apa adanya, bukan dilebur ke total.'
turns:
- prompt: berapa permohonan baru notifikasi yang terbit tahun 2025?
  assert_contains:
  - 'notifikasi'
  - '2025'
  assert_any_of:
  -
    - '2.344'
  -
    - '2.334'
    - 'ERBA'
  -
    - '10'
    - 'ERLA'
  tolerance_pct: 5
  note: 'SCOPE = scope-agnostic. SQL ERBA SAJA: SELECT COUNT(DISTINCT produk_id) FROM t_produk_3_erba WHERE jenis_permohonan=''305'' AND NULLIF(tanggal_bayar,'''')::timestamp>=''2025-01-01'' AND NULLIF(tanggal_bayar,'''')::timestamp<''2026-01-01'' AND status IN (''0999'',''0906'',''9999'') AND trader_id::bigint NOT IN (5,17,50,85). SQL ERLA SAJA: SELECT COUNT(DISTINCT produk_id) FROM t_produk_3_rilis_erla WHERE jenis_permohonan=''305'' AND tanggal_bayar>=''2025-01-01'' AND tanggal_bayar<''2026-01-01'' AND status IN (''0099'',''0999'',''0906'',''9999'') AND trader_id<>3384. SQL GABUNGAN: SELECT COUNT(DISTINCT produk_id) FROM (SELECT produk_id FROM t_produk_3_erba WHERE jenis_permohonan=''305'' AND NULLIF(tanggal_bayar,'''')::timestamp>=''2025-01-01'' AND NULLIF(tanggal_bayar,'''')::timestamp<''2026-01-01'' AND status IN (''0999'',''0906'',''9999'') AND trader_id::bigint NOT IN (5,17,50,85) UNION ALL SELECT produk_id FROM t_produk_3_rilis_erla WHERE jenis_permohonan=''305'' AND tanggal_bayar>=''2025-01-01'' AND tanggal_bayar<''2026-01-01'' AND status IN (''0099'',''0999'',''0906'',''9999'') AND trader_id<>3384) x. DB 27Jul2026: ERBA=2.334 · ERLA=10 · gabungan=2.344. KODE: dictionary JENIS_PERMOHONAN sumber="ERBA dan ERLA" kode 305 = "Permohonan Baru Notifikasi" — kode SAMA di kedua sistem. PERHATIAN PEMICU JP: di sini filter jenis_permohonan SAH karena prompt menyebut jenis permohonannya secara eksplisit ("permohonan baru notifikasi"). Bandingkan dgn UAT-NIE25-1 ("izin edar yang terbit 2025") yang TANPA filter JP — kata "terbit" saja BUKAN pemicu JP (predikat §4/RC-2). Jangan menyamakan kedua pola itu. ENTITY: subjeknya "permohonan" → COUNT(DISTINCT produk_id) (predikat §1); pembanding entity nomor pada filter sama = ERBA 2.196 · ERLA 10 — nilai lama ERBA (2.132) adalah hitungan nomor snapshot lama. KOLOM TANGGAL: tanggal_bayar (predikat §2). TIMPANG ANTAR SISTEM: jalur notifikasi adalah mekanisme baru untuk produk risiko sangat rendah sehingga praktis hanya hidup di ERBA (2.334 vs 10). Angka ERLA=10 harus tetap disebut apa adanya — melaporkan hanya gabungan 2.344 menyembunyikan fakta bahwa jalur ini nyaris tidak ada di sistem legacy. Nilai lama 2.142/2.132/10 (tol 0).'
