name: UAT_KLASIFIKASI_1
scenario_id: UAT-KLASIFIKASI-1
verification_date: '2026-07-27'
description: 'UAT-KLASIFIKASI-1 — SCOPE: scope-agnostic, multi-value (makanan DAN minuman harus muncul). Re-verified 27Jul2026. Versi lama punya CACAT INTERNAL: prosa note-nya menyebut Makanan=57.972/Minuman=37.366 sementara assert-nya 89.888/50.542 — dua angka berbeda di berkas yang sama.'
turns:
- prompt: berapa produk yang masuk kategori makanan dan berapa yang minuman di BPOM?
  assert_contains:
  - 'makanan'
  - 'minuman'
  assert_any_of:
  -
    - '170.880'
    - '82.536'
  -
    - '60.442'
    - '38.726'
    - 'ERBA'
  -
    - '110.438'
    - '43.810'
    - 'ERLA'
  tolerance_pct: 5
  note: 'SCOPE = scope-agnostic. SQL ERBA SAJA: SELECT klasifikasi_id, COUNT(DISTINCT nomor) FROM t_produk_3_erba WHERE klasifikasi_id IN (''301'',''302'') AND status IN (''0999'',''0906'',''9999'') AND trader_id::bigint NOT IN (5,17,50,85) AND nomor<>'''' GROUP BY 1. SQL ERLA SAJA: SELECT klasifikasi_id, COUNT(DISTINCT nomor) FROM t_produk_3_rilis_erla WHERE klasifikasi_id IN (''301'',''302'') AND status IN (''0099'',''0999'',''0906'',''9999'') AND trader_id<>3384 AND nomor<>'''' GROUP BY 1. SQL GABUNGAN: SELECT klasifikasi_id, COUNT(DISTINCT nomor) FROM (SELECT klasifikasi_id, nomor FROM t_produk_3_erba WHERE klasifikasi_id IN (''301'',''302'') AND status IN (''0999'',''0906'',''9999'') AND trader_id::bigint NOT IN (5,17,50,85) AND nomor<>'''' UNION ALL SELECT klasifikasi_id, nomor FROM t_produk_3_rilis_erla WHERE klasifikasi_id IN (''301'',''302'') AND status IN (''0099'',''0999'',''0906'',''9999'') AND trader_id<>3384 AND nomor<>'''') x GROUP BY 1. DB 27Jul2026 — MAKANAN (301): ERBA=60.442 · ERLA=110.438 · gabungan=170.880; MINUMAN (302): ERBA=38.726 · ERLA=43.810 · gabungan=82.536. KODE FILTER ERBA vs ERLA: SAMA — dictionary KLASIFIKASI_ID sumber="ERBA dan ERLA" kode 301=Makanan · 302=Minuman berlaku di kedua tabel; tidak perlu diterjemahkan (kontras dgn kemasan_id di berkas serumpun yang justru berbeda). Yang tetap berbeda: set status sah, akun uji, dan tipe kolom. ENTITY: "berapa produk yang masuk kategori" = NIE terdaftar → COUNT(DISTINCT nomor) (predikat §1). Pembanding entity produk_id: Makanan ERBA=90.884 · ERLA=266.742; Minuman ERBA=51.103 · ERLA=91.111 — assert versi lama (89.888/50.542 ERBA, 266.742/91.111 ERLA) seluruhnya hitungan produk_id, sedangkan prosa note versi lama (57.972/37.366) adalah hitungan nomor dari snapshot lebih awal. Itulah asal kontradiksi internal berkas lama. TIDAK MENUTUP SELURUH POPULASI: klasifikasi_id 301+302 bukan seluruh pangan olahan — keluarga kode ini juga memuat 303 Bahan Tambahan Pangan · 304 Minuman Beralkohol · 305 Pangan Berklaim · 306 Pangan Dengan Herbal · 307 Iradiasi · 308 Rekayasa Genetika · 309 Organik · 310 Pangan Diet · 311 Bayi & Anak · 312 Ibu Hamil/Menyusui, ditambah kode 3 "Deputi 3 (Pangan)" yang di ERBA saja memuat 42.419 NIE. Jadi Makanan + Minuman TIDAK sama dengan total produk terdaftar; jangan menyajikannya sebagai pembagian dua yang menghabiskan populasi (predikat §12-C). Nilai lama 356.630/141.653 gabungan, 89.888/50.542 ERBA, 266.742/91.111 ERLA.'
