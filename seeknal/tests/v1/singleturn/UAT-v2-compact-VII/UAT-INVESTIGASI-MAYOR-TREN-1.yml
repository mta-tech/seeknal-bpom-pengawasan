name: UAT_INVESTIGASI_MAYOR_TREN_1
scenario_id: UAT-INVESTIGASI-MAYOR-TREN-1
verification_date: '2026-07-28'
description: 'UAT-INVESTIGASI-MAYOR-TREN-1 — ERBA sebagai sumber utama (ERLA justru menyusut di periode yang sama, jadi menggabung akan mengaburkan tren yang ditanyakan). Pertanyaan investigatif: perlu angka tren + penjelasan sebab, bukan cuma angka.'
turns:
- prompt: kenapa jumlah perubahan mayor izin edar terus meningkat drastis dalam 3 tahun terakhir?
  assert_contains:
  - 'mayor'
  - '2023'
  - '2025'
  - 'meningkat'
  assert_any_of:
  -
    - '1.091'
  -
    - '8.183'
  tolerance_pct: 10
  note: 'SQL per tahun: SELECT to_char(NULLIF(tanggal_bayar,'''')::timestamp,''YYYY'') thn, COUNT(DISTINCT produk_id) FROM t_produk_3_erba WHERE jenis_permohonan=''302'' AND status IN (''0999'',''0906'',''9999'') AND trader_id::bigint NOT IN (5,17,50,85) AND NULLIF(tanggal_bayar,'''')::timestamp>=''2023-01-01'' AND NULLIF(tanggal_bayar,'''')::timestamp<''2026-01-01'' GROUP BY 1 ORDER BY 1. DB 28Jul2026 (ERBA, entity produk_id): 2023=1.091 · 2024=3.360 · 2025=8.183. Kenaikan: 2023→2024 = 3,1x (+208%) · 2024→2025 = 2,4x (+144%) · 2023→2025 = 7,5x (+650%). JAWABAN INVESTIGATIF — sebab yang bisa didukung data: (a) ERBA baru berjalan penuh sejak 2023 setelah masa transisi dari ERLA (2022 baru 6.516 baris total di ERBA), sehingga basis produk terdaftar yang BISA direvisi terus bertambah tahun demi tahun — semakin banyak NIE ERBA aktif, semakin banyak yang berpotensi mengajukan perubahan; (b) permohonan baru (JP 301) juga tumbuh di periode sama (2023=33.519 → 2025=43.643 basis nomor), jadi sebagian kenaikan mayor adalah efek skala mengikuti pertumbuhan populasi produk, bukan semata perubahan perilaku; (c) migrasi bertahap dari ERLA — sebagian revisi produk lama yang dulu diproses di ERLA kini masuk lewat ERBA begitu produk tersebut ikut bermigrasi. HANYA ERBA — INI KEPUTUSAN SADAR, BUKAN KETERBATASAN: perubahan mayor di ERLA justru MENYUSUT di periode yang sama (2023=8.450 → 2024=5.078 → 2025=2.278, arah berkebalikan) karena ERLA sudah beku sejak 2023 dan hampir tak menerima aktivitas baru. Menggabungkan keduanya akan membuat tren gabungan tampak datar atau bahkan turun, padahal justru drama sebenarnya (ERBA meledak, ERLA padam) hilang dari pandangan — jadi menjawab pertanyaan "kenapa meningkat" harus tetap di ERBA saja dan menyebutkan kontras dengan ERLA sebagai konteks. ENTITY: produk_id (permohonan perubahan, subjek dari kata "perubahan mayor"). Nilai lama 881/4.602/6.636 — pola kenaikan serupa (drastis, dipercepat), besaran berbeda karena entity/eksklusi trader belum diterapkan konsisten pada snapshot lama.'
