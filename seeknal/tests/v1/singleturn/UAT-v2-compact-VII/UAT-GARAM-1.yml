name: UAT_GARAM_1
scenario_id: UAT-GARAM-1
verification_date: '2026-07-28'
description: 'UAT-GARAM-1 — scope-agnostic. Versi lama punya bug tahun: prompt bertanya 2023 tapi SQL yang tertulis di note-nya sendiri memfilter tanggal_bayar 2024.'
turns:
- prompt: kalau Garam Beryodium, berapa NIE-nya di tahun 2023?
  assert_contains:
  - 'Garam Beryodium'
  - '2023'
  assert_any_of:
  -
    - '260'
  -
    - '199'
    - 'ERBA'
  -
    - '61'
    - 'ERLA'
  tolerance_pct: 5
  note: 'SQL ERBA: SELECT COUNT(DISTINCT nomor) FROM t_produk_3_erba WHERE jenis_pangan LIKE ''1204%'' AND NULLIF(tanggal_bayar,'''')::timestamp>=''2023-01-01'' AND NULLIF(tanggal_bayar,'''')::timestamp<''2024-01-01'' AND status IN (''0999'',''0906'',''9999'') AND trader_id::bigint NOT IN (5,17,50,85) AND nomor<>''''. SQL ERLA: SELECT COUNT(DISTINCT nomor) FROM t_produk_3_rilis_erla WHERE nama_kategori ILIKE ''%garam%'' AND tanggal_bayar>=''2023-01-01'' AND tanggal_bayar<''2024-01-01'' AND status IN (''0099'',''0999'',''0906'',''9999'') AND trader_id<>3384 AND nomor<>''''. GABUNGAN: COUNT(DISTINCT nomor) atas UNION ALL kedua query. DB 28Jul2026: ERBA=199 · ERLA=61 · gabungan=260. BUG TAHUN DI VERSI LAMA: note lama menulis SQL dengan tanggal_bayar::text LIKE ''2024%'' padahal prompt bertanya tahun 2023 — dijalankan apa adanya SQL itu memberi 437, dua kali lipat lebih banyak dari 199 yang benar. Nilai kanonik lama (199) kebetulan sudah tahun yang benar, hanya SQL yang tercetak di note-nya salah; berkas ini memastikan SQL dan hasilnya konsisten. KODE ERBA: jenis_pangan=1204 adalah kode INDUK untuk seluruh keluarga garam — di bawahnya ada kategori_pangan 120101000001 (Garam Konsumsi Beriodium, 1.731 baris all-time) sampai 120101000009 (Garam Gurih Beriodium, 88 baris) dan varian lain, semuanya varian garam beryodium/konsumsi. Memfilter langsung ke kategori_pangan=120101000001 saja membuang varian-varian itu dan mengecilkan hasil — pakai kode induk jenis_pangan. ERLA TIDAK PUNYA KODE SETARA: query jenis_pangan LIKE ''1204%'' di ERLA menghasilkan NOL baris (dicek langsung) — ERLA sama sekali tidak memakai namespace jenis_pangan 1204 untuk garam, sehingga satu-satunya cara menjaringnya adalah nama_kategori ILIKE ''%garam%''. Ini pola pencarian teks bebas, bukan kode — kemungkinan menangkap produk lain yang kebetulan menyebut "garam" di kategorinya; spot-check nama produk hasil filter bila angka disajikan sebagai definitif. ENTITY: nomor=199/61/260; pembanding produk_id=200/64/264 — selisihnya kecil di segmen ini karena volumenya rendah, beda dari segmen besar (kemasan, klasifikasi) yang selisihnya bisa berlipat. Nilai lama 208/199/9 — angka ERLA lama (9) jauh dari nilai kini (61) dan tidak reproducible dengan filter nama_kategori manapun yang dicoba.'
