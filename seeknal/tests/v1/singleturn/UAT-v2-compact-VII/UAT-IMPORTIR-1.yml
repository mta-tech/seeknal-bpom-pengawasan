name: UAT_IMPORTIR_1
scenario_id: UAT-IMPORTIR-1
verification_date: '2026-07-28'
description: 'UAT-IMPORTIR-1 — pertanyaan tentang PERUSAHAAN (bukan produk), jadi sumbernya tabel master m_trader_rba, tanpa join ke tabel produk. Kolomnya bertipe teks berisi "0"/"1", bukan boolean.'
turns:
- prompt: ada berapa perusahaan importir yang terdaftar di BPOM?
  assert_contains:
  - 'importir'
  assert_any_of:
  -
    - '1.321'
  tolerance_pct: 5
  note: 'SQL: SELECT COUNT(*) FROM m_trader_rba WHERE is_status_industri_importir=''1''. DB 28Jul2026 = 1.321 dari total 15.023 trader di m_trader_rba. TIPE KOLOM: is_status_industri_importir dan is_status_industri_produsen bertipe TEXT dan menyimpan hanya dua nilai, ''1'' dan ''0'' (dicek: tidak ada NULL, tidak ada nilai lain) — bukan boolean asli, jadi filter WAJIB =''1'' sebagai string, bukan =true. SUMBER DATA: pertanyaan ini tentang PERUSAHAAN, bukan produk, sehingga sumbernya adalah tabel master m_trader_rba, TANPA join ke t_produk_3_erba — join ke tabel produk hanya relevan bila pertanyaan secara eksplisit menyoal "importir yang punya produk/NIE", dan itu pertanyaan berbeda dengan populasi berbeda. m_trader_rba HANYA mencakup sisi ERBA — m_trader_rla (master ERLA) tidak punya kolom is_status_industri_importir/produsen sama sekali, jadi angka ini murni ERBA dan tidak bisa digabung dengan ERLA. SATU PERUSAHAAN BISA DUA-DUANYA: 88 trader berstatus importir DAN produsen sekaligus (is_status_industri_importir=''1'' AND is_status_industri_produsen=''1''), jadi importir + produsen tidak bisa dijumlahkan jadi total unik perusahaan. PEMBANDING: produsen (is_status_industri_produsen=''1'') = 13.790. ENTITY: baris trader_id di master, satu baris satu perusahaan (tidak perlu DISTINCT — trader_id adalah primary identity tabel ini). Nilai lama 1.300/13.529 — geser wajar karena m_trader_rba tumbuh dari 15.003 ke 15.023 baris antar sesi.'
