name: UAT_GARAM_2
scenario_id: UAT-GARAM-2
verification_date: '2026-07-28'
description: 'UAT-GARAM-2 — scope-agnostic, all-time. Prompt bertanya "aktif" — ada dua kemungkinan bacaan status (status=0999 saja, atau seluruh status yang pernah terbit) dan angkanya beda tipis; berkas ini menyajikan keduanya.'
turns:
- prompt: garam beryodium punya berapa NIE yang aktif di BPOM?
  assert_contains:
  - 'Garam Beryodium'
  assert_any_of:
  -
    - '2.677'
  -
    - '2.746'
  -
    - '1.249'
    - 'ERBA'
  -
    - '1.479'
    - 'ERLA'
  tolerance_pct: 5
  note: 'SQL ERBA (status=0999 saja, "aktif" ketat): SELECT COUNT(DISTINCT nomor) FROM t_produk_3_erba WHERE jenis_pangan LIKE ''1204%'' AND status=''0999'' AND trader_id::bigint NOT IN (5,17,50,85) AND nomor<>''''. SQL ERBA (seluruh status pernah-terbit): ganti status=''0999'' dengan status IN (''0999'',''0906'',''9999''). SQL ERLA (status=0999 saja): SELECT COUNT(DISTINCT nomor) FROM t_produk_3_rilis_erla WHERE nama_kategori ILIKE ''%garam%'' AND status=''0999'' AND trader_id<>3384 AND nomor<>''''. SQL ERLA (pernah-terbit): status IN (''0099'',''0999'',''0906'',''9999''). GABUNGAN: COUNT(DISTINCT nomor) atas UNION ALL sisi yang sepadan. DB 28Jul2026: status=0999 saja → ERBA=1.249 · ERLA=1.428 · gabungan=2.677. Pernah-terbit (lebih luas) → ERBA=1.267 · ERLA=1.479 · gabungan=2.746. Selisihnya kecil (69 NIE, 2,5%) karena kode 0906/9999 hanya menambah baris revisi yang sudah terhitung nomor-nya via status 0999 di baris lain, jadi tidak menggelembung jauh — beda dari kasus lain yang selisih dua tiernya bisa puluhan ribu. KODE ERBA: jenis_pangan induk 1204 (lihat UAT-GARAM-1 untuk rincian sub-kode). KODE ERLA: tidak ada namespace jenis_pangan untuk garam (dicek: 0 baris), memakai nama_kategori ILIKE ''%garam%'' — pencarian teks bebas, hasilnya perlu spot-check nama produk bila disajikan sebagai definitif. ENTITY: nomor. Pembanding produk_id all-time: ERBA=1.858 · ERLA lebih tinggi juga — selisih dgn nomor jauh lebih besar di produk_id (karena revisi berulang), jadi entity tetap harus nomor untuk pertanyaan "berapa NIE". Nilai lama 3.571/1.241/2.330 — jauh dari kedua bacaan sekarang; kemungkinan snapshot lama memakai basis filter/tanggal berbeda yang tidak tercatat di note aslinya.'
