name: UAT_IMPOR_1
scenario_id: UAT-IMPOR-1
verification_date: '2026-07-28'
description: 'UAT-IMPOR-1 — scope-agnostic. Kode status_produk=302 sama di kedua sistem, tapi kolomnya gampang tertukar dengan status_usaha (kolom lain, arti mirip) dan dengan kode 302 di kolom-kolom lain (mayor, MT, minor).'
turns:
- prompt: berapa produk impor yang punya izin edar di BPOM?
  assert_contains:
  - 'impor'
  assert_any_of:
  -
    - '110.553'
  -
    - '45.516'
    - 'ERBA'
  -
    - '65.037'
    - 'ERLA'
  tolerance_pct: 5
  note: 'SQL ERBA: SELECT COUNT(DISTINCT nomor) FROM t_produk_3_erba WHERE status_produk=''302'' AND status IN (''0999'',''0906'',''9999'') AND trader_id::bigint NOT IN (5,17,50,85) AND nomor<>''''. SQL ERLA: SELECT COUNT(DISTINCT nomor) FROM t_produk_3_rilis_erla WHERE status_produk=''302'' AND status IN (''0099'',''0999'',''0906'',''9999'') AND trader_id<>3384 AND nomor<>''''. GABUNGAN: COUNT(DISTINCT nomor) atas UNION ALL kedua query. DB 28Jul2026: ERBA=45.516 · ERLA=65.037 · gabungan=110.553. KODE: dictionary STATUS_PRODUK kode 302 = "Impor", sama di kedua tabel. WASPADA KOLOM MIRIP: angka kode 302 dipakai ulang di kolom lain dengan arti berbeda sama sekali — jenis_permohonan 302 = Perubahan Mayor, kategori_dokumen 302 = Menengah Tinggi, jenis_dokumen 302 = Pangan High Risk. Kolom yang dipakai di sini WAJIB status_produk, bukan salah satu dari itu. Ada juga kolom status_usaha (kode 31 produsen · 33 importir) yang MENGHITUNG PRODUK juga tapi lewat sudut pandang perizinan usaha, bukan asal-usul produksi — dua kolom bisa memberi angka berbeda untuk konsep "impor" yang sekilas sama; pakai status_produk karena dictionary secara eksplisit melabelinya "Impor" sedangkan status_usaha berbunyi "importir" dari sisi legalitas usaha. ENTITY: nomor. Pembanding produk_id: ERBA=54.937 · ERLA=117.136 — nilai lama (ERBA 44.127 mendekati nomor, ERLA 116.160 persis produk_id) mencampur dua satuan, sebab total lama 160.287 tidak konsisten. Nilai lama 160.287/44.127/116.160.'
