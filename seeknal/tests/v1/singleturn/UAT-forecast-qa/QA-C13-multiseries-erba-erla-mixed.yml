name: QA_C13_Multiseries_ERBA_ERLA_Mixed_Eligibility
scenario_id: QA-C13
description: 'Peta QA C.13 (multi-series eligibility campuran, P2, status QA: passed) SEKALIGUS test langsung untuk kekhawatiran user: pada percobaan dev VM, sistem sempat TERCAMPUR menggunakan data ERLA padahal seharusnya ERBA-only. Series: ERBA (eligible) + ERLA (selalu ineligible, CV>0.8, forecast_guide.md §3).'
turns:
- prompt: Ramalkan permohonan ERBA dan ERLA untuk 6 bulan ke depan
  assert_contains:
  - ERBA
  - ERLA
  assert_any_of:
  -
    - ditolak
  -
    - tidak
  note: 'KRITERIA UTAMA (bug yang dicurigai user): ERBA harus tetap diproyeksikan (eligible) DAN ERLA harus DITOLAK terpisah dengan alasan CV tinggi — dua-duanya TIDAK BOLEH digabung jadi satu angka campuran ERBA+ERLA. Jika jawaban menunjukkan SATU angka proyeksi gabungan tanpa memisahkan sistem, atau memakai historis ERLA sebagai bagian dari basis ERBA — itu BUG, catat detail SQL dari tool_trace untuk root cause.'
