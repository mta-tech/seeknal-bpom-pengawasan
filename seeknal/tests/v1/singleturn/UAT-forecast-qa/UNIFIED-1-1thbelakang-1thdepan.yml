name: Unified_Timeline_1ThBelakang_1ThDepan
scenario_id: UNIFIED-1Y-1Y
description: 'Pola pelampiran data berurutan: 1 tahun ke belakang HINGGA 1 tahun ke depan, sebagai satu timeline (bukan dua blok terpisah) — reuse prinsip UAT-FORECAST-6 ("one story, not two tables") dengan jendela lebih panjang.'
turns:
- prompt: Bagaimana perkembangan permohonan ERBA dalam 1 tahun terakhir dan proyeksinya untuk 1 tahun ke depan?
  assert_contains:
  - Historis
  - Proyeksi
  note: 'Ekspektasi: satu tabel/timeline kronologis Jul2025-Jun2027 (12 bulan histori + 12 bulan proyeksi), ada penanda batas "sekarang", bukan tabel historis lalu tabel proyeksi yang tak berkaitan. CSV export (jika ada) idealnya juga memuat rangkaian penuh, bukan cuma salah satu segmen.'
