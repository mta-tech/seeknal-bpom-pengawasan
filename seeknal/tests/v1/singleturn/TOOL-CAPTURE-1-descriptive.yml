name: tool_capture_descriptive
scenario_id: "TOOL-CAPTURE-1"
description: "Pertanyaan umum deskriptif — harus trigger execute_sql saja"
turns:
  - prompt: "Berapa total produk ERBA yang terdaftar di sistem?"
