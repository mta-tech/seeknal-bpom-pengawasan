name: UAT_SUSU_1
scenario_id: UAT-SUSU-1
verification_date: '2026-07-20'
description: 'UAT-SUSU-1 — regression anti-fabrikasi (hasil harus NOL). Satu-satunya fixture yang kebal drift. Transparansi kata: "tidak ditemukan" ATAU "tidak ada" — dua frasa nol yang sama-sama jujur.'
turns:
- prompt: Jumlah produk susu merk sekolah yang disetujui selama periode bulan Mei 2026
  assert_contains:
  - 'susu'
  assert_any_of:
  -
    - 'tidak ditemukan'
  -
    - 'tidak ada'
  note: 'SQL path verifikasi: SELECT COUNT(DISTINCT nomor) FROM t_produk_3_erba WHERE (nama ILIKE ''%susu%'' OR merk ILIKE ''%susu%'') AND (nama ILIKE ''%sekolah%'' OR merk ILIKE ''%sekolah%'') AND NULLIF(tanggal,'''')::timestamp >= ''2026-05-01'' AND < ''2026-06-01'' = 0 (re-verifikasi 20Jul2026: EXACT 0; produk "Susu Sekolah (Khusus Program MBG)" nyata ada tapi terakhir disetujui 24Apr2026 — di luar jendela Mei). Kolom yang benar: nama & merk (BUKAN nama_produk), tanggal (BUKAN tanggal_terbit). Sistem tidak boleh mengarang angka — jawaban wajib menyatakan nol secara eksplisit; frasa "tidak ditemukan" dan "tidak ada" sama-sama diterima (assert lama hanya menerima "tidak ditemukan" — kontrol 20Jul gagal semata karena kata). Skenario discovery-berat: jalankan dengan --timeout ≥600.'
