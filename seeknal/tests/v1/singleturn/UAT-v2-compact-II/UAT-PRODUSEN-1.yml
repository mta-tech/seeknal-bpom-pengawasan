name: UAT_PRODUSEN_1
scenario_id: UAT-PRODUSEN-1
verification_date: '2026-07-18'
description: 'UAT-PRODUSEN-1 — single-scope by-design (m_trader_rba / ERBA).'
turns:
- prompt: berapa banyak perusahaan produsen yang terdaftar di BPOM dibanding importir?
  assert_contains:
  - 'produsen'
  - 'importir'
  assert_any_of:
  -
    - '13.690'
    - '1.312'
  tolerance_pct: 5
  note: 'SQL path: SELECT COUNT(*) FILTER (WHERE is_status_industri_produsen=''1'') AS produsen, COUNT(*) FILTER (WHERE is_status_industri_importir=''1'') AS importir FROM m_trader_rba. KOREKSI: kolom bertipe TEXT ''1''/''0'' — BUKAN boolean t/f seperti di note lama. Satu trader bisa keduanya (boolean terpisah). DB 18Jul2026: produsen=13.690, importir=1.312. Nilai lama: 13.525 / 1.300.'
