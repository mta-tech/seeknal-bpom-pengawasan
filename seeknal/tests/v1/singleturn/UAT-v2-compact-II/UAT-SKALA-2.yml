name: UAT_SKALA_2
scenario_id: UAT-SKALA-2
verification_date: '2026-07-20'
description: 'UAT-SKALA-2 — single-scope by-design. Prompt menyebut "punya produk" — TIGA populasi sah (master / punya produk apa pun / punya NIE sah), semuanya diterima; jawaban kanonik menampilkan master + join berlabel.'
turns:
- prompt: perusahaan skala besar yang punya produk di BPOM ada berapa?
  assert_contains:
  - 'besar'
  assert_any_of:
  -
    - '1.354'
  -
    - '1.477'
  -
    - '1.273'
  tolerance_pct: 5
  note: 'TIGA SQL path sah per 20Jul2026 (entity trader_id, ERBA; kanon reference §1: angka master WAJIB tampil, join berlabel di sampingnya): (a) punya produk apa pun — SELECT COUNT(DISTINCT m.trader_id) FROM m_trader_rba m WHERE TRIM(m.skala_industri_id)=''4'' AND EXISTS produk = 1.354; (b) semua trader skala besar terdaftar (MASTER) = 1.477; (c) punya NIE sah (status IN 0999/0906/9999) = 1.273. Dictionary: SKALA_INDUSTRI_ID kode 4 (Besar). DILARANG dedup by nama dalam satu sistem (kanon 20Jul). Nilai lama: 1.367 (17Jun), 1.350/1.476 (18Jul — drift +4/+1 wajar).'
