name: UAT_RISIKO_TINGGI_NOTIF_TREN_1
scenario_id: UAT-RISIKO-TINGGI-NOTIF-TREN-1
verification_date: '2026-07-18'
description: 'UAT-RISIKO-TINGGI-NOTIF-TREN-1 — tren per tahun; ERBA dominan (ERLA hanya belasan/tahun).'
turns:
- prompt: bagaimana tren izin edar dengan risiko tinggi notifikasi dari tahun ke tahun?
  assert_contains:
  - 'Tinggi Notifikasi'
  - '2025'
  assert_any_of:
  -
    - '519'
    - '1.891'
  tolerance_pct: 5
  note: 'SQL path (ERBA): SELECT date_trunc(''year'', NULLIF(tanggal,'''')::timestamp), COUNT(DISTINCT nomor) FROM t_produk_3_erba WHERE kategori_dokumen=''304'' AND status IN (''0999'',''0906'',''9999'') GROUP BY 1. DB 18Jul2026: 2024=519, 2025=1.891 (dua angka jangkar assert — 2024/2025 stabil), 2026 BERJALAN=1.764 (jangan di-assert, tumbuh terus; nilai lama 1.531). ERLA jenis_dokumen=''304'' per tahun: 2024=18, 2025=7, 2026=2 (terlalu kecil utk numeric-assert — token 1 digit tak berlaku toleransi). Tren naik 3,6x 2024→2025 = kemungkinan kebijakan baru. KOREKSI: tolerance lama 0 membuat semua grup pasti gagal; grup gabungan/ERLA lama dihapus karena angka kecil tak bisa di-assert aman.'
