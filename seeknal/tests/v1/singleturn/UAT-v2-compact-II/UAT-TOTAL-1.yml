name: UAT_TOTAL_1
scenario_id: UAT-TOTAL-1
verification_date: '2026-07-20'
description: 'UAT-TOTAL-1 — gabungan ERBA+ERLA by-design. Data hidup, tumbuh terus. Transparansi dua tier: terdaftar (kanonik) ATAU aktif 0999-only — keduanya sah bila berlabel; "saat ini" BUKAN pemicu aktif (predikat §3).'
turns:
- prompt: Berapa produk pangan olahan terdaftar di BPOM saat ini
  assert_contains:
  - 'pangan olahan'
  assert_any_of:
  -
    - '316.013'
  -
    - '307.868'
  tolerance_pct: 5
  note: 'DUA tier sah per 20Jul2026 (kanon predikat §3: headline = terdaftar; aktif dilampirkan berlabel — grup mana pun match): (a) TERDAFTAR/pernah terbit — SELECT COUNT(DISTINCT nomor) FROM (ERBA status IN (0999,0906,9999) UNION ALL ERLA status IN (0099,0999,0906,9999)) = 316.628 (18Jul: 316.013); (b) AKTIF — status=''0999'' saja per sistem, gabungan = 307.868. Nomor tak overlap antar sistem. Pangan olahan = tabel produk saja (BTP tidak termasuk kecuali diminta). PERINGATAN METODE (bukan bacaan sah): total dari PENJUMLAHAN per-status (mis. 173.077 ERBA) SALAH — nomor hidup di banyak status; total wajib satu query DISTINCT global (§12). Filter tanggal kedaluwarsa BUKAN bagian tier mana pun kecuali diminta "masih berlaku". Nilai lama: 312.337 (17Jun, prefix-hack ''312.'' dihapus), 316.013 (18Jul).'
