  note: 'SQL path: SELECT m.nama, COUNT(DISTINCT p.nomor) FROM t_produk_3_erba p JOIN m_trader_rba m ON p.trader_id::bigint=m.trader_id WHERE p.status IN (''0999'',''0906'',''9999'') AND p.trader_id::bigint NOT IN (5,17,50,85) GROUP BY m.nama ORDER BY 2 DESC — kolom nama = m.nama (BUKAN nama_perusahaan), entity NIE = nomor. DB 18Jul2026: #1 INTERFOOD SUKSES JASINDO=2.142, #2 STAR NIAGA SUKSES=1.346, #3 BROTHER FOOD INDONESIA=1.340 — posisi #2/#3 SUDAH BERTUKAR vs snapshot lama (BROTHER 1.319 > STAR 1.317), maka assert hanya #1. Nilai lama #1: 2.077.'
