turns:
- prompt: Bagaimana tren permohonan pangan olahan dari tahun ke tahun di sistem ERBA?
  assert_contains:
  - '2023'
  - '2024'
  - '2025'
  assert_any_of:
  -
    - '42.329'
    - '46.447'
    - '70.007'
  tolerance_pct: 5
  note: 'SQL path: SELECT date_trunc(''year'', NULLIF(tanggal_bayar,'''')::timestamp), COUNT(DISTINCT produk_id) FROM t_produk_3_erba WHERE NULLIF(tanggal_bayar,'''') IS NOT NULL GROUP BY 1 — entity permohonan = produk_id, tanggal basis = tanggal_bayar, TANPA filter status (permohonan menghitung semua pengajuan; menambah status IN issued TERBUKTI SALAH: memberi 37.757 utk 2023, bukan 42.329). DB 18Jul2026: 2022=4.167 (EXACT vs lama), 2023=42.329 (EXACT), 2024=46.447, 2025=70.007, 2026 BERJALAN=35.584 (jangan di-assert; nilai lama 30.631). Tahun lampau nyaris beku pada basis tanggal_bayar — jangkar assert = 2023/2024/2025.'
