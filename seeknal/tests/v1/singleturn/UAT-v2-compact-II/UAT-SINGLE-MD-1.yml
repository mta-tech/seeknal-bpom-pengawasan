name: UAT_SINGLE_MD_1
scenario_id: UAT-SINGLE-MD-1
verification_date: '2026-07-18'
description: 'UAT-SINGLE-MD-1 — Scope-agnostic (ERBA/ERLA/UNION via assert_any_of). Entity kanonik: nomor ("produk terdaftar"); varian produk_id ikut diterima.'
turns:
- prompt: berapa produk yang terdaftar sebagai Single MD Induk di BPOM?
  assert_contains:
  - 'Single MD'
  assert_any_of:
  -
    - '12.818'
  -
    - '5.836'
    - 'ERBA'
  -
    - '6.982'
    - 'ERLA'
  -
    - '9.723'
    - 'ERBA'
  -
    - '24.087'
    - 'ERLA'
  tolerance_pct: 5
  note: 'Kanonik ("produk terdaftar" → nomor, predikat §1). SQL path ERBA: SELECT COUNT(DISTINCT nomor) FROM t_produk_3_erba WHERE status_produk=''306'' AND status IN (''0999'',''0906'',''9999'') = 5.836 per 18Jul2026. SQL path ERLA: SELECT COUNT(DISTINCT nomor) FROM t_produk_3_rilis_erla WHERE status_produk=''306'' AND status IN (''0099'',''0999'',''0906'',''9999'') = 6.982. GABUNGAN nomor = 12.818. Varian entity permohonan (produk_id): ERBA=9.723, ERLA=24.087 (ERLA versioning ekstrem: produk_id 3,4x nomor). Single MD Anak (307) ERBA produk_id=11.059. KOREKSI GT lama (5.658/23.949/total 29.607): ERBA-nya dihitung NOMOR tapi ERLA-nya PRODUK_ID (tanpa 0099) — total lama = penjumlahan dua entitas berbeda, dan SQL di note lama (produk_id) kontradiksi dengan angkanya sendiri (5.658≈nomor). Dictionary: STATUS_PRODUK kode 306.'
