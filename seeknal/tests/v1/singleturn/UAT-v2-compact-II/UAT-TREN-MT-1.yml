description: 'UAT-TREN-MT-1 — single-scope by-design (risiko = ERBA only). Tahun lampau ikut bergeser (revisi historis) — perlu toleransi.'
turns:
- prompt: Bagaimana tren jumlah NIE risiko menengah tinggi dari tahun ke tahun?
  assert_contains:
  - 'Menengah Tinggi'
  assert_any_of:
  -
    - '3.082'
    - '4.195'
    - '3.854'
  tolerance_pct: 5
  note: 'SQL path: SELECT date_trunc(''year'', NULLIF(tanggal,'''')::timestamp), COUNT(DISTINCT nomor) FROM t_produk_3_erba WHERE kategori_dokumen=''302'' AND status IN (''0999'',''0906'',''9999'') GROUP BY 1. DB 18Jul2026: 2022=209, 2023=3.082, 2024=4.195, 2025=3.854, 2026 BERJALAN=1.439 (jangan di-assert). PERINGATAN INSTRUMEN: tahun LAMPAU pun bergeser (GT lama 2024=4.007 → kini 4.195; 2025=3.604 → 3.854) karena baris revisi/perubahan status masuk dengan tanggal historis — GT tren tahunan tidak pernah beku, wajib toleransi. Nilai lama: 209/3.077/4.007/3.604/1.139, total 11.919 (≈ tier aktif).'
