name: tool_capture_forecast_anomaly
scenario_id: "TOOL-CAPTURE-4"
description: "Forecast dengan anomali — harus trigger run_forecast + anomaly otomatis"
turns:
  - prompt: "Berapa prediksi jumlah registrasi BTP ERBA untuk6 bulan ke depan?"
