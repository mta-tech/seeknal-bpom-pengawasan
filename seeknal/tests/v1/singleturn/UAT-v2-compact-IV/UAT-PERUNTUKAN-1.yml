name: UAT_PERUNTUKAN_1
scenario_id: UAT-PERUNTUKAN-1
verification_date: '2026-07-23'
description: 'UAT-PERUNTUKAN-1 — Scope-agnostic (ERBA/ERLA/UNION valid via assert_any_of). Dictionary PERUNTUKAN terdaftar ERBA-only, padahal ERLA memakai kolom yang sama + kode ekstra tak terdaftar.'
turns:
- prompt: produk pangan dengan peruntukan khusus yang punya izin edar ada berapa?
  assert_contains:
  - 'peruntukan'
  assert_any_of:
  -
    - '2.210'
  -
    - '435'
    - 'ERBA'
  -
    - '1.775'
    - 'ERLA'
  tolerance_pct: 5
  note: 'SQL ERBA: SELECT COUNT(DISTINCT nomor) FROM t_produk_3_erba WHERE peruntukan=''0201'' AND status IN (''0999'',''0906'',''9999'') AND trader_id::bigint NOT IN (5,17,50,85) AND nomor<>''''. SQL ERLA: idem pada t_produk_3_rilis_erla dgn status ERLA + trader_id<>3384. GABUNGAN = COUNT(DISTINCT nomor) atas UNION ALL. DB 23Jul2026: ERBA=435 · ERLA=1.775 · gabungan=2.210. BEDA DICTIONARY vs DATA (filter_code §4d): dictionary PERUNTUKAN terdaftar sumber=ERBA SAJA dgn hanya 2 kode (0000 Pangan Umum · 0201 Pangan Peruntukan) — TAPI kolom peruntukan juga terisi di ERLA, dan KEDUA sistem memakai kode yang TIDAK ADA di dictionary: ERBA 0103/0104/0105/0106 (~800 baris) dan ERLA 010101/0103/0105/0106 (~260 baris). Kode-kode itu TIDAK ikut terhitung pada filter =''0201''; sebutkan keterbatasan ini bila menyajikan angka sebagai "seluruh peruntukan khusus". Pembanding: peruntukan umum (0000) jauh lebih besar.'
