name: UAT_MEI26_1
scenario_id: UAT-MEI26-1
verification_date: '2026-07-23'
description: 'UAT-MEI26-1 — Scope-agnostic (ERBA/ERLA/UNION valid via assert_any_of). Re-verified 23Jul2026 dgn entity kanonik `nomor` (predikat §1) — bukan produk_id.'
turns:
- prompt: berapa total izin edar yang terbit tahun 2026 bulan mei
  assert_contains:
  - 'Mei'
  - '2026'
  assert_any_of:
  -
    - '5.276'
  -
    - '5.084'
    - 'ERBA'
  -
    - '192'
    - 'ERLA'
  tolerance_pct: 5
  note: 'SQL ERBA: SELECT COUNT(DISTINCT nomor) FROM t_produk_3_erba WHERE tanggal::timestamp>=''2026-05-01'' AND tanggal::timestamp<''2026-06-01'' AND status IN (''0999'',''0906'',''9999'') AND trader_id::bigint NOT IN (5,17,50,85) AND nomor<>''''. SQL ERLA: SELECT COUNT(DISTINCT nomor) FROM t_produk_3_rilis_erla WHERE tanggal>=''2026-05-01'' AND tanggal<''2026-06-01'' AND status IN (''0099'',''0999'',''0906'',''9999'') AND trader_id<>3384 AND nomor<>''''. GABUNGAN = COUNT(DISTINCT nomor) atas UNION ALL kedua sisi (nomor tidak overlap antar sistem). DB 23Jul2026: ERBA=5.084 · ERLA=192 · gabungan=5.276. ENTITY: "izin edar terbit" = NIE → COUNT(DISTINCT nomor) (predikat §1); kolom tanggal = `tanggal` (tanggal terbit), BUKAN tanggal_bayar (predikat §2). JP: "terbit" BUKAN pemicu jenis_permohonan → TANPA filter JP (predikat §4/RC-2). Dictionary STATUS: ERBA 0999/0906/9999; ERLA di dictionary tercatat tanpa zero-pad (999/906/99/9/0) TAPI data tersimpan 4-digit ber-zero-pad — filter 4-digit di atas benar terhadap data.'
