name: UAT_NEGARA_1
scenario_id: UAT-NEGARA-1
verification_date: '2026-07-23'
description: 'UAT-NEGARA-1 — Scope-agnostic (ERBA/ERLA/UNION valid via assert_any_of). Kode negara SAMA di kedua sistem (dictionary shared).'
turns:
- prompt: berapa jumlah produk BPOM yang diproduksi dari pabrik di China?
  assert_contains:
  - 'China'
  assert_any_of:
  -
    - '16.813'
  -
    - '11.250'
    - 'ERBA'
  -
    - '5.563'
    - 'ERLA'
  tolerance_pct: 5
  note: 'SQL ERBA: SELECT COUNT(DISTINCT nomor) FROM t_produk_3_erba WHERE negara_pabrik=''CN'' AND status IN (''0999'',''0906'',''9999'') AND trader_id::bigint NOT IN (5,17,50,85) AND nomor<>''''. SQL ERLA: idem pada t_produk_3_rilis_erla dgn status IN (''0099'',''0999'',''0906'',''9999'') AND trader_id<>3384. GABUNGAN = COUNT(DISTINCT nomor) atas UNION ALL. DB 23Jul2026: ERBA=11.250 · ERLA=5.563 · gabungan=16.813. Dictionary: kategori "NEGARA_PABRIK dan NEGARA_PRODUSEN" sumber="ERLA dan ERBA" kode CN = "Tiongkok / China" — kode SAMA di kedua sistem, tidak ada isu beda penomoran (catatan: baris CN muncul DUA KALI di dictionary, duplikat tak berbahaya). ENTITY: "produk ... diproduksi" = NIE terdaftar → COUNT(DISTINCT nomor) (predikat §1); memakai produk_id akan meng-inflate. Kolom negara_pabrik (pabrik pembuat), BUKAN negara_produsen — sebut kolom yang dipakai di jawaban.'
