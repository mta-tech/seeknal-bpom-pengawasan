name: UAT_MT_MINOR_MEI26_1
scenario_id: UAT-MT-MINOR-MEI26-1
verification_date: '2026-07-23'
description: 'UAT-MT-MINOR-MEI26-1 — single-scope by-design (risiko = ERBA only). Kasus di mana filter jenis_permohonan MEMANG sah karena prompt menyebut jenis permohonannya ("variasi minor").'
turns:
- prompt: variasi minor untuk produk menengah tinggi yang terbit bulan Mei 2026 berapa?
  assert_contains:
  - 'Menengah Tinggi'
  - 'minor'
  assert_any_of:
  -
    - '17'
  tolerance_pct: 5
  note: 'SQL: SELECT COUNT(DISTINCT nomor) FROM t_produk_3_erba WHERE kategori_dokumen=''302'' AND jenis_permohonan=''303'' AND tanggal::timestamp>=''2026-05-01'' AND tanggal::timestamp<''2026-06-01'' AND status IN (''0999'',''0906'',''9999'') AND trader_id::bigint NOT IN (5,17,50,85) AND nomor<>''''. DB 23Jul2026 = 17. CATATAN JP: berbeda dari kasus "terbit" biasa, di sini filter jenis_permohonan SAH karena prompt secara eksplisit menanyakan satu jenis permohonan ("variasi minor" = JP 303), bukan sekadar "yang terbit" (predikat §4/RC-2). Dictionary: JENIS_PERMOHONAN sumber="ERBA dan ERLA" kode 303=Perubahan Minor (kode SAMA di kedua sistem); KATEGORI_DOKUMEN sumber=ERBA saja kode 302=Menengah Tinggi (ERLA tidak punya padanan resmi). Pembanding Mei 2026: MT permohonan baru (JP 301)=147.'
