name: UAT_MONITORING_STATUS_1
scenario_id: UAT-MONITORING-STATUS-1
verification_date: '2026-07-23'
description: 'UAT-MONITORING-STATUS-1 — kualitatif multi-dimensi (menguji kemampuan meringkas), gabungan ERBA+ERLA. Angka jadi referensi; assert pada dimensi yang wajib muncul, bukan angka presisi.'
turns:
- prompt: bisa kasih gambaran kondisi registrasi produk pangan BPOM saat ini secara keseluruhan?
  assert_contains:
  - 'aktif'
  - 'dalam proses'
  - 'dicabut'
  note: 'SQL TERDAFTAR ERBA: SELECT COUNT(DISTINCT nomor) FROM t_produk_3_erba WHERE status IN (''0999'',''0906'',''9999'') AND trader_id::bigint NOT IN (5,17,50,85) AND nomor<>''''  → 141.219. SQL TERDAFTAR ERLA: SELECT COUNT(DISTINCT nomor) FROM t_produk_3_rilis_erla WHERE status IN (''0099'',''0999'',''0906'',''9999'') AND trader_id<>3384 AND nomor<>''''  → 175.641. SQL AKTIF (tier sempit, status=''0999'' saja): ganti klausa status jadi status=''0999'' pada kedua query di atas → ERBA=137.348 · ERLA=170.676. SQL DICABUT: SELECT COUNT(DISTINCT nomor) FROM <tabel> WHERE status=''0009'' → ERBA=5.599 · ERLA=1.240. SQL DIHAPUS: status=''0000'' → ERBA=253 · ERLA=13. SQL DALAM PROSES (ERBA saja): SELECT COUNT(DISTINCT produk_id) FROM t_produk_3_erba WHERE status NOT IN (''0999'',''0906'',''9999'',''0000'',''0009'',''0099'') → 60.726. DB 23Jul2026. DUA TIER STATUS: "saat ini" pada prompt BUKAN pemicu tier aktif (predikat §3) — pimpin dgn terdaftar, lampirkan aktif sebagai baris berlabel. ENTITY: NIE→nomor, pipeline/permohonan→produk_id (predikat §1). SCOPE: pipeline ERBA-only — ERLA hanya menyimpan status final, tidak punya tahapan proses. SUM-OF-PARTITIONS: total keseluruhan WAJIB dari query global DISTINCT sendiri, jangan menjumlah baris per-status/per-sistem (predikat §12-C). CATATAN NOT IN: bucket "dalam proses" memakai NOT IN sehingga ikut menyerap kode langka yang TIDAK terdaftar di dictionary (000X/0201/0500/0504/0900/0909/0916 — filter_code §4d); sebutkan bila angka ini disajikan sebagai total.'
