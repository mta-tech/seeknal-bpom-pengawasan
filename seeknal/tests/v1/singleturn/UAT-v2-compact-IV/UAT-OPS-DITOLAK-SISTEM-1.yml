  note: 'SQL: SELECT COUNT(DISTINCT produk_id) FROM t_produk_3_erba WHERE status IN (''0908'',''0911'',''0918''). DB 23Jul2026 = 12.957. Dictionary STATUS sumber=ERBA: 0908 & 0918 = "Pendaftar - Proses Ditolak Oleh System" · 0911 = "Pendaftar - Proses SPB Ditolak Oleh System" — ketiganya penolakan OTOMATIS. JANGAN dicampur dgn penolakan oleh PETUGAS (0902/0905/0913 = penerimaan/verifikasi ditolak) — itu konsep berbeda dan akan meng-overcount. ENTITY: "permohonan" → produk_id (predikat §1); TANPA filter status NIE. SCOPE: ERBA only (filter_code §2). TRANSIENT: toleransi 10%. Nilai lama 12.278.'
