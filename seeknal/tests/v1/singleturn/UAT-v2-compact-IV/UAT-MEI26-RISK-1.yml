name: UAT_MEI26_RISK_1
scenario_id: UAT-MEI26-RISK-1
verification_date: '2026-07-23'
description: 'UAT-MEI26-RISK-1 — single-scope by-design (risiko = ERBA only per dictionary). Breakdown per kategori risiko, tiap kelas dilabeli kodenya (predikat §12-B).'
turns:
- prompt: Berapa NIE yang terbit selama bulan Mei 2026 per kategori risiko?
  assert_contains:
  - 'Menengah Rendah'
  - 'Menengah Tinggi'
  - 'Tinggi'
  assert_any_of:
  -
    - '3.298'
    - '1.334'
    - '296'
    - '165'
  tolerance_pct: 5
  note: 'SQL: SELECT kategori_dokumen, COUNT(DISTINCT nomor) FROM t_produk_3_erba WHERE tanggal::timestamp>=''2026-05-01'' AND tanggal::timestamp<''2026-06-01'' AND status IN (''0999'',''0906'',''9999'') AND trader_id::bigint NOT IN (5,17,50,85) AND nomor<>'''' GROUP BY 1. DB 23Jul2026: kode 301 (Tinggi)=3.298 · 303 (Menengah Rendah)=1.334 · 304 (Tinggi Notifikasi)=296 · 302 (Menengah Tinggi)=165. TOTAL Mei 2026 ERBA=5.084 — perhatikan jumlah per-kelas (5.093) TIDAK sama dengan total global: satu nomor bisa muncul di lebih dari satu partisi lewat revisi, jadi headline WAJIB dari query global DISTINCT sendiri, bukan penjumlahan breakdown (predikat §12-C). Dictionary KATEGORI_DOKUMEN sumber=ERBA saja — ERLA tidak punya taksonomi ini, jadi pertanyaan "per kategori risiko" memang ERBA-only by design (filter_code §3).'
