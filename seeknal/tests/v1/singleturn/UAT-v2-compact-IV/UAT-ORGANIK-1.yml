name: UAT_ORGANIK_1
scenario_id: UAT-ORGANIK-1
verification_date: '2026-07-23'
description: 'UAT-ORGANIK-1 — Scope-agnostic (ERBA/ERLA/UNION valid via assert_any_of). Ada DECOY kode: organik WAJIB via pemrosesan=301, JANGAN klasifikasi_id=309.'
turns:
- prompt: ada berapa produk organik yang punya izin edar di BPOM?
  assert_contains:
  - 'organik'
  assert_any_of:
  -
    - '818'
  -
    - '214'
    - 'ERBA'
  -
    - '604'
    - 'ERLA'
  tolerance_pct: 5
  note: 'SQL ERBA: SELECT COUNT(DISTINCT nomor) FROM t_produk_3_erba WHERE pemrosesan=''301'' AND status IN (''0999'',''0906'',''9999'') AND trader_id::bigint NOT IN (5,17,50,85) AND nomor<>''''. SQL ERLA: idem pada t_produk_3_rilis_erla dgn status ERLA + trader_id<>3384. GABUNGAN = COUNT(DISTINCT nomor) atas UNION ALL. DB 23Jul2026: ERBA=214 · ERLA=604 · gabungan=818. Dictionary: PEMROSESAN sumber="ERLA dan ERBA" kode 301=Organik — kode SAMA kedua sistem. DECOY (filter_code §4 fixed binding): KLASIFIKASI_ID juga punya kode 309="Organik" — JANGAN dipakai; binding kanonik organik = pemrosesan=301. PERINGATAN KODE TAK TERDAFTAR: kolom pemrosesan berisi kode yang TIDAK ADA di dictionary — ERBA 303 & 403, ERLA 303 (total ~700 baris; lihat filter_code §4d). Selain itu dictionary PEMROSESAN punya tabrakan internal: kode 304 tercatat dua kali ("Pangan Very Low Risk" dan "Iradiasi").'
