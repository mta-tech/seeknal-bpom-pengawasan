  note: 'SQL ERBA: SELECT COUNT(DISTINCT produk_id) FROM t_produk_3_erba WHERE status IN (''0600'',''0601'',''0666'') AND trader_id::bigint NOT IN (5,17,50,85). SQL ERLA / GABUNGAN: tidak berlaku — tidak ada kode 06xx di t_produk_3_rilis_erla (isinya hanya status final). DB 27Jul2026 = 508; eksklusi trader tidak berpengaruh. RINCIAN KODE (dictionary STATUS sumber=ERBA): 0600 "Direktur - Proses Validasi" = 508 · 0601 "Direktur - Proses Validasi NIE Ditolak" = 0 baris · 0666 "Direktur - Validasi Pembatalan" = 0 baris. Ketiganya tetap ditulis di filter supaya tahan bila terisi kemudian, tapi jawaban harus menyebut bahwa seluruh 508 berasal dari 0600 saja — jangan melaporkan tiga kode seolah ketiganya menyumbang. KONTRAS DENGAN VERIF2: di tahap Verifikator 2 justru sebaliknya, data memakai 0500/0504 yang tidak terdaftar sementara 0501/0503 yang terdaftar kosong. Dua arah ketidakcocokan ini ada di tabel yang sama, jadi aturannya umum: cek sebaran nyata kode sebelum menulis filter; dictionary adalah katalog, bukan cermin isi data. BTP: t_btp_3_erba punya 0600 (16 permohonan), t_btp_3_erla tidak punya 06xx sama sekali — bila scope diperluas, 508 + 16 = 524. ENTITY: produk_id. TANPA FILTER STATUS NIE SAH: ini tahap sebelum NIE terbit; menumpuk status sah akan mengosongkan populasi. POSISI: satu tingkat sebelum penerbitan; antrian kecil dibanding Draft (26.401) dan Ditolak Sistem (12.934). TRANSIENT, toleransi 10%. Nilai lama 872 — turun jauh, wajar untuk antrian yang bergerak dua arah, bukan tanda filter salah.'
