name: UAT_EXPIRY_2027_1
scenario_id: UAT-EXPIRY-2027-1
verification_date: '2026-07-27'
description: 'UAT-EXPIRY-2027-1 — scope-agnostic. ERLA menyumbang 22x lipat ERBA, jadi jawaban wajib dipecah per sistem. Pasangan rincian risikonya ada di UAT-LC-EXP-RISIKO-1 (compact-V).'
turns:
- prompt: berapa izin edar yang akan habis masa berlakunya di tahun 2027?
  assert_contains:
  - '2027'
  assert_any_of:
  -
    - '32.216'
  -
    - '1.412'
    - 'ERBA'
  -
    - '30.804'
    - 'ERLA'
  tolerance_pct: 5
  note: 'SQL ERBA: SELECT COUNT(DISTINCT nomor) FROM t_produk_3_erba WHERE NULLIF(tanggal_exp,'''')::timestamp>=''2027-01-01'' AND NULLIF(tanggal_exp,'''')::timestamp<''2028-01-01'' AND status IN (''0999'',''0906'',''9999'') AND trader_id::bigint NOT IN (5,17,50,85) AND nomor<>''''. SQL ERLA: SELECT COUNT(DISTINCT nomor) FROM t_produk_3_rilis_erla WHERE tanggal_exp>=''2027-01-01'' AND tanggal_exp<''2028-01-01'' AND status IN (''0099'',''0999'',''0906'',''9999'') AND trader_id<>3384 AND nomor<>''''. GABUNGAN: COUNT(DISTINCT nomor) atas UNION ALL kedua query. DB 27Jul2026: ERBA=1.412 · ERLA=30.804 · gabungan=32.216. KOLOM & TIPE: tanggal_exp adalah kolom kondisi (kapan izin berakhir), bukan kolom hitung. Di ERBA seluruh kolom bertipe TEXT sehingga perlu NULLIF(...)::timestamp; di ERLA sudah TIMESTAMP dan dibandingkan langsung. Pakai rentang tanggal, bukan LIKE ''2027%'' seperti versi lama — LIKE pada teks ikut menangkap format yang tak terduga dan tidak bisa memakai perbandingan tanggal. TIMPANG ANTAR SISTEM: ERLA 30.804 vs ERBA 1.412 (22x) karena NIE lama berlaku 5 tahun dan gelombang terbitan ERLA jatuh tempo di sekitar 2027, sementara ERBA baru berjalan sejak akhir 2022 — menyajikan hanya total menyembunyikan bahwa bebannya hampir seluruhnya di sistem legacy. ENTITY: nomor. Pembanding produk_id: ERBA=1.792 · ERLA=50.479 — nilai ERLA lama (50.479) adalah hitungan produk_id, sehingga total lama 51.894 mencampur dua satuan. KAITAN: rincian per kelas risiko untuk tahun yang sama ada di UAT-LC-EXP-RISIKO-1 dan total ERBA-nya harus sama, 1.412. Nilai lama 51.894/1.415/50.479.'
