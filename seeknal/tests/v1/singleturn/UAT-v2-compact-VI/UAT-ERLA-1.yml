name: UAT_ERLA_1
scenario_id: UAT-ERLA-1
verification_date: '2026-07-27'
description: 'UAT-ERLA-1 — ERLA-only karena prompt-nya menyebut sistemnya. Assert lama berupa prefix "400." sudah pecah: ERLA kini 412 ribu. Selisih permohonan vs NIE di tabel ini 2,3x — angka pendamping wajib disebut.'
turns:
- prompt: Berapa total permohonan pangan olahan yang terdaftar di sistem ERLA untuk seluruh periode data?
  assert_contains:
  - 'ERLA'
  assert_any_of:
  -
    - '412.586'
  -
    - '176.862'
    - 'NIE'
  tolerance_pct: 5
  note: 'SQL ERLA: SELECT COUNT(DISTINCT produk_id) FROM t_produk_3_rilis_erla WHERE trader_id<>3384. SQL ERBA / GABUNGAN: tidak berlaku — prompt membatasi ke ERLA. DB 27Jul2026 = 412.586 permohonan · 176.862 NIE (COUNT(DISTINCT nomor) dgn nomor<>'''' pada populasi yang sama). ENTITY: subjeknya "permohonan" → produk_id. Angka NIE 176.862 WAJIB dilampirkan berlabel karena selisihnya 2,3x dan itu fakta penting tentang tabel ini: satu NIE dipecah menjadi banyak baris pengajuan/revisi, sehingga menyebut 412.586 sebagai "jumlah produk" akan salah baca lebih dari dua kali lipat. TANPA FILTER STATUS: "seluruh periode data" berarti seluruh isi tabel apa adanya, termasuk yang dicabut, kedaluwarsa, dan sudah diubah. RENTANG DATA: tanggal_aju 2012-03 s/d 2026-05; ERLA praktis beku — sejak 2023 hampir tidak menerima permohonan baru dan isinya tinggal perubahan atas produk lama. ASSERT LAMA PECAH: versi lama memakai potongan awal angka (''400.'') yang cocok saat ERLA masih 400.784; begitu tumbuh ke 412.586 pola itu gagal total. Jangan memakai prefix angka sebagai assert — pakai nilai penuh dengan toleransi. Eksklusi trader uji 3384 ("PT. Pengembangan E-RBA 2021", NPWP 123321123321123, produk "TEST AMDK") membuang 53 baris. Nilai lama 400.784.'
