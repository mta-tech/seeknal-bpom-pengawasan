name: UAT_EXPIRY_DIST_1
scenario_id: UAT-EXPIRY-DIST-1
verification_date: '2026-07-27'
description: 'UAT-EXPIRY-DIST-1 — scope-agnostic, tapi JAWABANNYA BERUBAH menurut scope: puncak gabungan 2030, puncak ERLA-saja 2026. Wajib sebut scope yang dipakai.'
turns:
- prompt: kapan paling banyak izin edar BPOM yang akan berakhir masa berlakunya?
  assert_contains:
  - 'kadaluarsa'
  assert_any_of:
  -
    - '2030'
    - '44.712'
  -
    - '2026'
    - 'ERLA'
  tolerance_pct: 5
  note: 'SQL GABUNGAN (bentuk kanonik — satu GROUP BY, jangan memilih tahun dengan tangan): SELECT to_char(te,''YYYY'') thn, COUNT(DISTINCT nomor) FROM (SELECT NULLIF(tanggal_exp,'''')::timestamp te, nomor FROM t_produk_3_erba WHERE status IN (''0999'',''0906'',''9999'') AND trader_id::bigint NOT IN (5,17,50,85) AND nomor<>'''' AND NULLIF(tanggal_exp,'''') IS NOT NULL UNION ALL SELECT tanggal_exp, nomor FROM t_produk_3_rilis_erla WHERE status IN (''0099'',''0999'',''0906'',''9999'') AND trader_id<>3384 AND nomor<>'''' AND tanggal_exp IS NOT NULL) x GROUP BY 1 ORDER BY 2 DESC. SQL ERBA SAJA / ERLA SAJA: pakai satu sisi UNION di atas. DB 27Jul2026 gabungan: 2030=44.712 · 2029=41.856 · 2028=36.628 · 2027=32.216. Puncaknya 2030. JAWABAN BERGANTUNG SCOPE — ini inti kasusnya: bila hanya ERLA, puncaknya 2026 (32.294), bukan 2030, karena ERLA beku sejak 2023 sehingga tidak punya terbitan baru yang jatuh tempo di akhir dekade; puncak 2030 sepenuhnya disumbang ERBA. Jadi jawaban WAJIB menyebut scope yang dipakai; menyebut "2030" tanpa keterangan akan salah bagi pengguna yang bertanya tentang sistem lama. POLA: masa berlaku NIE 5 tahun, jadi distribusi kedaluwarsa adalah bayangan distribusi penerbitan lima tahun sebelumnya — puncak 2030 mencerminkan gelombang terbitan 2025. ENTITY: nomor. TANPA FILTER TAMBAHAN: yang dihitung seluruh NIE yang pernah terbit dan punya tanggal_exp; baris tanpa tanggal_exp dikeluarkan dan jumlahnya sebaiknya disebut bila menyajikan distribusi sebagai total. ASSERT: nilainya exact-match di versi lama (44.758) sehingga pecah oleh drift sekecil apa pun — kini pakai toleransi 5%. Nilai lama 2030 = 44.758.'
