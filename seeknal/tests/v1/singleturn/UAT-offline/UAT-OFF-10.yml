name: UAT_OFF_10
scenario_id: UAT-OFF-10
description: 'UAT-OFF-10 — Scope-agnostic. Nilai ERBA kanonik dari note asli; ERLA live re-query. DB ref catatan per 2026-07-14 (BUKAN standar kebenaran).'
turns:
- prompt: apakah izin edar formula bayi yang dicabut masih berlaku atau sudah kadaluarsa
  assert_contains:
  - 'masih berlaku'
  assert_any_of:
  -
    - '5.411'
  -
    - '5.106'
    - 'ERBA'
  -
    - '305'
    - 'ERLA'
  tolerance_pct: 5
  note: 'UAT-OFF-10 — Scope-agnostic (ERBA/ERLA/UNION valid via assert_any_of). ERBA = nilai kanonik note asli; ERLA = live re-query (verifikasi via SQL di bawah). Asal data NIE dicabut (status=0009) ERBA = 5.106. Semua (5.106) memiliki tanggal_exp>NOW (masih berlaku secara masa berlaku), 0 kadaluarsa. Status "dicabut" tidak sama dengan "kadaluarsa". SQL ERBA: SELECT COUNT(DISTINCT produk_id) FROM t_produk_3_erba WHERE status=''0009'' AND tanggal_exp IS NOT NULL AND tanggal_exp::text >= ''2026-07-14''. SQL ERLA: SELECT COUNT(DISTINCT produk_id) FROM t_produk_3_rilis_erla WHERE status=''0009'' AND tanggal_exp IS NOT NULL AND tanggal_exp::text >= ''2026-07-14''. Tolerance sesuai field.'
