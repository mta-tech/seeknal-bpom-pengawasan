name: UAT_OFF_AMDK_ERBA_2024_2025
scenario_id: UAT-OFF-2
verification_date: '2026-07-17'
description: 'Persetujuan produk AMDK 2024-2025 ereg RBA saja (ERBA, jenis_pangan IN (1401,1402), JP 301+303+305, status issued, produk_id). DB 17Jul2026: 2024=2.692, 2025=2.570.'
turns:
- prompt: Kita ambil data ereg RBA saja. Tampilkan jumlah persetujuan produk AMDK pada tahun 2024 sampai 2025
  assert_contains:
  - AMDK
  - '2024'
  - '2025'
  assert_any_of:
  -
    - '2.692'
    - '2.570'
  tolerance_pct: 5
  note: 'Persetujuan produk = COUNT(DISTINCT produk_id). AMDK = jenis_pangan IN (1401,1402). Baru = JP exclude 302 mayor = IN (301,303,305). Status issued = IN (0999,0906,9999). Exclude test accounts. DB 17Jul2026: 2024=2.692, 2025=2.570.'
