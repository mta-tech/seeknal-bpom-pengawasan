name: UAT_OFF_NIE_Mei_2026
scenario_id: UAT-OFF-1a
description: 'UAT-OFF-1 — NIE terbit Mei 2026 (Gabungan ERBA+ERLA). Entity=nomor (NIE), date=tanggal (tanggal terbit), status valid set, tanpa JP filter. DB verified 2026-07-17.'
turns:
- prompt: berapa NIE yang terbit selama bulan Mei 2026?
  assert_contains:
  - 'Mei 2026'
  assert_any_of:
  -
    - '5.276'
  -
    - '5.084'
    - 'ERBA'
  -
    - '192'
    - 'ERLA'
  tolerance_pct: 0
  note: 'NIE terbit = COUNT(DISTINCT nomor) di tanggal, BUKAN produk_id di tanggal_bayar. SEMUA jenis_permohonan (terbit bukan trigger JP). Status ERBA IN(0999,0906,9999), ERLA IN(0099,0999,0906,9999). Exclude test accounts. DB 17Jul2026: ERBA=5.084, ERLA=192, total=5.276.'
