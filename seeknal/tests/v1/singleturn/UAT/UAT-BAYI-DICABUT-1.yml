  - formula bayi
  - tidak ditemukan
  assert_not_contains:
  - '10'
  note: 'UAT-BAYI-DICABUT-1 — DB: tidak ada NIE formula bayi (ERBA kode 1301+1302, ERLA kode 622+604+624) dengan status dicabut/dibatalkan = 0. Dari UAT JSON: sistem sebelumnya bilang "10" (salah, itu kategori lain).'
