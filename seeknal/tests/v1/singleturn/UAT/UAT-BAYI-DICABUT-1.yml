description: 'UAT-BAYI-DICABUT-1 — Cek apakah ada NIE formula bayi yang dicabut. DB verified 2026-06-17: 0 (tidak ada di ERBA maupun ERLA). Dari UAT JSON: sistem salah bilang ada 10 lalu dikoreksi. Regression test keakuratan.'
turns:
- prompt: apakah ada izin edar formula bayi yang dicabut atau dibatalkan BPOM?
