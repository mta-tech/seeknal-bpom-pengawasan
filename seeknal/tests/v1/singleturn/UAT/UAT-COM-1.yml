name: UAT_Komitmen_Dibatalkan_MR
scenario_id: UAT-COM-1
description: 'UAT-COM-1 — Produk MR dengan komitmen dibatalkan (Case B: tanpa NIE status filter). DB verified 2026-06-17: 5.198. RC-4: sistem UAT menghasilkan 254 (salah, memakai NIE status filter sehingga lewatkan aplikasi yang belum dapat NIE).'
turns:
- prompt: Berapa jumlah produk MR yang dibatalkan komitmennya sampai dengan tahun 2026?
  assert_contains:
  - '5.198'
  - Dibatalkan
  - Menengah Rendah
  assert_not_contains:
  - '254'
  note: 'UAT-COM-1 — RC-4 Case B. status_komitmen=5 (Komitmen Dibatalkan), tanpa filter status NIE. 5.198 vs 254 (salah, Case A dengan NIE filter).'
