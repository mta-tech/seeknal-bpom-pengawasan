name: UAT_Formula_Bayi_JP_Breakdown
scenario_id: UAT-BAYI-JP-BREAKDOWN-1
description: 'UAT-BAYI-JP-BREAKDOWN-1 — Breakdown jenis permohonan formula bayi aktif (295 total aktif). Dari UAT JSON: "apakah semua 267 adalah permohonan baru atau ada yang perubahan". Uji kemampuan multi-dimensi pada entitas spesifik.'
turns:
- prompt: dari izin edar formula bayi yang masih berlaku, apakah semuanya permohonan baru atau ada yang perubahan dan daftar ulang?
  assert_contains:
  - formula bayi
  - permohonan baru
  note: 'UAT-BAYI-JP-BREAKDOWN-1 — dari UAT JSON sesi nyata. Sistem harus bisa breakdown JP untuk entitas spesifik (formula bayi) yang aktif. Ada campuran baru, perubahan, daftar ulang.'
