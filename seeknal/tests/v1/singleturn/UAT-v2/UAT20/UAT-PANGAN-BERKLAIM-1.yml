name: UAT_PANGAN_BERKLAIM_1
scenario_id: UAT-PANGAN-BERKLAIM-1
description: 'UAT-PANGAN-BERKLAIM-1 — Scope-agnostic (ERBA/ERLA/UNION valid via assert_any_of). DB ref catatan (BUKAN standar kebenaran).'
turns:
- prompt: berapa produk pangan berklaim yang sudah punya izin edar?
  assert_contains:
  - 'berklaim'
  assert_any_of:
  -
    - '30.327'
  -
    - '256'
    - 'ERBA'
  -
    - '30.071'
    - 'ERLA'
  tolerance_pct: 5
  note: 'UAT-PANGAN-BERKLAIM-1 — Scope-agnostic. ERBA=note kanonik 256; ERLA=live 30.071. SQL ERBA: SELECT COUNT(DISTINCT produk_id) FROM t_produk_3_erba WHERE klasifikasi_id=''305'' AND status IN (''0999'',''0906'',''9999''). SQL ERLA: SELECT COUNT(DISTINCT produk_id) FROM t_produk_3_rilis_erla WHERE klasifikasi_id=''305'' AND status IN (''0999'',''0906'',''9999''). UAT-PANGAN-BERKLAIM-1 — klasifikasi_id=305 (Pangan Berklaim) ERBA NIE aktif = 256. Contoh: produk rendah gula, bebas laktosa, high protein.'
