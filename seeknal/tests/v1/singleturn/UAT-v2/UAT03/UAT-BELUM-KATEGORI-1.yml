name: UAT_BELUM_KATEGORI_1
scenario_id: UAT-BELUM-KATEGORI-1
description: 'UAT-BELUM-KATEGORI-1 — Scope-agnostic (ERBA/ERLA/UNION valid via assert_any_of). DB ref catatan (BUKAN standar kebenaran).'
turns:
- prompt: berapa produk yang belum punya kategori risiko di BPOM?
  assert_contains:
  - 'belum'
  assert_any_of:
  -
    - '28.687'
  -
    - '28.667'
    - 'ERBA'
  -
    - '20'
    - 'ERLA'
  tolerance_pct: 5
  note: 'UAT-BELUM-KATEGORI-1 — Scope-agnostic. ERBA=note kanonik 28.667; ERLA=live 20. SQL ERBA: SELECT COUNT(DISTINCT produk_id) FROM t_produk_3_erba WHERE jenis_dokumen=''000''. SQL ERLA: SELECT COUNT(DISTINCT produk_id) FROM t_produk_3_rilis_erla WHERE jenis_dokumen=''000''. UAT-BELUM-KATEGORI-1 — jenis_dokumen=000 (Belum Dikategorikan) ERBA = 28.667. Ini bisa produk legacy atau proses yang belum selesai dikategorikan.'
