name: UAT_FORECAST_3
scenario_id: UAT-FORECAST-3
description: 'UAT-FORECAST-3 — ETS-seasonal engine. Point forecast varies per calendar month, but exactly ONE Tingkat Keyakinan for the whole projection.'
turns:
- prompt: Prediksi permohonan untuk bulan depan, 2 bulan ke depan, dan 3 bulan ke depan
  assert_contains:
  - Tingkat Keyakinan
  - Rentang Realistis
  - Proyeksi Detail
  assert_not_contains:
  - sigma
  - sub_type
  - lower_80
  - upper_80
  note: 'UAT-FORECAST-3 — Proyeksi Detail should show 3 rows (H1/H2/H3); the Perkiraan value MAY differ between rows now. Tingkat Keyakinan must still appear exactly once as a single label for the whole projection.'
