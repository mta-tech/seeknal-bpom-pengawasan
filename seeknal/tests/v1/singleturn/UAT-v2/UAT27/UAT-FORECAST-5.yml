name: UAT_FORECAST_5
scenario_id: UAT-FORECAST-5
description: 'UAT-FORECAST-5 — Blok Kondisi Data harus hadir dengan format checklist. Tidak boleh ada angka teknis mentah (rasio, CV, avg_recent, sigma).'
turns:
- prompt: Proyeksikan jumlah NIE yang akan terbit bulan depan di sistem ERBA
  assert_contains:
  - Kondisi Data
  - Metodologi
  - Rentang Realistis
  - Tingkat Keyakinan
  - Ringkasan
  assert_not_contains:
  - avg_recent
  - avg_prior
  - break_ratio
  - cv =
  - sigma =
  - 0.70
  - 1.30
  note: 'UAT-FORECAST-5 — Kondisi Data boundary test. Blok Kondisi Data harus menggunakan format checklist saja, tidak boleh ada angka atau istilah teknis internal. Blok Metodologi harus hadir (MAPE % dan komposisi metode).'
