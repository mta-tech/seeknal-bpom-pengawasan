description: 'UAT-FORECAST-6 — Historis dan proyeksi harus disajikan dalam satu timeline terintegrasi, bukan dua blok terpisah.'
turns:
- prompt: Bagaimana perkembangan permohonan ERBA dalam 4 bulan terakhir dan proyeksinya 3 bulan ke depan?
  assert_contains:
  - Historis & Proyeksi
  - sekarang
  - Proyeksi Detail
  - Rentang Realistis
  - Apa Artinya
  assert_not_contains:
  - sigma
  - ADF
  note: 'UAT-FORECAST-6 — Unified timeline test. Blok "Historis & Proyeksi" harus ada dalam satu view yang menampilkan bulan historis lalu separator (seperti "sekarang") lalu bulan proyeksi. Apa Artinya harus memuat perbandingan arah (meningkat/menurun/stabil).'
