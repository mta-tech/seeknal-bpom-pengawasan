name: UAT_FORECAST_1
scenario_id: UAT-FORECAST-1
description: 'UAT-FORECAST-1 — Prediksi permohonan ERBA 3 bulan ke depan. Test utama: struktur 7-blok output harus hadir lengkap dengan kosakata wajib.'
turns:
- prompt: Prediksi permohonan pangan olahan untuk 3 bulan ke depan
  assert_contains:
  - Ringkasan
  - Rata-rata 3 bulan terakhir
  - Rata-rata 3 bulan ke depan
  - Kualitas Proyeksi
  - Kondisi Data
  - Historis & Proyeksi
  - Proyeksi Detail
  - Rentang Realistis
  - Tingkat Keyakinan
  - Apa Artinya
  - Metodologi
  - median
  assert_not_contains:
  - sigma
  - p10
  - p90
  - ADF
  - ACF
  - Lower 95%
  - Upper 95%
  - Forecast
  - Interpretasi
  - Seasonal Naive
  - Moving Average
  note: 'UAT-FORECAST-1 — Permohonan ERBA total, 3 bulan ke depan. Test 7-blok output structure. Harus ada: Ringkasan perbandingan, Kondisi Data checklist, Historis & Proyeksi unified timeline, Proyeksi Detail table dengan Rentang Realistis, Apa Artinya bullets, Metodologi footer (menyebut "median", bukan lagi SN+MA3/AutoETS). Tidak boleh ada: sigma/p10/p90/ADF/ACF, kata "Forecast" atau "Interpretasi".'
