  note: 'UAT-JP-PERMOHONAN-BARU-NOTIF-1 — Scope-agnostic. ERBA=note kanonik 2.132; ERLA=live 10. SQL ERBA: SELECT COUNT(DISTINCT produk_id) FROM t_produk_3_erba WHERE jenis_permohonan=''305'' AND tanggal_bayar::text LIKE ''2025%'' AND status IN (''0999'',''0906'',''9999''). SQL ERLA: SELECT COUNT(DISTINCT produk_id) FROM t_produk_3_rilis_erla WHERE jenis_permohonan=''305'' AND tanggal_bayar::text LIKE ''2025%'' AND status IN (''0999'',''0906'',''9999''). UAT-JP-PERMOHONAN-BARU-NOTIF-1 — jenis_permohonan=305 (Permohonan Baru Notifikasi) ERBA 2025 = 2.132. Jalur notifikasi untuk produk Very Low Risk. Domain: Jenis Permohonan.'
