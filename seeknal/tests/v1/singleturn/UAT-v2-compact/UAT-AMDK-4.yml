name: UAT_AMDK_4
scenario_id: UAT-AMDK-4
verification_date: '2026-07-23'
description: 'UAT-AMDK-4 — Scope-agnostic. Phrasing alternatif UAT-AMDK-1 ("air minum dalam kemasan" dieja penuh); scope, filter, entity identik.'
turns:
- prompt: ada berapa izin edar produk air minum dalam kemasan tahun 2023?
  assert_contains:
  - 'AMDK'
  - '2023'
  assert_any_of:
  -
    - '2.197'
  -
    - '1.774'
    - 'ERBA'
  -
    - '423'
    - 'ERLA'
  tolerance_pct: 5
  note: 'SQL ERBA: SELECT COUNT(DISTINCT nomor) FROM t_produk_3_erba WHERE jenis_pangan IN (''1401'',''1402'') AND tanggal::timestamp>=''2023-01-01'' AND tanggal::timestamp<''2024-01-01'' AND status IN (''0999'',''0906'',''9999'') AND trader_id::bigint NOT IN (5,17,50,85) AND nomor<>''''. SQL ERLA: SELECT COUNT(DISTINCT nomor) FROM t_produk_3_rilis_erla WHERE jenis_pangan IN (''651'',''652'',''655'') AND tanggal>=''2023-01-01'' AND tanggal<''2024-01-01'' AND status IN (''0099'',''0999'',''0906'',''9999'') AND trader_id<>3384 AND nomor<>''''. GABUNGAN = COUNT(DISTINCT nomor) atas UNION ALL. DB 23Jul2026: ERBA=1.774 · ERLA=423 · gabungan=2.197. ENTITY: "izin edar" = NIE → nomor. Jawaban WAJIB mengeja "Air Minum Dalam Kemasan (AMDK)" minimal sekali (predikat §12-B: singkatan dieja penuh). Kode AMDK berbeda antar sistem (ERBA 1401/1402 vs ERLA 651/652/655) — lihat UAT-AMDK-1. KOREKSI historis: filter lama hanya 1401, seharusnya 1401+1402.'
