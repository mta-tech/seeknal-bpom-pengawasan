name: UAT_MR_1
scenario_id: UAT-MR-1
verification_date: '2026-07-23'
description: 'UAT-MR-1 — Scope-agnostic. JEBAKAN LINTAS SISTEM: "Menengah Rendah" ERBA (kategori_dokumen=303) dipadankan ke ERLA lewat KOLOM BERBEDA (jenis_dokumen=301 Low Risk) — taksonomi tidak identik.'
turns:
- prompt: Berapa jumlah izin edar pangan olahan dengan risiko menengah rendah?
  assert_contains:
  - 'Menengah Rendah'
  assert_any_of:
  -
    - '120.370'
  -
    - '42.263'
    - 'ERBA'
  -
    - '78.107'
    - 'ERLA'
  tolerance_pct: 5
  note: 'SQL ERBA: SELECT COUNT(DISTINCT nomor) FROM t_produk_3_erba WHERE kategori_dokumen=''303'' AND status IN (''0999'',''0906'',''9999'') AND trader_id::bigint NOT IN (5,17,50,85) AND nomor<>''''. SQL ERLA: SELECT COUNT(DISTINCT nomor) FROM t_produk_3_rilis_erla WHERE jenis_dokumen=''301'' AND status IN (''0099'',''0999'',''0906'',''9999'') AND trader_id<>3384 AND nomor<>''''. GABUNGAN = COUNT(DISTINCT nomor) atas UNION ALL. DB 23Jul2026: ERBA=42.263 · ERLA=78.107 · gabungan=120.370. BEDA KOLOM & TAKSONOMI ANTAR SISTEM (inti kasus): dictionary KATEGORI_DOKUMEN terdaftar sumber=ERBA SAJA (303="Menengah Rendah"); ERLA tidak punya entri untuk taksonomi itu, sehingga padanan terdekat memakai KOLOM LAIN yaitu jenis_dokumen=301 ("Pangan Low Risk", dictionary sumber="ERLA dan ERBA"). Keduanya BUKAN sinonim persis — Low Risk vs Menengah Rendah beda skema — jadi angka gabungan wajib disertai catatan bahwa dua sistem memakai skema klasifikasi berbeda. JANGAN mencampur kategori_dokumen dan jenis_dokumen dalam satu query (kode 301/302/303 bertabrakan makna antar kedua kolom, filter_code §3). ENTITY: "izin edar" → nomor. Nilai lama 17Jul: 42.001/78.117/120.118.'
