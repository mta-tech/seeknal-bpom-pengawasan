name: UAT_AMDK_1
scenario_id: UAT-AMDK-1
verification_date: '2026-07-23'
description: 'UAT-AMDK-1 — Scope-agnostic (ERBA/ERLA/UNION valid via assert_any_of). Re-verified 23Jul2026 + SQL literal ditambahkan.'
turns:
- prompt: Berapa jumlah NIE untuk produk AMDK pada tahun 2023?
  assert_contains:
  - 'AMDK'
  - '2023'
  assert_any_of:
  -
    - '2.197'
  -
    - '1.774'
    - 'ERBA'
  -
    - '423'
    - 'ERLA'
  tolerance_pct: 5
  note: 'SQL ERBA: SELECT COUNT(DISTINCT nomor) FROM t_produk_3_erba WHERE jenis_pangan IN (''1401'',''1402'') AND tanggal::timestamp>=''2023-01-01'' AND tanggal::timestamp<''2024-01-01'' AND status IN (''0999'',''0906'',''9999'') AND trader_id::bigint NOT IN (5,17,50,85) AND nomor<>''''. SQL ERLA: SELECT COUNT(DISTINCT nomor) FROM t_produk_3_rilis_erla WHERE jenis_pangan IN (''651'',''652'',''655'') AND tanggal>=''2023-01-01'' AND tanggal<''2024-01-01'' AND status IN (''0099'',''0999'',''0906'',''9999'') AND trader_id<>3384 AND nomor<>''''. GABUNGAN = COUNT(DISTINCT nomor) atas UNION ALL. DB 23Jul2026: ERBA=1.774 · ERLA=423 · gabungan=2.197. ENTITY: prompt menyebut "NIE" → COUNT(DISTINCT nomor) (predikat §1). JP: "jumlah NIE ... pada tahun" bukan pemicu jenis_permohonan → TANPA filter JP (predikat §4/RC-2). BEDA KODE ERBA vs ERLA (filter_code §5): AMDK di ERBA = jenis_pangan IN (1401,1402); di ERLA = IN (651,652,655) — rentang kode BERBEDA total, tidak boleh saling dipakai. KODE TIDAK DI DICTIONARY: kategori JENIS_PANGAN tidak terdaftar di data_dictionary (filter_code §4d) — mapping AMDK bersifat anchor terverifikasi, bukan dari dictionary. Nilai lama 1.743/423/2.166 (snapshot lebih awal; ERBA tumbuh, ERLA beku).'
