name: UAT_OFF_NIE_Mei_2026
scenario_id: UAT-OFF-1a
verification_date: '2026-07-23'
description: 'UAT-OFF-1 — NIE terbit Mei 2026, gabungan ERBA+ERLA. Menguji tiga aturan sekaligus: entity=nomor, kolom tanggal terbit, dan TANPA filter JP.'
turns:
- prompt: berapa NIE yang terbit selama bulan Mei 2026?
  assert_contains:
  - 'Mei 2026'
  assert_any_of:
  -
    - '5.276'
  -
    - '5.084'
    - 'ERBA'
  -
    - '192'
    - 'ERLA'
  tolerance_pct: 5
  note: 'SQL ERBA: SELECT COUNT(DISTINCT nomor) FROM t_produk_3_erba WHERE tanggal::timestamp>=''2026-05-01'' AND tanggal::timestamp<''2026-06-01'' AND status IN (''0999'',''0906'',''9999'') AND trader_id::bigint NOT IN (5,17,50,85) AND nomor<>''''. SQL ERLA: SELECT COUNT(DISTINCT nomor) FROM t_produk_3_rilis_erla WHERE tanggal>=''2026-05-01'' AND tanggal<''2026-06-01'' AND status IN (''0099'',''0999'',''0906'',''9999'') AND trader_id<>3384 AND nomor<>''''. GABUNGAN = COUNT(DISTINCT nomor) atas UNION ALL. DB 23Jul2026: ERBA=5.084 · ERLA=192 · gabungan=5.276. TIGA ATURAN YANG DIUJI: (1) ENTITY — "NIE terbit" → COUNT(DISTINCT nomor), BUKAN produk_id; (2) KOLOM TANGGAL — `tanggal` (tanggal terbit), BUKAN tanggal_bayar yang dipakai untuk entity permohonan (predikat §2); (3) JP — "terbit" BUKAN pemicu jenis_permohonan, jadi SEMUA jenis permohonan ikut, tanpa filter (predikat §4/RC-2). BEDA TIPE KOLOM: tanggal di ERBA bertipe TEXT (wajib ::timestamp), di ERLA sudah timestamp — cast hanya di sisi ERBA (predikat §9). Status set berbeda antar sistem (ERLA menambah 0099). Toleransi dinaikkan 0→5% karena ERBA tumbuh harian.'
