name: UAT_AMDK_2
scenario_id: UAT-AMDK-2
verification_date: '2026-07-23'
description: 'UAT-AMDK-2 — single-scope by-design (prompt menyebut "dari sistem ERBA saja"), jadi assert_contains WAJIB memuat ''ERBA''.'
turns:
- prompt: Berapa NIE AMDK tahun 2023 dari sistem ERBA saja?
  assert_contains:
  - 'AMDK'
  - 'ERBA'
  assert_any_of:
  -
    - '1.774'
  tolerance_pct: 5
  note: 'SQL: SELECT COUNT(DISTINCT nomor) FROM t_produk_3_erba WHERE jenis_pangan IN (''1401'',''1402'') AND tanggal::timestamp>=''2023-01-01'' AND tanggal::timestamp<''2024-01-01'' AND status IN (''0999'',''0906'',''9999'') AND trader_id::bigint NOT IN (5,17,50,85) AND nomor<>''''. DB 23Jul2026 = 1.774 (identik dengan/tanpa filter JP 301+305 — JP lain ~0 untuk AMDK 2023, tapi kanoniknya TETAP tanpa filter JP karena prompt tak menyebut "baru"). ENTITY: nomor. Pembanding ERLA tahun sama = 423 — DI LUAR scope prompt, jangan dimasukkan ke headline. AMDK ERBA = jenis_pangan IN (1401,1402); kode ERLA (651/652/655) tidak berlaku di tabel ERBA (filter_code §5). Nilai lama 1.743 = snapshot 1401-only.'
