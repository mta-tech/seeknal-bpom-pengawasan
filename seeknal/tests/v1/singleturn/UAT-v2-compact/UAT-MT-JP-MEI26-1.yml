name: UAT_MT_JP_MEI26_1
scenario_id: UAT-MT-JP-MEI26-1
verification_date: '2026-07-23'
description: 'UAT-MT-JP-MEI26-1 — single-scope by-design (ERBA). Kasus di mana filter jenis_permohonan MEMANG sah: prompt menyebut "permohonan baru".'
turns:
- prompt: untuk permohonan baru produk menengah tinggi yang terbit bulan Mei 2026 berapa jumlahnya?
  assert_contains:
  - 'Menengah Tinggi'
  - 'Mei'
  assert_any_of:
  -
    - '147'
  tolerance_pct: 5
  note: 'SQL: SELECT COUNT(DISTINCT nomor) FROM t_produk_3_erba WHERE kategori_dokumen=''302'' AND jenis_permohonan=''301'' AND tanggal::timestamp>=''2026-05-01'' AND tanggal::timestamp<''2026-06-01'' AND status IN (''0999'',''0906'',''9999'') AND trader_id::bigint NOT IN (5,17,50,85) AND nomor<>''''. DB 23Jul2026 = 147. FILTER JP SAH DI SINI: prompt memuat kata "baru" → jenis_permohonan=''301'' (predikat §4/RC-2). Bandingkan dengan UAT-MT-1 yang TIDAK boleh pakai filter JP. Pembanding Mei 2026 (kd302): Perubahan Minor (JP 303)=17 · Perubahan Mayor (JP 302)=3. Dictionary: JENIS_PERMOHONAN sumber="ERBA dan ERLA" 301="Permohonan Baru" (kode sama kedua sistem); KATEGORI_DOKUMEN sumber=ERBA 302="Menengah Tinggi" (tidak ada padanan ERLA). ENTITY: "terbit" → nomor, kolom `tanggal` (predikat §2).'
