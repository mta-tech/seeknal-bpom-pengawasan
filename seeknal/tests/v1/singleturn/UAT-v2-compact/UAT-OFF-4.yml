name: UAT_OFF_MR_Dibatalkan_Komitmen
scenario_id: UAT-OFF-4
verification_date: '2026-07-23'
description: 'UAT-OFF-4 — Produk MR (kategori_dokumen=303) dengan komitmen dibatalkan, s/d 2026. Sama kanoniknya dengan UAT-KOMITMEN-DIBATALKAN-1. TRANSIENT.'
turns:
- prompt: Berapa jumlah produk MR yang dibatalkan sampai dengan tahun 2026
  assert_contains:
  - 'Dibatalkan'
  assert_any_of:
  -
    - '5.667'
  tolerance_pct: 5
  note: 'SQL: SELECT COUNT(DISTINCT produk_id) FROM t_produk_3_erba WHERE kategori_dokumen=''303'' AND status_komitmen IS NOT NULL AND status_komitmen<>'''' AND ROUND(status_komitmen::numeric)::int=5. DB 23Jul2026 = 5.667 (exact ''5''=5.474 + ''5.0''=193). CASE B (predikat §5): tanpa filter status NIE — pembatalan komitmen umumnya terjadi SEBELUM NIE terbit, menumpuk filter NIE memangkas ~95%. FORMAT GANDA (predikat §6): normalisasi ROUND wajib. ENTITY: produk_id. MR = kategori_dokumen ''303'' (dictionary KATEGORI_DOKUMEN sumber=ERBA saja: 303="Menengah Rendah") — jawaban WAJIB mengeja "Menengah Rendah", bukan hanya "MR" atau "Medium Risk" (predikat §12-B). SCOPE ERBA-only: status_komitmen tidak ada di ERLA. TRANSIENT — nilai lama 26Jun=5.258, 17Jul=5.457.'
