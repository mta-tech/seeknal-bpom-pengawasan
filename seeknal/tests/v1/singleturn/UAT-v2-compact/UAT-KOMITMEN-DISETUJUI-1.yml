description: 'UAT-KOMITMEN-DISETUJUI-1 — single-scope by-design (ERBA-only). Kanonik "disetujui" = kode 4+7 gabungan, jawaban WAJIB menampilkan split berlabel.'
turns:
- prompt: berapa produk MR yang komitmennya sudah disetujui BPOM?
  assert_contains:
  - 'disetujui'
  - 'Menengah Rendah'
  assert_any_of:
  -
    - '15.346'
  -
    - '2.929'
    - '12.417'
  tolerance_pct: 5
  note: 'SQL gabungan: SELECT COUNT(DISTINCT produk_id) FROM t_produk_3_erba WHERE kategori_dokumen=''303'' AND status_komitmen IS NOT NULL AND status_komitmen<>'''' AND ROUND(status_komitmen::numeric)::int IN (4,7). SQL split: sama tapi GROUP BY ROUND(status_komitmen::numeric)::int. DB 23Jul2026: kode 4 (Komitmen Disetujui)=2.929 · kode 7 (Komitmen Disetujui Dengan Catatan)=12.417 · GABUNGAN=15.346. Dictionary STATUS_KOMITMEN sumber=ERBA: 4="Komitmen Disetujui" · 7="Komitmen Disetujui Dengan Catatan". KANONIK (filter_code §4 + predikat §12): "disetujui" mencakup KEDUA kode; headline boleh gabungan TAPI jawaban wajib menyertakan split berlabel per kode — jangan sajikan angka gabungan tanpa label. FORMAT GANDA (predikat §6): normalisasi ROUND wajib (''4''=2.846 + ''4.0''=83; ''7''=12.012 + ''7.0''=405). CASE B: tanpa filter status NIE. ENTITY: produk_id. Nilai lama 17Jul: 2.909/12.339/15.248.'
