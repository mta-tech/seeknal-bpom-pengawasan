name: UAT_OFF_AMDK_ERBA_2024_2025
scenario_id: UAT-OFF-2
verification_date: '2026-07-23'
description: 'UAT-OFF-2 — Persetujuan produk AMDK 2024-2025, ERBA saja (prompt: "Kita ambil data ereg RBA saja"). Entity produk_id karena subjeknya persetujuan/permohonan.'
turns:
- prompt: Kita ambil data ereg RBA saja. Tampilkan jumlah persetujuan produk AMDK pada tahun 2024 sampai 2025
  assert_contains:
  - 'AMDK'
  - '2024'
  - '2025'
  assert_any_of:
  -
    - '2.692'
    - '2.570'
  tolerance_pct: 5
  note: 'SQL (per tahun Y): SELECT COUNT(DISTINCT produk_id) FROM t_produk_3_erba WHERE jenis_pangan IN (''1401'',''1402'') AND jenis_permohonan IN (''301'',''303'',''305'') AND tanggal::timestamp>=''Y-01-01'' AND tanggal::timestamp<''Y+1-01-01'' AND status IN (''0999'',''0906'',''9999'') AND trader_id::bigint NOT IN (5,17,50,85). DB 23Jul2026: 2024=2.692 · 2025=2.570. ENTITY: "persetujuan produk" = permohonan yang disetujui → COUNT(DISTINCT produk_id) (filter_code §1) — beda dari pertanyaan NIE yang memakai nomor. JP: "persetujuan" mengecualikan Perubahan Mayor (302) → IN (301,303,305). SCOPE: prompt eksplisit "ereg RBA saja" = ERBA only; padanan ERLA (jenis_pangan 651/652/655) sengaja TIDAK dihitung — 2024=151, 2025=59 hanya sebagai catatan, di luar scope. AMDK kode BEDA antar sistem: ERBA 1401/1402 vs ERLA 651/652/655 (filter_code §5); JENIS_PANGAN tidak terdaftar di dictionary (§4d).'
