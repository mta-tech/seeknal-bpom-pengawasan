description: 'UAT-KOMITMEN-DISETUJUI-CATATAN-1 — single-scope by-design (ERBA-only). Kode 7 SAJA (bukan gabungan 4+7) karena prompt eksplisit "dengan catatan".'
turns:
- prompt: berapa produk MR yang komitmennya disetujui tapi dengan catatan?
  assert_contains:
  - 'catatan'
  - 'disetujui'
  assert_any_of:
  -
    - '12.417'
  tolerance_pct: 5
  note: 'SQL: SELECT COUNT(DISTINCT produk_id) FROM t_produk_3_erba WHERE kategori_dokumen=''303'' AND status_komitmen IS NOT NULL AND status_komitmen<>'''' AND ROUND(status_komitmen::numeric)::int=7. DB 23Jul2026 = 12.417 (exact ''7''=12.012 + ''7.0''=405). BEDA dari UAT-KOMITMEN-DISETUJUI-1: prompt di sini menyebut "dengan catatan" secara eksplisit → kode 7 SAJA, JANGAN digabung dengan kode 4; sebaliknya prompt "sudah disetujui" (tanpa kualifikasi) = gabungan 4+7. Dictionary STATUS_KOMITMEN sumber=ERBA kode 7="Komitmen Disetujui Dengan Catatan" — NIE-nya terbit tapi ada catatan perbaikan. FORMAT GANDA (predikat §6): normalisasi ROUND wajib. CASE B: tanpa filter status NIE. ENTITY: produk_id. SCOPE ERBA-only (kolom tidak ada di ERLA). Nilai lama 17Jul=12.339.'
