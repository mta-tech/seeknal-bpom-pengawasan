name: UAT_AMDK_3
scenario_id: UAT-AMDK-3
verification_date: '2026-07-23'
description: 'UAT-AMDK-3 — dua sistem (ereg RBA + ereg lama). ENTITY BEDA dari AMDK-1: "persetujuan produk" = permohonan disetujui → produk_id, bukan nomor.'
turns:
- prompt: Tampilkan jumlah persetujuan produk AMDK pada tahun 2024 sampai 2025 dari database ereg RBA dan ereg lama
  assert_contains:
  - 'AMDK'
  - '2024'
  - '2025'
  assert_any_of:
  -
    - '2.843'
    - '2.629'
  -
    - '2.692'
    - '2.570'
  tolerance_pct: 5
  note: 'SQL ERBA (per tahun Y): SELECT COUNT(DISTINCT produk_id) FROM t_produk_3_erba WHERE jenis_pangan IN (''1401'',''1402'') AND jenis_permohonan IN (''301'',''303'',''305'') AND tanggal::timestamp>=''Y-01-01'' AND tanggal::timestamp<''Y+1-01-01'' AND status IN (''0999'',''0906'',''9999'') AND trader_id::bigint NOT IN (5,17,50,85). SQL ERLA: idem pada t_produk_3_rilis_erla dgn jenis_pangan IN (''651'',''652'',''655''), jenis_permohonan IN (''301'',''303'',''304'',''305''), status IN (''0099'',''0999'',''0906'',''9999''), trader_id<>3384. DB 23Jul2026: ERBA 2024=2.692 · 2025=2.570; ERLA 2024=151 · 2025=59; GABUNGAN 2024=2.843 · 2025=2.629 (produk_id ber-namespace per sistem sehingga dijumlah aman). ENTITY (kunci kasus ini): "persetujuan produk" = permohonan yang disetujui → COUNT(DISTINCT produk_id) — beda dari UAT-AMDK-1 yang menanyakan NIE → nomor (predikat §1 / filter_code §1). JP: di sini filter JP SAH karena "persetujuan" mengecualikan perubahan mayor (302). Grup 1 = gabungan; grup 2 = komponen ERBA.'
