  note: 'DB 2026: Jan=8, Feb=6, Mar=7, Apr=5, Mei=2, Jun=1, Jul(berjalan)=1 — volume SANGAT kecil & menurun tajam, berpotensi CV tinggi. Assert longgar sengaja: bisa PROYEKSI (jika lolos eligibility >=10 titik & CV<=0.8) ATAU PENOLAKAN jujur (jika tidak lolos) — dua-duanya sah, yang TIDAK sah adalah mengarang angka tanpa dasar atau crash. Cek tool_trace utk tahu jalur mana yang diambil.'
