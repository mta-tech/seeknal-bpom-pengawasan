name: FC_Persetujuan_3Bulan
scenario_id: FC-BTP-4
description: 'Forecast natural — NIE disetujui/terbit (status issued), 3 bulan ke depan. Beda entitas dari "permohonan" (semua pengajuan) — series ini sudah lulus proses.'
turns:
- prompt: Proyeksi berapa NIE yang akan disetujui untuk 3 bulan ke depan
  assert_contains:
  - disetujui
  - Juli
  - Agustus
  - September
  note: 'DB Jun2026 NIE disetujui/issued (status 0999,0906,9999; entitas produk_id) = 5.836; Mei=5.365, Apr=4.850 — histori 47 bulan penuh, tren NAIK 3 bulan terakhir (beda arah dari total permohonan yang relatif stabil) — cek proyeksi menangkap tren naik ini, bukan disamakan dengan series "permohonan" biasa.'
