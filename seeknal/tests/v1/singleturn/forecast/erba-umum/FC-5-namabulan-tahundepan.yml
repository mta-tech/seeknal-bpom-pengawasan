name: FC_ERBA_NamaBulan_TahunDepan
scenario_id: FC-ERBA-5
description: 'Forecast natural — bulan disebut namanya langsung, bukan "N bulan ke depan". Menguji parsing nama bulan eksplisit ke periods yang benar.'
turns:
- prompt: Prediksi permohonan ERBA untuk Januari, Februari, Maret tahun depan
  assert_contains:
  - Januari
  - Februari
  - Maret
  note: '"Tahun depan" dari 2026 = 2027. Januari-Maret 2027 = 7-9 bulan dari Jun2026 (periods harus mencakup s/d Maret 2027, minimal periods=9). Assert tiga nama bulan eksplisit yang DIMINTA user harus muncul semua di jawaban — bukan cuma rentang umum.'
