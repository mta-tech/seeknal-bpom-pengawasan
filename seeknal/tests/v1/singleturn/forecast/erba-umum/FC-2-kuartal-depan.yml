name: FC_ERBA_KuartalDepan
scenario_id: FC-ERBA-2
description: 'Forecast natural — frasa "kuartal berikutnya" (3 bulan, bukan angka eksplisit). Series: NIE terbit ERBA.'
turns:
- prompt: Kira-kira berapa NIE yang akan terbit di kuartal berikutnya untuk sistem ERBA?
  assert_contains:
  - Juli
  - Agustus
  - September
  note: 'Kuartal berikutnya dari Jun2026 = Q3 2026 (Jul-Sep), periods=3. Assert TIGA nama bulan sekaligus — kalau sistem cuma kasih 1 angka gabungan tanpa rincian bulanan, ini akan gagal (persis pola bug C.6 "12 bulan tidak ada detail", diuji di sini utk horizon 3 bulan versi frasa non-numerik).'
