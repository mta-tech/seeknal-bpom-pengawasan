name: UAT_KOPI_INSTAN_ID_1
scenario_id: UAT-KOPI-INSTAN-ID-1
verification_date: '2026-08-05'
description: 'UAT-KOPI-INSTAN-ID-1 — Scope-agnostic (ERBA/ERLA/UNION valid via assert_any_of). SILANG DUA DIMENSI: segmen produk (nama_kategori) x negara asal (negara_pabrik) — kombinasi yang belum pernah diuji di compact I-VII, dan yang membuat sistem tersesat ke tren tahunan saat diuji manual 05Agu2026.'
turns:
- prompt: ada berapa produk kopi instan asal Indonesia yang punya izin edar di BPOM?
  assert_contains:
  - 'kopi instan'
  assert_any_of:
  -
    - '309'
  -
    - '112'
    - 'ERBA'
  -
    - '197'
    - 'ERLA'
  tolerance_pct: 5
  note: 'SQL ERBA: SELECT COUNT(DISTINCT nomor) FROM t_produk_3_erba WHERE nama_kategori=''Kopi Instan'' AND negara_pabrik=''ID'' AND status IN (''0999'',''0906'',''9999'') AND trader_id::bigint NOT IN (5,17,50,85) AND nomor<>''''. SQL ERLA: SELECT COUNT(DISTINCT nomor) FROM t_produk_3_rilis_erla WHERE nama_kategori=''Kopi Instan'' AND negara_pabrik=''ID'' AND status IN (''0099'',''0999'',''0906'',''9999'') AND trader_id<>3384 AND nomor<>''''. GABUNGAN = COUNT(DISTINCT nomor) atas UNION ALL. DB 05Agu2026: ERBA=112 · ERLA=197 · gabungan=309. NEGARA ASAL — KOLOMNYA negara_pabrik, BUKAN negara_produsen: negara_pabrik terisi 100% di kedua tabel (259.681 dan 412.643 baris, nol kosong), sedangkan negara_produsen hanya terisi 4.504 di ERBA dan 23.025 di ERLA — memakai negara_produsen membuang ~98% data dan menghasilkan angka jauh terlalu kecil. Isinya kode ISO 2-huruf; dictionary kategori "NEGARA_PABRIK dan NEGARA_PRODUSEN" sumber="ERLA dan ERBA" mencatat ID = "Indonesia" — kode SAMA di kedua sistem (baris ID muncul dua kali di dictionary, duplikat tak berbahaya, sama seperti CN di UAT-NEGARA-1). SEGMEN PRODUK — nama_kategori cocok PERSIS: nilai ''Kopi Instan'' ada apa adanya di kedua tabel (ERBA 161 baris all-time, ERLA 435), jadi tidak perlu ILIKE maupun penurunan dari kode. KODE PER SISTEM BEDA NAMESPACE: di ERBA ''Kopi Instan'' bersih 1:1 ke jenis_pangan=''1407'' + kategori_pangan=''140105000017''; di ERLA tersebar di jenis_pangan 687 (428 baris), 670 (6), 694 (1) — namespace jenis_pangan kedua sistem tidak beririsan (data_architecture "Coded segment columns do not share a namespace"), jadi kode ERBA TIDAK boleh dibawa ke ERLA. JENIS_PANGAN/KATEGORI_PANGAN tidak terdaftar di data_dictionary sama sekali (0 baris; filter_code §4d), sehingga nama_kategori adalah satu-satunya jalur yang berlaku di KEDUA sistem — pakai itu. ENTITY: "produk ... punya izin edar" = NIE → COUNT(DISTINCT nomor) (predikat §1). Pembanding produk_id = 116/341/457 — di sisi ERLA selisihnya 1,7x (197 vs 341) karena satu NIE bisa punya banyak pengajuan/revisi; memakai produk_id akan meng-inflate. PEMBANDING LINGKUP: tanpa filter negara, kopi instan seluruh dunia = 357 NIE — jadi 309 dari 357 (87%) memang asal Indonesia, dan selisih 48 itulah porsi impornya; sebutkan bahwa angka sudah disaring ke Indonesia agar pengguna tidak mengira ini total global. KELUARGA KOPI LAIN JANGAN DICAMPUR: ''Kopi Bubuk'' (ERBA 2.103 · ERLA 4.008), ''Minuman Serbuk Kopi'', ''Biji Kopi'', ''Kopi Celup'' adalah kategori terpisah — pertanyaan menyebut "kopi instan" spesifik, jadi jangan dilebarkan ke ILIKE ''%kopi%'' yang akan melipatgandakan hasil.'
