name: UAT_RED_WINE_ASAL_1
scenario_id: UAT-RED-WINE-ASAL-1
verification_date: '2026-08-05'
description: 'UAT-RED-WINE-ASAL-1 — ERBA-ONLY? TIDAK: ini kebalikannya, segmen ERLA-ONLY struktural. Anggur merah nol baris di t_produk_3_erba, seluruh 3.650 NIE ada di ERLA — jadi lingkup "gabungan" secara teknis benar tetapi menyesatkan bila tidak dinyatakan. Sekaligus menguji dimensi negara asal pada segmen yang 98% impor, kebalikan dari UAT-KOPI-INSTAN-ID-1 yang 87% domestik.'
turns:
- prompt: anggur merah atau red wine yang punya izin edar BPOM itu kebanyakan dari negara mana?
  assert_contains:
  - 'Prancis'
  assert_any_of:
  -
    - '985'
  -
    - '663'
    - 'Australia'
  -
    - '3.650'
    - 'ERLA'
  tolerance_pct: 5
  note: 'SQL ERLA: SELECT negara_pabrik, COUNT(DISTINCT nomor) FROM t_produk_3_rilis_erla WHERE nama_kategori=''Still Grape Wine Merah / Anggur Merah (Red Wine)'' AND status IN (''0099'',''0999'',''0906'',''9999'') AND trader_id<>3384 AND nomor<>'''' GROUP BY 1 ORDER BY 2 DESC. SQL ERBA: query setara memberi NOL baris. DB 05Agu2026 — peringkat negara: FR=985 · AU=663 · IT=517 · CL=440 · US=284 · ES=216; total seluruh negara=3.650; Indonesia (ID)=59 saja. Pecahan sistem: ERBA=0 · ERLA=3.650 · gabungan=3.650. SEGMEN INI ERLA-ONLY SECARA STRUKTURAL — WAJIB DINYATAKAN: t_produk_3_erba tidak punya satu pun baris untuk kategori ini, jadi menjalankan UNION tetap memberi angka benar tetapi jawaban yang menyebut "gabungan ERBA dan ERLA" tanpa keterangan akan membuat pengguna mengira kedua sistem menyumbang. Sebutkan bahwa seluruh data berasal dari ERLA. Ini kebalikan dari kasus komitmen/risiko yang ERBA-only; buktikan lingkup dari data, jangan mengasumsikan gabungan selalu tepat. NAMA KATEGORI PANJANG DAN HARUS PERSIS: nilainya ''Still Grape Wine Merah / Anggur Merah (Red Wine)'' — mengandung spasi, garis miring, dan kurung. Pencarian ILIKE ''%anggur%'' akan menjaring pula kategori anggur lain (putih, sparkling, anggur buah non-alkohol) dan menggelembungkan hasil; pakai kecocokan persis atau verifikasi daftar kategori dulu dengan GROUP BY nama_kategori. KODE NEGARA ISO 2-HURUF dari dictionary kategori "NEGARA_PABRIK dan NEGARA_PRODUSEN" sumber="ERLA dan ERBA": FR=Prancis · AU=Australia · IT=Italia · CL=Chili · US=Amerika Serikat · ES=Spanyol. Jawaban harus menuliskan NAMA negara, bukan kode mentah — pengguna tidak membaca ISO. Kolomnya negara_pabrik (terisi 100%), BUKAN negara_produsen (terisi 1-6%). KONTRAS YANG LAYAK DISEBUT: hanya 59 dari 3.650 NIE (1,6%) berasal dari pabrik di Indonesia — segmen ini praktis seluruhnya impor, berlawanan dengan AMDK dan minyak goreng sawit yang hampir 100% domestik. Menyebut kontras ini menjawab "kebanyakan dari negara mana" secara bermakna, bukan sekadar mendaftar angka. ENTITY: COUNT(DISTINCT nomor) (predikat §1). BENTUK JAWABAN: pertanyaan meminta peringkat, jadi sajikan tabel negara x jumlah NIE terurut menurun, bukan satu angka.'
