name: UAT_MI_INSTAN_BERLAKU_1
scenario_id: UAT-MI-INSTAN-BERLAKU-1
verification_date: '2026-08-05'
description: 'UAT-MI-INSTAN-BERLAKU-1 — Scope-agnostic (ERBA/ERLA/UNION valid via assert_any_of). Menguji ambiguitas DUA TIER "masih berlaku" (predikat §3 vs filter_code §4c) pada satu segmen produk. Di segmen ini jaraknya paling ekstrem yang ditemukan: 60% NIE berstatus aktif ternyata sudah lewat tanggal kedaluwarsa, sehingga dua tafsir yang sama-sama sah memberi 2.446 vs 991.'
turns:
- prompt: izin edar mi instan di BPOM masih berlaku semua atau ada yang sudah lewat masa berlakunya?
  assert_contains:
  - 'mi instan'
  assert_any_of:
  -
    - '2.446'
    - '991'
  -
    - '457'
    - 'ERBA'
  -
    - '1.989'
    - 'ERLA'
  tolerance_pct: 5
  note: 'SQL TIER-1 (status aktif saja) ERBA: SELECT COUNT(DISTINCT nomor) FROM t_produk_3_erba WHERE nama_kategori=''Mi Instan'' AND status=''0999'' AND trader_id::bigint NOT IN (5,17,50,85) AND nomor<>''''. ERLA: idem pada t_produk_3_rilis_erla dgn trader_id<>3384. SQL TIER-2 (aktif DAN belum kedaluwarsa) menambah: ERBA AND (NULLIF(tanggal_exp,'''')::timestamp IS NULL OR NULLIF(tanggal_exp,'''')::timestamp>now()); ERLA AND (tanggal_exp IS NULL OR tanggal_exp>now()). DB 05Agu2026 — TIER-1: ERBA=457 · ERLA=1.989 · gabungan=2.446. TIER-2: ERBA=457 · ERLA=534 · gabungan=991. Dicabut (0009/0000) = 73. DUA TAFSIR SAMA-SAH — INI INTI SKENARIO: predikat §3 menetapkan tier AKTIF = status ''0999'' saja; filter_code §4c menetapkan "masih berlaku" = status sah AND (tanggal_exp>hari ini ATAU tanggal_exp kosong). Prompt sengaja menanyakan KEDUANYA sekaligus ("masih berlaku semua atau ada yang sudah lewat"), jadi jawaban yang benar WAJIB menyebut dua angka berlabel — 2.446 berstatus aktif, dari situ hanya 991 yang belum kedaluwarsa — bukan memilih salah satu diam-diam. Menjawab satu angka saja tanpa label adalah kegagalan, meskipun angkanya termasuk salah satu tier. SELISIHNYA EKSTREM DAN TERKONSENTRASI DI ERLA: 1.470 NIE berstatus ''0999'' tetapi tanggal_exp-nya sudah lewat — seluruhnya di ERLA (1.989 aktif, hanya 534 belum kedaluwarsa), sementara ERBA bersih (457 aktif, 457 belum kedaluwarsa). Sebabnya ERLA menyimpan riwayat 14 tahun sehingga banyak NIE lama tidak pernah diperbarui statusnya; ERBA baru berjalan sejak akhir 2022 sehingga belum ada yang jatuh tempo. Jawaban yang tidak memecah per sistem akan menyembunyikan bahwa persoalan ini khas sistem lama. STATUS DAN MASA BERLAKU DUA DIMENSI TERPISAH (predikat, "JANGAN SAMAKAN DENGAN KEDALUWARSA"): status ''0099'' = Tidak Berlaku adalah penanda status, BUKAN hasil perhitungan tanggal — jangan mencampur 0099 ke dalam hitungan kedaluwarsa berbasis tanggal_exp, dan jangan menyimpulkan sebuah NIE dicabut hanya karena tanggal_exp-nya lewat. TIPE KOLOM BEDA: tanggal_exp bertipe TEXT di ERBA (wajib NULLIF(...)::timestamp) tetapi timestamp asli di ERLA (tidak boleh di-cast dengan pola yang sama) — lihat tabel asimetri tipe di data_architecture. ENTITY: COUNT(DISTINCT nomor) (predikat §1); pertanyaan tentang izin edar, bukan pengajuan.'
