name: UAT_KOPI_INSTAN_PENDAFTAR_1
scenario_id: UAT-KOPI-INSTAN-PENDAFTAR-1
verification_date: '2026-08-05'
description: 'UAT-KOPI-INSTAN-PENDAFTAR-1 — Scope-agnostic (ERBA/ERLA/UNION valid via assert_any_of). Menguji dimensi PENDAFTAR yang belum pernah disilangkan dengan segmen produk di compact I-VII. Perangkapnya struktural: perusahaan yang sama punya trader_id BERBEDA dan format nama BERBEDA di tiap sistem, sehingga penggabungan lintas sistem tidak boleh memakai trader_id.'
turns:
- prompt: siapa saja perusahaan yang mendaftarkan kopi instan asal Indonesia, dan berapa izin edar masing-masing?
  assert_contains:
  - 'Crown Pratama'
  assert_any_of:
  -
    - '125'
  -
    - '58'
    - 'ERBA'
  -
    - '67'
    - 'ERLA'
  tolerance_pct: 5
  note: 'SQL ERBA: SELECT nama_trader, COUNT(DISTINCT nomor) FROM t_produk_3_erba WHERE nama_kategori=''Kopi Instan'' AND negara_pabrik=''ID'' AND status IN (''0999'',''0906'',''9999'') AND trader_id::bigint NOT IN (5,17,50,85) AND nomor<>'''' GROUP BY 1 ORDER BY 2 DESC. SQL ERLA: idem pada t_produk_3_rilis_erla dgn status IN (''0099'',''0999'',''0906'',''9999'') AND trader_id<>3384. SQL GABUNGAN: GROUP BY atas UNION ALL dengan NAMA DINORMALISASI — regexp_replace(upper(btrim(nama_trader)), ''^PT\.?\s+'', '''') — lalu COUNT(DISTINCT nomor). DB 05Agu2026 gabungan: CROWN PRATAMA=125 · SARI INCOFOOD CORPORATION=66 · SAMUDRA MONTAZ=59 · NESTLE INDONESIA=19 · INDRACO GLOBAL INDONESIA=13 · ANEKA COFFEE INDUSTRY=8. Pecahan per sistem untuk yang terbesar: Crown Pratama ERBA=58 (trader_id 12208, nama_trader ''CROWN PRATAMA'') + ERLA=67 (trader_id 1647, nama_trader ''PT. Crown Pratama''). TRADER_ID TIDAK BERLAKU LINTAS SISTEM — ini kesalahan yang paling mudah terjadi: perusahaan yang sama memakai id yang sama sekali berbeda di tiap sistem (Crown Pratama 12208 vs 1647 · Samudra Montaz 12345 vs 1789 · Sari Incofood 13411 vs 617). Menggabungkan atau menghitung perusahaan dengan COUNT(DISTINCT trader_id) atas UNION akan menghitung setiap perusahaan DUA KALI. FORMAT NAMA JUGA BEDA: ERBA menyimpan tanpa prefiks dan kapital penuh (''CROWN PRATAMA''), ERLA memakai prefiks badan hukum dan kapitalisasi campur (''PT. Crown Pratama'') — penggabungan wajib menormalisasi prefiks PT/PT. dan huruf besar-kecil dulu. Tanpa normalisasi, Crown Pratama tampil sebagai dua entri terpisah (58 dan 67) dan urutan peringkat jadi salah: Sari Incofood ERLA (47) akan terlihat mengungguli Crown Pratama ERBA (58 vs 47 terpisah) padahal setelah digabung Crown Pratama (125) jauh di atas Sari Incofood (66). ENTITY: yang dihitung per pendaftar adalah NIE → COUNT(DISTINCT nomor) (predikat §1), bukan produk_id. BENTUK JAWABAN: pertanyaan meminta daftar beserta angkanya, jadi sajikan sebagai tabel pendaftar x jumlah NIE terurut menurun, bukan satu angka total. Sebutkan bahwa nama sudah dinormalisasi lintas sistem agar pengguna paham kenapa angka gabungan tidak sama dengan penjumlahan naif dari daftar mentah tiap sistem. LINGKUP: filter negara_pabrik=''ID'' dan nama_kategori=''Kopi Instan'' persis sama dengan UAT-KOPI-INSTAN-ID-1 (total 309 NIE) — jumlah seluruh baris daftar ini harus konsisten dengan angka itu.'
