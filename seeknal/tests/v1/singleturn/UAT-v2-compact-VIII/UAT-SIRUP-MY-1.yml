name: UAT_SIRUP_MY_1
scenario_id: UAT-SIRUP-MY-1
verification_date: '2026-08-05'
description: 'UAT-SIRUP-MY-1 — Scope-agnostic (ERBA/ERLA/UNION valid via assert_any_of). Silang segmen produk x negara asal untuk produk IMPOR. Kasus batas definisi paling tajam di batch ini: kategori tetangga ''Sirup Encer Berperisa'' justru LEBIH BESAR dari kategori yang diminta, jadi pelebaran filter membalik urutan besaran.'
turns:
- prompt: kalau sirup berperisa buatan Malaysia, berapa NIE-nya di BPOM?
  assert_contains:
  - 'sirup berperisa'
  - 'Malaysia'
  assert_any_of:
  -
    - '142'
  -
    - '18'
    - 'ERBA'
  -
    - '124'
    - 'ERLA'
  tolerance_pct: 5
  note: 'SQL ERBA: SELECT COUNT(DISTINCT nomor) FROM t_produk_3_erba WHERE nama_kategori=''Sirup Berperisa'' AND negara_pabrik=''MY'' AND status IN (''0999'',''0906'',''9999'') AND trader_id::bigint NOT IN (5,17,50,85) AND nomor<>''''. SQL ERLA: SELECT COUNT(DISTINCT nomor) FROM t_produk_3_rilis_erla WHERE nama_kategori=''Sirup Berperisa'' AND negara_pabrik=''MY'' AND status IN (''0099'',''0999'',''0906'',''9999'') AND trader_id<>3384 AND nomor<>''''. GABUNGAN = COUNT(DISTINCT nomor) atas UNION ALL. DB 05Agu2026: ERBA=18 · ERLA=124 · gabungan=142. TIMPANG ANTAR SISTEM — WAJIB DIPECAH: ERLA menyumbang 124 dari 142 (87%), ERBA hanya 18. Ini wajar untuk produk impor karena ERLA menampung riwayat pendaftaran lama sementara ERBA baru berjalan sejak akhir 2022; jawaban yang hanya menyebut angka gabungan menyembunyikan bahwa hampir seluruhnya berasal dari sistem lama. NEGARA ASAL: negara_pabrik=''MY'', dictionary "NEGARA_PABRIK dan NEGARA_PRODUSEN" sumber="ERLA dan ERBA" mencatat MY = "Malaysia" (baris muncul dua kali, duplikat tak berbahaya). JANGAN pakai negara_produsen — terisi hanya 1-6% (lihat UAT-KOPI-INSTAN-ID-1). BATAS DEFINISI — INI JEBAKAN UTAMANYA: di Malaysia, kategori tetangga ''Sirup Encer Berperisa'' berisi 203 NIE, LEBIH BANYAK daripada ''Sirup Berperisa'' (142) yang diminta. Melebarkan filter ke nama_kategori ILIKE ''%sirup%berperisa%'' menghasilkan 345 dan membuat kategori pendamping mendominasi jawaban; ILIKE ''%sirup%'' menambah lagi ''Sirup Buah'' (8), ''Sirup Agave'' (2), ''Sirup Maltosa'' (1) menjadi 356. Prompt menyebut "sirup berperisa" persis seperti nama kategorinya, jadi pakai kecocokan PERSIS. Bila jawaban ingin menyebut angka yang lebih luas, sajikan berlabel terpisah — jangan menggantikan angka utama. KODE PER SISTEM BEDA NAMESPACE: ERBA ''Sirup Berperisa'' tersebar di jenis_pangan 1422 (684 baris), 1416 (66), 1417 (2) tetapi seluruhnya berbagi kategori_pangan=''140104030006''; ERLA memakai jenis_pangan 672 (2.424), 675 (9), 520 (5). Tidak ada kode yang berlaku lintas sistem, dan JENIS_PANGAN/KATEGORI_PANGAN tidak terdaftar di data_dictionary (filter_code §4d) — nama_kategori satu-satunya jalur bersama. ENTITY: COUNT(DISTINCT nomor) (predikat §1). Pembanding produk_id = 32/326/358; di ERLA selisihnya 2,6x (124 vs 326) — segmen impor punya riwayat revisi panjang, jadi produk_id akan menggelembungkan jawaban lebih parah daripada segmen domestik.'
