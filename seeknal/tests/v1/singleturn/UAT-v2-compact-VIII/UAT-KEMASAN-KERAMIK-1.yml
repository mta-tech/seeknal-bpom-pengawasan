name: UAT_KEMASAN_KERAMIK_1
scenario_id: UAT-KEMASAN-KERAMIK-1
verification_date: '2026-08-05'
description: 'UAT-KEMASAN-KERAMIK-1 — ERBA-ONLY struktural (kolom sub_kemasan_id tidak ada di t_produk_3_rilis_erla). Menguji kolom sub_kemasan_id yang belum pernah disentuh 105 test compact I-VII, dan sekaligus MENJAWAB pertanyaan terbuka audit 29Jul2026 §6 (UAT-KEMASAN-KACA-1): kemasan_id=1 menggabung "Kaca atau Keramik", dan selama ini tidak diketahui seberapa besar porsi keramiknya.'
turns:
- prompt: produk yang kemasannya keramik ada berapa, yang benar-benar keramik bukan kaca?
  assert_contains:
  - 'keramik'
  assert_any_of:
  -
    - '50'
  -
    - '14.515'
    - 'kaca'
  -
    - '14.603'
    - 'ERBA'
  tolerance_pct: 5
  note: 'SQL ERBA: SELECT COUNT(DISTINCT nomor) FROM t_produk_3_erba WHERE sub_kemasan_id=''102'' AND status IN (''0999'',''0906'',''9999'') AND trader_id::bigint NOT IN (5,17,50,85) AND nomor<>''''. SQL ERLA: TIDAK ADA — kolom sub_kemasan_id tidak eksis di t_produk_3_rilis_erla (dicek di information_schema, 0 kolom), jadi pertanyaan ini ERBA-only secara struktural, bukan pilihan lingkup. DB 05Agu2026: Keramik (sub_kemasan_id=''102'')=50 · Kaca (''101'')=14.515 · induk kemasan_id=''1'' (Kaca ATAU Keramik)=14.603. Dictionary SUB_KEMASAN_ID sumber=ERBA: 101="Kaca", 102="Keramik", 201="PET", 202="HDPE", 203="PVC", 204="LDPE,LLDPE,HDPE,PE", 401="Plastik/Aluminium Foil", 406="Plastik/Plastik (Multilayer, Plastik Laminat)", 407="Campuran 2 atau lebih jenis kemasan lainnya" — 37 kode terdaftar. INI MENJAWAB PERTANYAAN TERBUKA AUDIT 29Jul2026 §6: UAT-KEMASAN-KACA-1 mencatat bahwa deskripsi ERBA ("Kaca atau Keramik") lebih lebar daripada ERLA ("Kaca") dan menggantungkan pertanyaan apakah keramik ERLA tersembunyi di kode 39 "Lain-Lain". Datanya sekarang menjawab: dari 14.603 NIE berkemasan_id=1 di ERBA, hanya 50 (0,3%) yang benar-benar keramik. Jadi melebarkan definisi ERLA ke kode 39 demi "menangkap keramik" tidak berdasar — porsi keramik terlalu kecil untuk membenarkan pembengkakan 34 ribu ke 47 ribu yang tercatat di audit itu. KEDALAMAN KODE BERTINGKAT: kemasan_id adalah kode INDUK (16 kode di dictionary), sub_kemasan_id kode ANAK (37 kode). Pertanyaan yang menyebut material spesifik (keramik, PET, HDPE) harus turun ke sub_kemasan_id; pertanyaan material umum (kaca, plastik) boleh berhenti di kemasan_id. Menjawab pertanyaan keramik dengan kemasan_id=''1'' akan memberi 14.603 — meleset 292 kali lipat karena mayoritasnya kaca. JUMLAH ANAK TIDAK PERSIS SAMA DENGAN INDUK: 14.515+50=14.565, sedangkan induk 14.603 — selisih 38 NIE punya kemasan_id=''1'' tetapi sub_kemasan_id kosong atau bernilai lain (mis. ''701''). Sebutkan bila menyajikan kedua angka bersamaan, jangan dipaksa cocok. ENTITY: COUNT(DISTINCT nomor) (predikat §1). BENTUK JAWABAN: angka utamanya 50; sajikan 14.515 kaca sebagai pembanding agar pengguna paham keramik adalah minoritas ekstrem, dan nyatakan bahwa data hanya tersedia di ERBA.'
