name: UAT_SERBUK_DICABUT_1
scenario_id: UAT-SERBUK-DICABUT-1
verification_date: '2026-08-05'
description: 'UAT-SERBUK-DICABUT-1 — ERLA-only secara empiris (ERBA nol baris untuk kategori ini). Menguji dimensi PENCABUTAN pada satu segmen produk: minuman serbuk berperisa adalah segmen dengan pencabutan terbanyak di seluruh basis data (376 NIE), jadi jawaban "tidak ada yang dicabut" jelas salah dan mudah terdeteksi.'
turns:
- prompt: minuman serbuk berperisa ada yang izin edarnya dicabut atau dibatalkan BPOM?
  assert_contains:
  - 'dicabut'
  assert_any_of:
  -
    - '376'
  -
    - '4.822'
    - 'ERLA'
  -
    - '0009'
  tolerance_pct: 5
  note: 'SQL ERLA: SELECT COUNT(DISTINCT nomor) FROM t_produk_3_rilis_erla WHERE nama_kategori=''Minuman Serbuk Berperisa (Tidak Berkarbonat)'' AND status IN (''0009'',''0000'') AND trader_id<>3384 AND nomor<>''''. SQL ERBA: query setara memberi NOL baris (kategori ini tidak ada di t_produk_3_erba). DB 05Agu2026: dicabut=376 (seluruhnya kode ''0009''; kode ''0000''=0) · NIE berstatus sah di segmen yang sama=4.822 · ERBA=0. Jadi rasio pencabutan ≈ 376 dari 5.198 NIE yang pernah tercatat (7,2%) — tertinggi di antara seluruh segmen besar; pembanding: Kukis 73, Mi Instan 73, Bumbu Siap Pakai 121, AMDK 18, Red Wine 1. KODE PENCABUTAN (filter_code, kategori STATUS): ''0009'' = dicabut/dibatalkan · ''0000'' = dihapus. Keduanya kelas TERMINASI dan boleh dijumlahkan untuk pertanyaan "dicabut atau dibatalkan". JANGAN memasukkan ''0099'' (Tidak Berlaku / kedaluwarsa) — itu dimensi masa berlaku, bukan pencabutan; predikat menegaskan status dan masa berlaku adalah dua dimensi terpisah, dan mencampurnya adalah kesalahan yang berulang di suite ini (lihat UAT-LC-TERMINASI-1 yang gagal karena melebarkan ke 0099). Juga jangan memasukkan ''9999'' (Sudah Diubah) — itu berarti izin digantikan versi lebih baru, bukan dicabut. BENTUK PERTANYAAN "ADA ATAU TIDAK": prompt berbentuk ya/tidak, tetapi jawaban yang hanya berkata "ada" tanpa angka tidak berguna — sebutkan jumlahnya (376) dan beri konteks proporsinya terhadap segmen (dari 5.198 NIE tercatat). Bila memungkinkan sebutkan bahwa segmen ini yang pencabutannya terbanyak, karena itulah informasi yang dicari pengguna di balik pertanyaan ya/tidak. LINGKUP ERLA-ONLY: kategori ini nol di ERBA, jadi jangan menyebut "gabungan kedua sistem" tanpa keterangan — nyatakan seluruh data berasal dari ERLA. Buktikan lingkup dari data, jangan mengasumsikan. NAMA KATEGORI HARUS PERSIS: ''Minuman Serbuk Berperisa (Tidak Berkarbonat)'' termasuk kurung dan keterangan karbonasi; ILIKE ''%serbuk%'' akan menjaring Minuman Serbuk Kopi, Susu Bubuk, dan puluhan kategori serbuk lain. ENTITY: COUNT(DISTINCT nomor) (predikat §1) — satu NIE yang dicabut bisa punya banyak produk_id dari riwayat revisinya.'
