name: FORECAST_Maret_Flag_Hadir
scenario_id: FORECAST-12
description: >
  FORECAST-12 — Ketika target mencakup bulan Maret, sistem harus menampilkan flag ⚠
  tentang variasi Maret yang lebih tinggi secara historis (March Effect).
  Ini memvalidasi bahwa known systematic bias dikomunikasikan ke user.
turns:
- prompt: Prediksi permohonan ERBA untuk Januari, Februari, Maret tahun depan
  assert_contains:
  - Maret
  - Kondisi Data
  - Rentang Realistis
  - Apa Artinya
  assert_not_contains:
  - sigma
  - ADF
  note: >
    FORECAST-12 — March Effect flag test. Target mencakup Maret → sistem harus menampilkan
    catatan di Kondisi Data (⚠ Maret menunjukkan variasi lebih tinggi secara historis)
    atau di blok Apa Artinya (• Maret secara historis lebih sulit diprediksi).
    Flag tidak harus berupa kata "March Effect" — cukup ada kalimat yang menginformasikan
    bahwa Maret memiliki karakteristik variasi lebih tinggi.
    Proyeksi tetap ditampilkan (tidak di-halt hanya karena Maret).
