name: FORECAST_ERLA_Refusal_ERBA_Offered
scenario_id: FORECAST-4
description: >
  FORECAST-4 — Proyeksi ERLA harus ditolak. ERLA non-stationary (ADF p=0.94).
  Sistem harus menjelaskan alasan dan menawarkan ERBA sebagai alternatif.
  Test ini memvalidasi eligibility check untuk sistem non-stationary.
turns:
- prompt: prediksi permohonan ERLA untuk 3 bulan ke depan
  assert_contains:
  - ERLA
  - ERBA
  assert_not_contains:
  - Proyeksi Detail
  - Rentang Realistis
  note: >
    FORECAST-4 — ERLA refusal test. Sistem harus menyebutkan ERLA tidak dapat diproyeksikan
    (non-stationary / pola data tidak stabil untuk proyeksi ke depan).
    Sistem harus menawarkan ERBA sebagai alternatif forecasting.
    Sistem TIDAK boleh menampilkan tabel Proyeksi Detail atau Rentang Realistis untuk ERLA.
    Bisa menampilkan tren historis ERLA sebagai informasi konteks.
