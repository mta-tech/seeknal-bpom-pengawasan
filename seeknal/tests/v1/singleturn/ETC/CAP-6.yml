name: Count_Breakdown_Per_Tahun
scenario_id: CAP-6
description: "New capability: pertanyaan 'berapa NIE' harus tampilkan breakdown per tahun + total di akhir. DB verified 2026-06-12: data lengkap 2012-2026."
turns:
- prompt: Berapa total NIE pangan olahan dari semua sistem registrasi?
