name: FORECAST_Konsistensi_Angka_Sama_Dua_Sesi
scenario_id: FORECAST-10
description: >
  FORECAST-10 — Pertanyaan yang sama harus menghasilkan angka perkiraan yang identik di sesi berbeda.
  Ini adalah determinism test — jika data DB tidak berubah, angka tidak boleh berubah.
  Run test ini 2x di sesi berbeda dan bandingkan angka di Proyeksi Detail.
turns:
- prompt: Berapa proyeksi permohonan ERBA bulan depan saja?
  assert_contains:
  - Proyeksi Detail
  - Perkiraan
  - Rentang Realistis
  - Tinggi
  - Metodologi
  assert_not_contains:
  - sigma
  - p10
  - p90
  note: >
    FORECAST-10 — Determinism test. H=1 saja (bulan depan). Angka "Perkiraan" di Proyeksi Detail
    harus identik di run pertama dan run kedua (asumsi tidak ada data baru masuk ke DB).
    Angka Rentang Realistis juga harus identik.
    Jika berbeda: bug di pipeline (LLM arithmetic, bukan SQL) atau data berubah.
    Cara verifikasi: catat angka dari run pertama, tanya pertanyaan yang sama di sesi baru,
    bandingkan. Angka yang sama = sistem deterministik dan benar.
