name: FORECAST_UnifiedTimeline_Historis_Lanjut_Proyeksi
scenario_id: FORECAST-6
description: >
  FORECAST-6 — Historis dan proyeksi harus disajikan dalam satu timeline terintegrasi,
  bukan dua blok terpisah. User harus bisa membaca alur: masa lalu → separator → masa depan.
  Test ini memvalidasi prinsip "one story, not two tables".
turns:
- prompt: Bagaimana perkembangan permohonan ERBA dalam 4 bulan terakhir dan proyeksinya 3 bulan ke depan?
  assert_contains:
  - Historis & Proyeksi
  - sekarang
  - Proyeksi Detail
  - Rentang Realistis
  - Apa Artinya
  assert_not_contains:
  - sigma
  - ADF
  note: >
    FORECAST-6 — Unified timeline test. Blok "Historis & Proyeksi" harus ada dalam satu view
    yang menampilkan bulan historis (minimal 4 bulan terakhir) lalu separator (seperti "── sekarang")
    lalu bulan proyeksi. Separator atau kata "sekarang" harus muncul untuk menandai batas.
    Setelah timeline ada summary stats historis (rata-rata, tertinggi, terendah).
    Kemudian Proyeksi Detail table terpisah dengan Rentang Realistis.
    Apa Artinya harus memuat perbandingan arah (meningkat/menurun/stabil).
