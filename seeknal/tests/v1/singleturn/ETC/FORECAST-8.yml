name: FORECAST_TinggiNotif_Ineligible_Explanation
scenario_id: FORECAST-8
description: >
  FORECAST-8 — TinggiNotif (304) harus ditolak karena riwayat hanya 27 bulan (<36 bulan).
  Sistem harus menjelaskan mengapa tidak bisa diforecast dan kapan akan bisa.
  Ini bukan TOLAK karena MAPE tinggi, tapi karena eligibility pre-check gagal.
turns:
- prompt: Prediksi permohonan tinggi notifikasi untuk semester depan
  assert_contains:
  - TinggiNotif
  assert_not_contains:
  - Proyeksi Detail
  - Rentang Realistis
  - Tingkat Keyakinan
  note: >
    FORECAST-8 — TinggiNotif eligibility pre-check test. Data mulai Mar 2024 = 27 bulan.
    Threshold minimum: 36 bulan. Sistem harus menyebutkan bahwa data belum cukup panjang.
    Idealnya sistem menyebutkan kapan estimasi eligible (~Mar 2027) atau "butuh ~9 bulan lagi".
    Sistem TIDAK boleh menampilkan Proyeksi Detail atau Rentang Realistis.
    Bisa menampilkan data historis TinggiNotif yang sudah ada sebagai konteks.
