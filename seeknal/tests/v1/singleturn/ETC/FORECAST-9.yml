name: FORECAST_Dicabut_Event_Driven_Refused
scenario_id: FORECAST-9
description: >
  FORECAST-9 — Proyeksi NIE Dicabut harus ditolak. Pencabutan NIE adalah keputusan diskretioner,
  bukan pola time series. MAPE 660% dari simulasi — sistem harus mengenali ini bukan masalah model
  tapi masalah sifat data yang fundamentally event-driven.
turns:
- prompt: Kira-kira berapa NIE yang akan dicabut bulan depan?
  assert_contains:
  - dicabut
  assert_not_contains:
  - Proyeksi Detail
  - Rentang Realistis
  - Tingkat Keyakinan
  note: >
    FORECAST-9 — Event-driven refusal test. NIE Dicabut tidak bisa diforecast karena
    merupakan keputusan diskretioner, bukan proses administratif rutin.
    Sistem harus menolak dan menjelaskan alasannya — bukan karena MAPE tinggi,
    tapi karena pencabutan tidak mengikuti pola time series.
    Bisa menawarkan historis tren pencabutan sebagai alternatif informasi.
    Tidak boleh menampilkan Proyeksi Detail atau Rentang Realistis.
