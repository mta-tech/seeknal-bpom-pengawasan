name: FORECAST_Permohonan_3Bulan_Output_Structure
scenario_id: FORECAST-1
description: >
  FORECAST-1 — Prediksi permohonan ERBA 3 bulan ke depan.
  Test utama: struktur 7-blok output harus hadir lengkap dengan kosakata wajib.
  Data aktual masa depan tidak diketahui — assertion pada struktur dan parameter, bukan angka.
turns:
- prompt: Prediksi permohonan pangan olahan untuk 3 bulan ke depan
  assert_contains:
  - Ringkasan
  - Rata-rata 3 bulan terakhir
  - Rata-rata 3 bulan ke depan
  - Kualitas Proyeksi
  - Kondisi Data
  - Historis & Proyeksi
  - Proyeksi Detail
  - Rentang Realistis
  - Tingkat Keyakinan
  - Tinggi
  - Apa Artinya
  - Metodologi
  - Seasonal Naive
  - Moving Average
  assert_not_contains:
  - sigma
  - p10
  - p90
  - ADF
  - ACF
  - Lower 95%
  - Upper 95%
  - Forecast
  - Interpretasi
  note: >
    FORECAST-1 — Permohonan ERBA total, 3 bulan ke depan. Test 7-blok output structure.
    Harus ada: Ringkasan perbandingan, Kondisi Data checklist, Historis & Proyeksi unified timeline,
    Proyeksi Detail table dengan Rentang Realistis, Apa Artinya bullets, Metodologi footer.
    Tidak boleh ada: sigma/p10/p90/ADF/ACF, kata "Forecast" atau "Interpretasi".
    H1=Tinggi wajib ada sebagai Tingkat Keyakinan.
