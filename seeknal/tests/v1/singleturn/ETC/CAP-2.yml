name: Category_Ranking_Kategori_Pangan
scenario_id: CAP-2
description: "New capability: top 10 kategori pangan harus pakai kategori_pangan (bukan nama_kategori yang 60% kosong). DB verified 2026-06-12: KP14=39.410, KP07=16.258, ..."
turns:
- prompt: Top 10 kategori pangan berdasarkan jumlah izin edar
  assert_contains:
  - '1'
  - '10'
  - kategori
  note: 'CAP-2 — Harus ranking pakai kategori_pangan (AKRONIM), bukan nama_kategori. Tanpa Kategori TIDAK boleh dominan.'
  assert_not_contains:
  - Tanpa Kategori
