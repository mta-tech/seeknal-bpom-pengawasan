# =============================================================================
# IBA Production Test Configuration
#
# Purpose:
#   Configuration for running IBA test scripts against the live production
#   environment at alpha.keycenter.ai. Contains Keycloak credentials, test
#   user accounts, and domain-specific settings.
#
# Used by:
#   - scripts/test_concurrency_production.py (main test runner)
#
# Environment:
#   - IBA API: https://alpha.keycenter.ai/api
#   - Keycloak: https://auth.keycenter.ai/auth (realm: keycenter)
#   - Client: web (ROPC grant)
#
# Test Users:
#   - Primary: user-test@pom.go.id (for sequential/single-user tests)
#   - Additional: user-test-1@pom.go.id through user-test-24@pom.go.id
#     (for multi-user and multiturn concurrent tests)
#
# Usage:
#   uv run python scripts/test_concurrency_production.py --config scripts/iba_test_config_production.yml
#
# Notes:
#   - domain_id is hardcoded (not auto-discovered from DB)
#   - service_path is empty because base_url already includes /api
#   - Credentials are for testing purposes only
# =============================================================================

